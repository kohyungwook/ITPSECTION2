<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITP Section 2 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 단일 컬럼 시험지 카드. 홈은 요약 → 모드 → 과 목록 순서 */
:root{
  --bg:#f3f4f7; --card:#ffffff; --ink:#1a2030; --muted:#5d667a; --line:#dde1ea;
  --accent:#2c4fd0; --accent-ink:#ffffff; --accent-soft:#e6ebfb;
  --good:#1d7a4c; --good-soft:#e1f3e9; --bad:#b4372f; --bad-soft:#fbe7e5; --mark:#e9a31c;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131a; --card:#181d27; --ink:#e8ebf3; --muted:#9aa3b8; --line:#2b3242;
    --accent:#7c97ff; --accent-ink:#0c1020; --accent-soft:#222b4a;
    --good:#58c58b; --good-soft:#17302a; --bad:#ff8d83; --bad-soft:#3a1f1f; --mark:#f0b84a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131a; --card:#181d27; --ink:#e8ebf3; --muted:#9aa3b8; --line:#2b3242;
  --accent:#7c97ff; --accent-ink:#0c1020; --accent-soft:#222b4a;
  --good:#58c58b; --good-soft:#17302a; --bad:#ff8d83; --bad-soft:#3a1f1f; --mark:#f0b84a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:780px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.4;cursor:default}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}

/* 홈 */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 18px}
.hero h1{font-size:26px;line-height:1.2}
.hero .sub{color:var(--muted);font-size:14px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.warn .v{color:var(--bad)}
.section-t{font-size:14px;font-weight:700;margin:22px 0 10px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;gap:2px}
.mode:hover{border-color:var(--accent)}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
.mode.exam{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode.exam span{color:inherit;opacity:.85}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.jump{display:flex;gap:8px;margin-left:auto}
.jump input{width:96px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;min-height:36px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.lesson{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lesson:hover{border-color:var(--accent)}
.lesson b{display:block;font-size:15px}
.lesson small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex;margin-top:8px}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .r{background:var(--bad)}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;min-height:32px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tab{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.tab b{font-size:16px}.tab span{font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab[aria-selected="true"] b{color:var(--accent)}
.secdesc{margin:0 0 16px;color:var(--muted);font-size:14px}
/* 문제 화면 */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topbar .ttl{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-bottom:14px;overflow:hidden}
.prog div{height:100%;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 22px}
.meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qno{font-variant-numeric:tabular-nums;font-weight:700;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 9px;font-size:14px}
.kind{font-size:13px;color:var(--muted)}
.note{font-size:12px;border:1px solid var(--mark);color:var(--mark);border-radius:5px;padding:0 6px}
.star{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;min-width:44px;min-height:44px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--mark)}
.inst{font-size:13px;color:var(--muted);margin:0 0 10px}
.q{font-family:var(--serif);font-size:21px;line-height:1.7;margin:0 0 18px}
.blank{display:inline-block;min-width:96px;border-bottom:2px solid var(--ink);text-align:center;padding:0 6px;margin:0 2px;color:var(--ink)}
.blank.filled{border-color:var(--good);color:var(--good);font-weight:600}
.seg{cursor:pointer;border-radius:4px;padding:1px 0}
.seg .u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.seg sup{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--accent);margin-left:2px}
.seg:hover{background:var(--accent-soft)}
.seg.sel{background:var(--accent-soft)}
.seg.ok{background:var(--good-soft)} .seg.ok sup{color:var(--good)}
.seg.no{background:var(--bad-soft);padding:1px 0} .seg.no sup{color:var(--bad)}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;min-height:48px}
.ch:hover:not([disabled]){border-color:var(--accent)}
.ch .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:1px}
.ch .t{font-family:var(--serif);font-size:18px;line-height:1.5;flex:1}
.ch.sel{border-color:var(--accent);background:var(--accent-soft)}
.ch.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch.ok{border-color:var(--good);background:var(--good-soft)}
.ch.ok .k{background:var(--good);border-color:var(--good);color:#fff}
.ch.no{border-color:var(--bad);background:var(--bad-soft)}
.ch.no .k{background:var(--bad);border-color:var(--bad);color:#fff}
.ch[disabled]{cursor:default}
.fb{margin-top:16px;padding:12px 14px;border-radius:10px;font-weight:700}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--ink);margin-top:2px;font-size:15px}
.exp{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;font-size:15px}
.exp .eh{margin:10px 0 4px}
.exp .eh b{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 8px;margin-right:8px}
.exp .eb{padding-left:14px;position:relative;margin:2px 0}
.exp .eb:before{content:"·";position:absolute;left:3px;color:var(--muted)}
.exp .ep{margin:2px 0;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pager .c{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:16px}
.navgrid button{min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums;font-size:14px}
.navgrid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.navgrid button.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.navgrid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

/* 결과 */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.score .big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.score .of{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(10,14,24,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--card);border-radius:14px;padding:20px;max-width:380px;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .q{font-size:19px}
  .ch .t{font-size:17px}
  .jump{margin-left:0;width:100%}
  .jump input{flex:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

wy flowers.\n밑줄친 부분을 분사구로 바꾸어 문두로 옮기면 (A)와 같이 된다.","lesson":1},{"n":7,"type":"error","note":false,"a":1,"fix":"discharge","exp":"해석: 간헐천은 폭발적인 증기와 뜨거운 물의 기둥을 간헐적으로 공중으로 분출한다.\n해설:\n* 주어가 복수이므로 동사에 s를 붙이지 않음.\n참고: air = 공기(물질로서의 개념) / the air = 공중, 우주 등을 의미함","lesson":1,"parts":[["Geysers ",null],["intermittently","A"],[" ",null],["discharges","B"],[" an explosive column of ",null],["steam","C"],[" and hot water ",null],["into the air","D"],[".",null]]},{"n":8,"type":"blank","stem":"In many cases, the formerly mysterious origins of diseases ------------------ through modern scientific techniques.","choices":["have now identified","have now been identified","have now being identified","have now been identifying"],"note":false,"a":1,"fix":"","exp":"해석: 많은 경우에 있어서, 전에는 신비스러웠던 병의 근원들이 현대 과학기술을 통해서 밝혀져왔다.\n해설:\n* \u003c병의 근원이 밝혀지다>는 수동태이므로 be + p.p.가 있는 동사를 답으로 골라야한다. 여기서는 현재완료 수동태를 사용했음.\n* (A)는 능동태이므로 안되고, (C)와 같은 모양의 동사는 영어에 없다. (D)도 또한 능동태(현재완료진행형)이므로 안됨.\n참고 : 동사의 갯수가 몇개 있든지 상관없이 끝에 있는 두 개가 be+p.p.의 모양이 되어야 수동태이다.","lesson":1},{"n":9,"type":"blank","stem":"Antonio Stradivari, ------------ to be the greatest violin maker of all time, worked in the Italian town of Cremona and made over 1,000 instruments during the course of his career.","choices":["who generally acknowledged","whose generally acknowledged","who is acknowledged general","who is generally acknowledged"],"note":false,"a":3,"fix":"","exp":"해석: 전시대(모든시대)에 걸쳐서 가장 위대한 바이얼린 제작자로 일반적으로 인정받고있는 안토니오 스트라디바리는 크레모나라는 이태리의 마을에서 일했고 그의 직업 경력동안에 1,000개 이상의 악기를 만들었다.\n해설:\n* 관계대명사 who 는 주격이고 동사는 be  acknowledged =(수동태)인정받다.\n* be acknowledged to be ... = ... 라고 인정받다\n* 문장의 주동사는 worked 와 made\n* career = \u003c(전문성을 띤)직업+경력>을 합성한 의미의 말.","lesson":1},{"n":10,"type":"blank","stem":"Although ---------------- , skin is often viewed as simply a barrier between the body and the outside world.","choices":["a part of the immune system","there is a part of the immune system","it is the part of a immune system","the immune system t","to find inhabited it"],"note":false,"a":1,"fix":"","exp":"해석: 콜럼부스가 신세계(아메리카 대륙)을 발견했을 때 그는 그곳에 사람이 살고 있는 것을 보고 놀라지 않았다. 그는 자기가 인도나 일본에 도착한 것으로 생각했었므로.\n해설: *\n\u003c --해서 놀라다> =  be surprised to V --.\n* find it inhabited 는 5형식이고 it 는 the New World를 의미함.\n\n* 3형식과 5형식의 관계 : People inhabited the New World. (능동태문장)을 수동태로 고쳐보면,\nThe New World was inhabited (by people). 이 된다. find를 사용해서 문장을 만들어보면:\n\nHe found (that) the window was broken. (3)\n S    V             O\n→ He found the window broken. (5) 로 변형할 수 있는 것과 같은 방식으로\n   S    V       O         O.C.\nHe found that the New World was inhabited.  (3)\n S    V                 O\n→ He found the New World inhabited. (5)  로 변형할 수 있다.\n    S   V          O          O.C.\n그러므로 find it inhabited 는 5형식으로 \u003c그 곳이 (사람들에 의해서) 거주되고 있는 것을 발견하다.(직역)> → 의역 \u003c그곳에 이미 사람들이 살고 있는 것을 발견하다.>\n참고 :\n* 쎄미콜론(;)은 접속사 대신 쓸 수 있으므로, 양쪽에 절을 연결할 때 중간에 사용할 수 있다.\n이 경우 쎄미콜론의 대신에 그 자리에 컴마(,)를 사용하면 틀린다.","lesson":1},{"n":16,"type":"blank","stem":"John F. Kennedy was only forty-two when he was inaugurated as president of the United State - the youngest person ------------- the presidency.","choices":["ever electing to","ever been elected to","who ever elected to","ever elected to"],"note":true,"a":3,"fix":"","exp":"해석: John F. Kennedy 는 미국대통령으로 취임했을 때 단지 42세였다.- 여태까지 대통령 직책에 선출되었던 가장 젊은 사람.\n해설:\n* be inaugurated = 취임하다.\n* president = 직책을 의미할 때는 관사를 쓰지 않는다.\n(예문1) I want to be president. = 그 사람이 되고 싶은 것이 아니고, 그 직책을 원함.\n(예문2) I met the president. = 그 사람을 만났다. 직책을 만난 것이 아님.\n\n* 쉽게 구별하려면, president 의 자리에 사람 이름을 대신 써봐서 말이 되면 (예문 2)에 해당하고, 말이 안되면 (예문 1)에 해당한다. 만화영화  Lion King의 주제가 중 \"I just can't wait to be king.\" 에서 처럼 king앞에 관사를 붙이지 않는다.\n* ever elected = 과거분사로써 앞의 the youngest person을 수식함. (아래 참고를 볼것.)\n* presidency = 대통령직\n참고 :\n* the youngest person 뒤에 who has ever been elected to the presidency. 의 모양에서 \u003c관계대명사의 주격과 be 동사>즉, who has been 을 생략하면 문제와 같은 모양이 된다.","lesson":1},{"n":17,"type":"error","note":false,"a":1,"fix":"so","exp":"해석 용하려면 다음과 같이 as 가 없을 경우에 우선 말이 성립되어야 한다.\n* I like this perfume very much. 여기서 very도 부사이고 much 도 부사인데 much 가 \u003c대단히> 의 뜻으로 동사 \u003c좋아하다>를 수식하므로 맞다. 이 때에 다른 무엇과 비교해서 \u003c그만큼 대단히>를 표현할 때는 as much를 쓸 수 있다.\n(예문) I like swimming very much, and also I like tennis as much.\n= 나는 수영을 좋아한다, 그리고 역시 테니스도 그만큼 좋아한다. .\n\n참고 : 형용사나 부사의 비교급은 very 로 수식하지 않고 much 로 수식한다.\n(예문 1) Tom is very smart. (O) --- very 로 원급을 수식하는 경우.\n(예문 2) Tom is much smarter than his brother. (O) --- much로 비교급을 수식하는 경우.\n(예문 3) Tom is very smarter than his brother. (X) --- very 로 비교급을 수식해서 틀렸음.","lesson":2},{"n":36,"type":"blank","note":true,"a":3,"fix":"","exp":"해석: 미국 교원연맹의 주요 목적은 교육에 있어서 전문성을 증진시키는 것과 그 연맹의 멤버들을 위한 적당한 임금과 더 나은 근로조건과 직업의 안정성 등을 보장해주는 것이다.\n해설:\n* The chief objectives of American Federation of Teachers = 주어. / are = 동사.\n* to promote --- 문장 끝까지 = 보어.\n* 둘째 줄의 and 에서 그 뒤에 오는 모양이 to V - 이므로 그 앞에도 같은 모양이 있는 것을 답으로 고른다.\n* (A)를 쓰면 문장 전체에 동사가 없어서 안된다.\n* 부정사 to secure --에서 secure 의 목적어는 3가지이다.\n* its 는 \u003c교원연맹이라는 기관>의 소유격.","lesson":2,"stem":"The chief objectives of American Federation of Teachers --------------------- professionalism in teaching and to secure appropriate wages, better working conditions, and job security for its members.","choices":["to promote","are promote","are promoting","are to promote"]},{"n":37,"type":"blank","stem":"A bright-red color, a trim of white fat, and -------------- are among the qualities of a good piece of beef.","choices":["a texture smooth, firm","a smooth, firm texture","a smooth texture firm","a texture of smooth and firm"],"note":false,"a":1,"fix":"","exp":"해석: 밝은 붉은색, 흰 지방이 잘 손질된 상태, 그리고 매끈하고 일정한 육질이 좋은 쇠고기의 특징들에 속한다.\n해설:\n* 주어는 A bright-red color, a trim of white fat, and a smooth, firm texture (복수)이고 동사는 are.\n* \u003cbe + among-->은 \u003c --에 속한다>로 해석함.\n* a smooth, firm texture에서는 \u003c a+형용사+형용사+명사 >의 모양이다. 명사 앞에 두 개의 형용사가 수식할 때는 아래 참고 (1), (2), (3) 과 같이 세가지 스타일이 모두 옳으며, 명사의 뒤에 형용사가 두 개 올 때는 참고에서 (4)번만이 옳은 형태이다.\n참고: * 형용사 두 개가 모여서 명 "achieve specific tasks","to achieve specific tasks"],"note":false,"a":2,"fix":"","exp":"해석: 호르몬들은 신체의 기능을 조절하거나 특별한 임무를 수행하는, 신체에서 만들어지는 화학물질이다.\n해설: 등위접속사 or 를 중심으로 양쪽에 대등한 모양을 찾기.\n* Hormones = 주어 / are =동사 / chemicals made in the body =보어 (made 앞에 which are 가 생략)\n* that regulate body functions or achieve specific tasks = that 이 이끄는 관계대명사절로서, 그 안에서 that 이 주어이고 동사와 목적어는 두 번 있다.\n즉, regulate body functions = 동사+목적어 / achieve specific tasks = 동사+목적어\n참고:  * 등위접속사 (and, or, but . . .)를 사용할 때는 그 양쪽으로 대응되는 역할을 하는 말이 있어야한다.","lesson":2},{"n":43,"type":"error","note":false,"a":3,"fix":"may be (띄어쓴다)","exp":"해석: 사람의 가슴에서 2분 이상 지속되는 불편한 압박감, 가득한(답답한)느낌, 쥐어짜는 듯한 느낌, 또는 고통 등은 하나의 심장마비의 징조일 수가 있다.\n해설:\n* (D) 의 maybe (붙여쓴 것)은 동사가 아니고 부사이므로, 위 글에서는 문장이 성립되지 않는다. 동사의 모양으로 만들려면, may 와 be를 띄어서 써야한다.\n* 문장 전체의 구조는 may be 가 동사이고 그 동사의 앞부분 전체가 주어인데, that lasts for two minutes or more 는 관계대명사절로서 that 의 앞부분 전체를 수식한다. 앞부분에서는 주어가 여러 개인 것 같지만, 사실은 주어가 단수이다.\n참고 : * \u003cA, B, C, or D> 와 같이 병렬로 연결된 모양에서는 or 로 연결되어 있으면 마지막에 있는 요소만이 실제 문법적인 주어의 역할을 한다. 만약 A, B, C, and D 처럼 and 로 연결 되어있는 경우에는 복수로 취급한다.","lesson":2,"parts":[["",null],["An uncomfortable","A"],[" pressure, fullness, squeezing, or ",null],["pain in","B"],[" the center of the chest ",null],["that lasts","C"],[" for two minutes or more ",null],["maybe","D"],[" a sign of a heart attack.",null]]},{"n":44,"type":"blank","stem":"About nineteen million people living in the US belong to a Spanish-speaking ethnic group and ---------------------- their first language.","choices":["Spanish names as","named Spanish as","name as Spanish","name Spanish as"],"note":false,"a":3,"fix":"","exp":"해석: 미국에 사는 사람들 중의 약 1900만 명이 스페인어를 말하는 인종그룹에 속하며 그들의 모국어로서 스페인어를 든다.\n해설:\n* 문장의 주어는 About nineteen million people living in the US 이고 living의 앞에 who are 가 생략된 것으로 볼 수도 있고 또는 who live 가 living 으로 변한 것으로 볼 수도 있다.\n* 동사는 belong 과 name 두 개이다.\n* 두 번째 동사 name 은 \u003c name A as B > 의 용법으로 \u003c B로서 A를 든다.>\n(예) She names her computer as her most valuable property. = 그녀는 자신의 가장 귀중한 재산으로서 컴퓨터를 든다.","lesson":2},{"n":45,"type":"error","note":false,"a":0,"fix":"Insects","exp":"해석: 곤충들은 (두 가지 하는데 있어서, 즉,) 인간을 위한 농작물을 수분시키는데 있어서 그리고 그들이 열매와 씨를 생산하도록 보장해주는 데에 있어서 중요한 역할을 한다.\n해설:\n* play a role (= play a part = have a role = have a part) + in V-ing = V 하는데 있어서 역할을 하다.\n* and 로 연결되는 대응되는 두 개의 요소는 동명사 pollinating 과 ensuring 이다.\n* ensure that S + V . . = S가 V하도록 보장하다. (확실히 할 수 있게 해주다)\n참고 : * fruit and seed 와 같은 말들 (즉, 가산명사도 될 수 있고 불가산 명사도 될 수 있는 명사)은 fruits and seeds 와 같이 복수형으로 쓸 수도 있다. 이러한 말들은 상황에 따라 글쓰는 이가 \u003c여러종류, 여러가지>의 개념을 사용할 때는 복수형으로 쓰고, 집합적으로 \u003c 열매와 씨 >를 총칭하는 의미로 사용할 때는 단수형도 좋다. 또한 이 경우는 (집합명사의 개념)에도 해당되고, (댓귀법의 개념)에도 역시 해당되기 때문에 단수형이라도 관사가 없이 사용하는 것이 맞다.","lesson":2,"parts":[["",null],["Insect","A"],[" play a vital role in ",null],["pollinating","B"],[" many ",null],["crops","C"],[" for humans and ",null],["ensuring","D"],[" that they produce fruit and seed.",null]]},{"n":46,"type":"blank","stem":"Heating and cooling can cause matter ------------------------.","choices":["expanding and contracting","expansion and contract","to expand and contract","expand and contract"],"note":true,"a":2,"fix":"","exp":"해석: 가열과 냉각은 물질을 팽창과 수축하게 만든다.\n해설: * 이 문장은 \u003c S + cause + O + to V > 의 5형식의 기본형.\n* can cause 가 문장의 동사이다. 목적어는 matter(물질)\n* cause 는 \u003c -의 원인이 되다, -을 야기하다, -로 하여금 -하도록 만든다.> 등으로 해석할 수 있음.\n참고 : * 만약 이때 cause 대신 make 를 사용하면, make 는 사역동사이므로 목적격보어에 to 가 없는 모양, 즉 (D)가 답이 된다.","lesson":2},{"n":47,"type":"blank","stem":"One of the primary materials used in the construction of buildings and roads is cement, --------------------- primarily from limestone and clay.","choices":["a powder made","it is a powder made","which made a powder","a powder is made"],"note":false,"a":0,"fix":"","exp":"해석: 건물과 도로를 건설하는 데 사용되는 주요 재료중의 하나는 시멘트인데 그것은 주로 석회석과 점토로부터 만들어지는 하나의 분말이다.\n해설:\n* 컴마(,) 의 앞부분까지가 완전한 문장의 형태를 갖춘 절이므로, 컴마의 뒤에 만약 절의 모양을 또 사용하려면, 컴마의 바로 뒤에 접속사나 접속사 역할을 하는 말이 필요하다. 따라서 우선적으로 (B)를 답에서 제외시킨다.\n* (A)를 사용할 경우, cement 와 a powder 가 동격이 되어 문장이 성립되고, a powder 와 made 사이에 다음과 같이 넣어보면 이해하기 쉽다.  \u003c a powder (which is) made --- >\n참고 : 동격의 말은 문장의 주어에서만 해당하는 것이 아니고 보어나 목적어 등에도 사용할 수 있다.","lesson":2},{"n":48,"type":"error","note":false,"a":3,"fix":"improve","exp":"해석: UN의 특별 기관으로서 1945년에 설립된 국제 통화 기금(IMF)는 국제수지의 어려움에 처한 회원국들에게 금융(융자)을 가능하게 해주고 그들의 경제적 운영을 향상시키기 위한 기술적 원조를 제공한다.\n해설:\n* Established in Dec. 1945 as a specialized agency of the United Nations = (수동태 분사구) UN의 특별기관으로서 1945년에 설립된.\n* International Monetary Fund (IMF) = 주어 (국제 통화 기금) , 동사는 makes 와 provides 두 개.\n* makes financing available = (5 형식) 금융(융자)을 가능하게 해준다.\n* balance-of-payments = 국제수지\n* to members in balance-of-payments difficulties = 국제수지의 어려움에 처한 회원국들에게\n* provides technical assistance to improve their economic management = 그들의 경제적 운영을 향상시키기 위한 기술적 원조를 제공한다.\n참고: 위의 문장은 다음과 같은 문장의 변형으로 볼 수도 있다.\nInternational Monetary Fund (IMF), which was established in Dec. 1945 as a specialized agency of the United Nations, makes -------------------.\n여기서 which was 를 생략하고 컴마 사이에 있는 말들을 문두로 옮기면 문제와 같이 된다.","lesson":2,"parts":[["Established ",null],["in","A"],[" Dec. 1945 as a specialized agency of the United Nations, International Monetary Fund (IMF) ",null],["makes","B"],[" ",null],["financing","C"],[" available to members in balance-of-payments difficulties and provides technical assistance to ",null],["improvement","D"],[" their economic management.",null]]},{"n":49,"type":"blank","stem":"----------------------- and constant component of protein, measuring nitrogen can be a good way of finding out the protein content in a substance.","choices":["Nitrogen is a characteristic","Since nitrogen is a characteristic","While it is a characteristic","Nitrogen's characteristic"],"note":false,"a":1,"fix":"","exp":"해석: 질소는 단백질에 있어서의 특징적이고 일정한 (변함없는) 성분이므로, 질소를 측정하는 것이 어떤 물질에 있어서의 단백질 함량을 알아내는 좋은 방법이 될 수 있다.\n해설:\n문장의 처음부터 컴마까지는 since 가 이끄는 이유의 부사절이고, 주절의 주어는\n동명사 measuring nitrogen = 질소를 측정하는 것.\n참고 : a good way of V-ing = V 하는 좋은 방법.","lesson":2},{"n":50,"type":"error","note":false,"a":2,"fix":"considered","exp":"해석: 스티븐 스필버그 ― 그의 대단히 성공적인 영화들이 대중영화에 새로운 존경받을 만한 호소력을 제공한 ― 는 미국에서 가장 훌륭한 영화감독 중의 하나로 간주된다.\n해설:\n* 컴마의 사이에 끼어있는 관계대명사절을 제외한 나머지 부분을 능동태로 쓰면\nPeople consider Steven Spielberg one of the best movie directors in the United States.\n   S    V           O                        O.C.\n= 사람들이 스티븐 스필버그를 미국에서 가장 훌륭한 영화 감독 중의 하나로 간주한다.\n이것을 수동태로 고쳤을 경우\nSteven Spielberg is considered one of the best movie directors in the United States. 가 되는데\n여기서 considered 뒤에 by 가 없어야 의미가 통한다.\n(만약에 by 가 있으면 \u003c미국에서 가장 최고의 영화감독중의 하나에 의해서 간주된다.>와 같이\n이상한 해석이 됨)\n* whose highly successful films have given popular cinema a new respectable appeal\n            S                     V            I.O.               D.O.\n= (4형식) 그의 대단히 성공적인 영화들이 대중영화에 새로운 존경받을 만한 호소력을 제공했다.\n\n참고 : 일반적으로 수동태의 동사 뒤에는 전치사 없이 명사가 바로 오는 경우가 드물지만\n\u003c S + considers + A + B > 의 형태로 된 문장을 수동태로 고치면 A is considered B (by S). 와 같이 수동태의 동사 뒤에 명사(B)가 오게 된다.","lesson":2,"parts":[["Steven Spielberg, whose ",null],["highly","A"],[" successful films ",null],["have given","B"],[" popular cinema a new respectable appeal, is ",null],["considered by","C"],[" one of the best ",null],["movie directors","D"],[" in the United States.",null]]},{"n":51,"type":"blank","stem":"If they wish to make a profit, both large and small purveyors of consumer products and services must find ways to let their potential consumers ----------------------------- .","choices":["who know about their business","know about their business","to know about their business","knowing about their business"],"note":true,"a":1,"fix":"","exp":"해석: 그들이 이익을 얻기를 바란다면, 대규모 또는 소규모의 소비자 상품및 서비스의 공급업자들은 그들의 잠재적 소비자들에게 그들의 비즈니스에 관해서 알도록 하는 방법을 찾아야만 한다.\n해설:\n* \u003c let + O + V원형 > 의 모양.\n* let 은 사역동사이고 목적격보어로서 동사의 원형을 사용한다.\n* 주절에서 주어는 both large and small purveyors of consumer products and services 이고, 동사는 must find 이며, 그 이하 나머지는 모두 목적어이다.\n* ways to let their potential consumers know about their business =그들의 잠재적 소비자들에게 그들의 비즈니스에 관해서 알도록 하는 방법","lesson":2},{"n":52,"type":"error","note":false,"a":3,"fix":"in","exp":"해석: 세상의 열대 삼림의 반 이상이 지난 50년 동안에 파괴되었다.\n해설:\n* More than half the world's tropical forests =세상의 열대 삼림의 반 이상\n*  in the past fifty years = 지난 50년 동안 (50년간) (또는 전치사를 for 나 during 을 쓸 수도 있다)\n* since를 사용할 경우에는 그 뒤에 과거의 어느 시점이 와야 하는데 \u003c지난 50년>은 \u003c과거의 시점>이 아니고 \u003c시간의 크기>를 나타낸다.\n참고 : * since 가 전치사이면 뒤에 과거의 시점이나 명사를 사용하여 \u003c-이래로 여태까지 > 의 의미로 사용하고, since 가 접속사이면 부사절을 이끄는데, 다음과 같이 두 가지 경우가 있다.\n(1) 이유를 나타낼 때 (= because 와 같은 의미)\nSince we had no more funds, we couldn't continue the project.\n(2) 과거부터 현재까지 해온 완료의 동작을 의미할 때 = since 가 이끄는 부사절은 과거형으로 쓰고 주절은 현재완료형을 사용한다.\nSince we came to this country, we have made lots of foreign friends.","lesson":2,"parts":[["More than ",null],["half the world's","A"],[" tropical ",null],["forests","B"],[" have been ",null],["destroyed","C"],[" ",null],["since","D"],[" the past fifty years.",null]]},{"n":53,"type":"blank","stem":"------------------------ vertebrates to try out life on land, but even then they had to return to the water to breed, just like most of today's amphibians.","choices":["The amphibians which","The amphibians, the first","The amphibians were the first","Although the amphibians were the first"],"note":false,"a":2,"fix":"","exp":"해석: 양서류는 육상에서의 생활을 시도한 첫 번째의 척추동물이었다, 그러나 그 때에도 그들은 번식을 하기 위해서는 물로 돌아가야만 했다, 마치 오늘날의 대부분 양서류처럼.\n해설:\n* 문장 중간의 but 은 등위접속사인데 그 뒤에 주어(they)와 동사(had to return) 가 있어서 뒤에 완전한 하나의 절이 있으므로 등위접속사의 앞부분에도 절의 모양이 있어야 한다.\n* (D) 와 같이 앞에 부사절 접속사(although)를 사용하면 안됨. 만약 앞에 Although를 쓰려면 중간의 but을 빼야한다.\n참고: 어원 vert- 는 \u003c곧음, 수직, 척추 > 등을 의미하는 말로서 여기에서 유래하는 단어는 vertebra(척추), vertebrate(척추동물), vertex(정점), vertical(수직선), vertiport(수직이착륙 비행장)등이 있다.","lesson":2},{"n":54,"type":"error","note":false,"a":2,"fix":"jump down","exp":"해석: 레이저라는 용어는 light amplification by stimulated emission of radiation (복사선의 자극된 방출에 의한 빛의 증폭)의 약자(첫 글자를 따온 것)이다. 즉, 원자들은 어떤 전자들이 더 낮은 에너지 단계로 옮겨갈 때 빛의 광자를 발산한다.\n해설:\n* when 이하가 부사절인데 주어는 some electrons 이고 동사가 잘못되어 있다. 동사를 jump down으로 고쳐야함.\n* stand for = -를 상징하다, --를 대신하다, --의 약자이다.\n참고 : * 콜론(:)은 앞에 나온 문장의 전체 또는 일부를 추가적으로 자세히 설명할 때 사용하는 것으로 TOEFL 시험에서는 항상 콜론의 앞부분만으로 문장의 모양이 성립하게 되어있다.","lesson":2,"parts":[["The term laser ",null],["stands for","A"],[" light amplification by stimulated emission of radiation : atoms ",null],["emit","B"],[" photons of light when some electrons ",null],["jumping down","C"],[" to ",null],["lower","D"],[" energy levels.",null]]},{"n":55,"type":"blank","stem":"Rachel Louise Carson was an aquatic biologist, naturalist, and writer whose Silent Spring (1962) sparked an international controversy over --------------- animals and human life.","choices":["the effect of pesticides on","the effect on pesticides","effecting of pesticides on","what effects on pesticides"],"note":false,"a":0,"fix":"","exp":"해석: Rachel 는 수상생물학자이며, 박물학자이며, 작가였는데, 그 사람의 1962년도 Silent Spring\n이라는 작품이 동물과 인간에게 끼치는 농약의 영향에 관한 국제적인 논란에 불을 붙였다.\n해설:\nwhose 부터가 관계사절이고 그 절에서 whose Silent Spring 이 주어이고 동사는 sparked (불을 붙이다)이다.\n* 그 뒤의 an international controversy over -- = (목적어) --에 관한 국제적인 논란.\n* 여기서 전치사 over 는 about 의 뜻.\n* the effect of A on B = the effect (that) A has on B = B에 끼치는 A의 영향.\n참고 :\n* 영문법에서, 문학, 미술, 영화, 음악 등등 작품의 제목은 이탤릭체로 쓴다.\n* -cide 는 (죽임)을 의미하는 어원으로서 다음과 같은 예가 있다.\nhomicide(살인), suicide (자살), insecticide(농약), pesticide(농약), parenticide(존속살해) 등등.","lesson":2},{"n":56,"type":"blank","stem":"Population expansion and ------------------- for scarce resources is one of the biggest problems facing the world today.","choices":["the competition consequentially","consequentially competing","to compete consequentially","the consequential competition"],"note":true,"a":3,"fix":"","exp":"해석: 인구의 팽창과 그에 따라 생기는 부족한 자원에 대한 경쟁이 오늘날 세상에 직면하고 있는 가장 큰 문제들 중의 하나이다.\n해설:\n* 동사 is 의 앞부분 전체가 주어이다.\n* 두 개의 명사(인구팽창 + 그에 따라 생기는 부족한 자원에 대한 경쟁)가 합쳐서 의미상 하나와 같은 역할을 하므로 단수로 취급했음.\n* facing = which face 의 변형으로 볼 수도 있음(여기서 face 는 동사).\n* consequential (형) = consequent(형) 의 동의어로서 \u003c그에 따라 결과적으로 생기는>\n참고:\n* consequent 와 약간 다른 subsequent 는 \u003c그 뒤에 계속 이은>을 의미하는 형용사.","lesson":2},{"n":57,"type":"blank","stem":"Vital to animals and plants in many ways, lipids are ------------ and yield about twice as many calories as an equal weight of protein or carbohydrate.","choices":["concentrated energy of food source","concentrating source food energy","a concentrated source of food energy","what a concentrated source of food energy"],"note":false,"a":2,"fix":"","exp":"해석: 여러 면에서 동물과 식물에 중요한, 지질은 농축된 음식에너지의 근원이며 같은 무게의 단백질이나 탄수화물보다 두 배나 많은 칼로리를 낸다.\n해설:\nVital to animals and plants in many ways 는 분사구로서 다음과 같이 볼 수 있음.\n* Lipids, (which are) vital to animals and plants in many ways, are --- 에서 괄호친 which are 를 생략하고 나머지 밑줄친 부분을 문 두로 옮긴 분사구로 볼 수 있다.\n* vital = very important\n* 문제의 문장처럼, 주어가 복수일 때, 동사를 복수로 쓰고 보어를 단수로 써도 문법적으로 맞다.\n* 이 문장에서 동사는 두 개. ( are 와 yield )\n* twice as -- as ～ = 배수의 표현 (～의 몇 배 되는 --)\n* an equal weight of protein or carbohydrate = 동등한 무게의 단백질이나 탄수화물.\n참고 :\n배수의 표현은 다음과 같이 방식들이 있다.\n1. To buy the car, John needs three times as much money as he has now.\n2. To buy the car, John needs three times the amount of money he has now.\n3. To buy the car, John needs three times more money than he has now. (흔히 사용하지 않음)","lesson":2},{"n":58,"type":"error","note":false,"a":1,"fix":"more victories","exp":"해석: 에디 로빈슨은 대학 풋볼 역사상 어느 다른 코치보다도 그의 팀을 더 많은 승리로 이끌었다.\n해설:\n* coach his team to victories = 그의 팀을 지도해서 승리로 이끌다. (여기서 coach 는 동사. 코치하다, 지도하다)\n참고: 비교급 뒤의 any other 는 보통 그 뒤에 단수를 사용하며 \u003c최상급의 의미>를 가져서 \u003c어느 누구보다도 가장 --하다.>와 같이 해석함.","lesson":2,"parts":[["Eddie Robinson ",null],["has coached","A"],[" his teams to ",null],["many victories","B"],[" than ",null],["any other","C"],[" coach ",null],["in college football","D"],[" history.",null]]},{"n":59,"type":"blank","stem":"One of the great engineering feats of the world, the 44-mile Panama Canal bisects the continents of North and South America, ---------------------------------- to sail between the Atlantic and Pacific Oceans.","choices":["making it possible for ships","made it possible for ships","it made it possible for ships","making possibility for ships"],"note":false,"a":0,"fix":"","exp":"해석: 세상의 위대한 공학 기술의 업적 중의 하나인 44마일의 파나마운하는 북미와 남미 대륙을 반으로 갈라놓으며, 배들이 태평양과 대서양 사이를 항해하는 것을 가능하게 해준다.\n해설:\n* One of the great engineering feats of the world 와 the 44-mile Panama Canal 은 동격.\n* bisect = 둘로 가르다. 어원 bi = two를 의미하고, -sect = 자르다, 구분하다 등을 의미함.\n* 빈칸 앞까지의 부부이 완전한 하나의 절이므로, 빈칸부터 다시 또 절의 모양을 사용하려면 접속사가 필요하므로 (C)는 답에서 우선 제외.\n* 답(A) 는 분사구로서 \u003c그래서 --한다> \u003c그리고 --한다> 처럼 해석하면 된다.\n* \u003c--하는 것을 가능하게 하다>는 원래 \u003c make O + possible > 의 5형식인데, 여기서는 가목적어 it를 사용함으로써 부정사가 문장 뒤로 옮겨갔음.\n* for ships 는 부정사의 의미상 주어. make possible 사이에 it 를 넣는 것은 뒤에 부정사 (to V) 가 있기 때문이고 만약 부정사가 아니고 명사가 있으면 아래 참고의 (예문2) 와 같이 it를 사용하지 않는다.\n\n참고 : (예문1) Computers make it easier to arrange and analyze complicated data.\n                                                \u003c 5형식의 목적어가 부정사임 >\n       (예문2) Computers make easier the arrangement and analysis of complicated data.\n                                             \u003c 5형식의 목적어가 부정사가 아니고 명사임 >\n               * make 와 easier 사이에 it 를 쓰지 않음.","lesson":2},{"n":60,"type":"error","note":false,"a":2,"fix":"adequately","exp":"해석: 많은 예술적인 천재들의 경우와 마찬가지로, 애드가 알란 포우도 자신의 시대에서는 올바로 평가받지 못했다, 많은 그의 동시대 사람들은 그를 병적이고 지나치다고 비판했다.\n해설:\n* As 가 부사절 접속사로서 \u003c --인바와 같이> \u003c --와 마찬가지로 > 등의 의미일 때는 as 뒤에 주어가 없이 동사를 바로 쓸 수 있다.\n* 특히 as is the case with -- 는 \u003c --의 경우와 마찬가지로 >의 뜻으로 숙어처럼 흔히 사용한다.\n여기서는 이것을 현재완료로 고쳐 사용했음.\n* be appreciated = 수동태로서 \u003c인정받다, 평가받다> 두 개 또는 그 이상의 개수로 이루어지는 동사들은 그 사이에 부사(또는 부사구)만이 들어갈 수 있다. 따라서 adequate를 adequately로 고쳐야한다.\n* adequately = 올바르게, 적당하게.\n* contemporaries = 동시대의 사람들.\n* criticize A as B = A를 B라고 비판하다. (여기서 B의 자리에는 대개 명사, 형용사, 분사 등이 사용되고 때때로 \u003cbeing + 명사, 형용사, 분사> 등도 사용함)\n* morbid = (정신적으로) 병에 걸린 듯이 비정상적인.\n* excessive = 지나친, 과도한.\n참고 : * han Jane. = 그는 제인 이외의 아무하고도 춤추고 싶어하지 않는다. 즉, Jane 만 원한다.","lesson":3,"parts":[["In traditional Japanese ink drawings, the artist ",null],["tries to","A"],[" paint ",null],["a state","B"],[" of mind ",null],["other than","C"],[" an exact copy of some ",null],["object","D"],[".",null]]},{"n":65,"type":"error","note":false,"a":1,"fix":"listening to","exp":"해석: 관객은 \u003c 미리 마련된 프로그램에 따라 어떤 진행되는 것들을 \u003c듣는> 또는 \u003c구경하는> 목적을 가지고서 모이는 사람들을 의미한다는 점에 있어서 군중과는 다르다.\n해설:\n* An audience is different from a crowd =(주절) 관객은 군중과는 다르다.\n* in that =(부사절 접속사) --라는 점에 있어서\n* it =관객\n* refers to = --를 의미하다. --를 지칭하다.\n* people who gather for the purpose of listening to or observing some proceedings = 어떤 진행되는 것들을 \u003c듣는> 또는 \u003c구경하는> 목적을 가지고서 모이는 사람들.\n* listening to 와 observing 은 두 개의 동명사가 some proceedings 을 공통으로 목적어로 가지므로 listening to 에서 to 가 없으면 some proceedings 를 목적어로 연결할 수가 없다.\n* in accordance with = (전치사구) --에 따라, --에 따라서.\n* in accordance with a program (which is) set in advance = 미리 마련된 프로그램에 따라.\n참고 :\n* in accordance with ～ = according to ～","lesson":3,"parts":[["An audience is different from a crowd ",null],["in that","A"],[" it refers to people who gather for the purpose of ",null],["listening","B"],[" or observing some proceedings ",null],["in accordance","C"],[" with a program ",null],["set","D"],[" in advance.",null]]},{"n":66,"type":"blank","stem":"Calcium is a soft, silvery-white metallic element ------------ in such rocks as limestone and marble.","choices":["found most widely","which found most widely","finding most widely","most found widely"],"note":true,"a":0,"fix":"","exp":"해석: 칼슘은 석회석이나 대리석과 같은 그런 바위에서 가장 널리 발견되는 부드럽고, 은백색의 금속원소이다.\n해설:\n* (A)의 found 앞에 which is 를 넣어보면 문장이 성립되는 것을 알 수 있다.\n* (B)는 is 가 없어서 잘못.\n참고: \u003c관계대명사의 주격과 be동사>를 생략할 수 있다.","lesson":3},{"n":67,"type":"blank","stem":"--------------------, also called a carrousel, basically consists of brightly painted horses and other animals mounted on a circular platform.","choices":["Because a merry-go-round","While a merry-go-round","On a merry-go-round","A merry-go-round"],"note":false,"a":3,"fix":"","exp":"해석: 회전목마- carrousel 이라고도 불리는 - 는 기초적으로 둥근 판 위에 올려져있는, 밝은 색으로 칠해진 말들과 다른 동물들로 구성된다.\n해설:\n* 문장의 동사는 called 가 아니고 두 번째 컴마 뒤의 consists of 이다. 따라서 빈칸에는 주어가 필요함.\n* 뒷 부분의 mounted 앞에 which are를 넣어도 된다. 66번과 같은 원리.\n참고 :\n* brightly painted horses and other animals 에서 brightly 와 painted 사이에 하이픈(-)을 넣어서 두 단어를 하나로 연결해도 된다.\n이 경우는 \u003c부사 + 형용사 + 명사> 의 정상어순이므로 하이픈이 있어도 되고 없어도 되지만,\n다음과 같은 경우는 하이픈을 꼭 넣어야만 한다.\nCarnivores are meat-eating animals. (육식동물은 고기를 먹는 동물이다.)\n이 경우 meat 는 명사이고, eating은 분사(일종의 형용사)이므로, 원칙적으로 수식 관계가\n성립하지 않는 (원래 명사가 형용사를 수식할 수 없는 것이므로) 두 개의 단어를 합쳐서\n하나의 의미를 나타낼 때는 두 단어를 하이픈으로 연결해서 유사분사로 만드는 것이다.","lesson":3},{"n":68,"type":"error","note":false,"a":0,"fix":"fame","exp":"해석: 브라질의 운동선수인 펠레는 자기시대의 가장 위대한 축구선수로서 그리고 세계 스포츠의 가장 인정받는 운동선수로서 명성을 얻었다.\n해설:\n* 동사 won의 목적어로서 형용사가 아닌 명사가 필요함.\n* 만약 famous를 그대로 사용하려면 동사를 became 등으로 바꿔야한다.\n\n참고:\n(1) 주어와 동격의 명사를 사용할 때,\n\u003c고유명사(이름) + 직업> 의 순서이면 둘째 명사의 양쪽에 반드시 컴마를 써야하고,\n\u003c 직업 +고유명사(이름)> 의 순서이면, 두 명사 사이에 컴마가 없어도 되고 있어도 된다.\n두 번째 경우에 앞에 있는 명사(직업)앞에는 a, an, the를 써도 되고 안써도 된다.\n\n(2) 주어와 동격의 명사를 사용할 때,\n\u003c고유명사(이름) + 직책(대통령, 정부관리등)> 의 순서이면 둘째 명사의 양쪽에 반드시 컴마를 써야하고,\n\u003c 직책 +고유명사(이름)> 의 순서이면, 두 명사 사이에 컴마가 없어야 된다.\n두 번째 경우에 앞에 있는 명사(직책)앞에는 a, an, the 등을 쓰지 않는다.","lesson":3,"parts":[["Pele, a Brazilian athlete, won ",null],["famous","A"],[" ",null],["as","B"],[" the greatest soccer player of ",null],["his","C"],[" time and the most ",null],["recognized","D"],[" athlete in world sports.",null]]},{"n":69,"type":"error","note":false,"a":2,"fix":"striving","exp":"해석: Gordon Allport 라는 사람은, \u003c한 인간은 환경적인 힘의 기계적인 산물이 아니고, 자신의 잠재력을 개발하려고 노력하는 독창적인 세력(힘)이다> 라고 믿었다.\n해설:\n* not --but--의 용법으로서  \u003c S is not A but B > 의 모양이다.\n* 여기서 A에 해당하는 것은 a mechanical product of environmental forces 이고 B에 해당하는 것은\na unique force who strives to develop his or her own potential 이다. 밑줄 친 부분을 한 단어로 쓰면 striving 이 된다.\n* strive to V = try to V (--하려고 노력하다)\n* potential  = 명사로 사용되면 \u003c잠재력, 가능성>등을 의미함.\n참고 :\n관계대명사와 동사를 현재분사로 바꿀 수 있다.\n(예) Students who want to buy this magazine should see Mr. Gilbert.\n    = Students wanting to buy this magazine should see Mr. Gilbert.","lesson":3,"parts":[["Gordon Allport believed that a person is not a mechanical product of ",null],["environmental","A"],[" forces, but ",null],["a","B"],[" unique force ",null],["strives","C"],[" to develop his or her own ",null],["potential","D"],[".",null]]},{"n":70,"type":"blank","stem":"American Farm Bureau Federation works to protect and advance the business and economic interests of farmers and ranchers by supporting educational programs, promoting favorable legislation, and --------------------.","choices":["it sponsors helpful services","sponsoring helpful services","sponsors helpful services","sponsor of helpful services"],"note":false,"a":1,"fix":"","exp":"해석: 미국 농업연맹은 \u003c(1)교육적 프로그램을 지원함으로써 (2) 유리한 입법을 증진함으로써\n(3) 원조적인 서비스를 후원해 줌으로써> 농부들과 목축업자들의 사업과 경제적 이익을 보호하고 발전시키기 위해서 일한다.\n해설:\n문제를 푸는 핵심은 by뒤에 두 개의 동명사가 접속사 없이 컴마(,)로 연결되어 있다는 사실을 파악하고, 따라서 그 뒤에는 등위접속사(and, or, but 등) 와 또 하나의 동명사가 있을 것이라고 추리하는 것이다.\n\n* 전치사 by에 동명사를 3번 사용한 연결법.\n(1) supporting educational programs, (2) promoting favorable legislation, and (3) sponsoring helpful services\n* 만약 (A)와 같이 and it sponsors helpful services 와 같은 모양을 사용하려면 그 앞에 있는 동명사 두 개 supporting educational programs 과 promoting favorable legislation의 연결법이 잘못되었다. (접속사 없이 대등한 두 개의 요소를 연결하면 안됨). 그렇게 하려면 두 개의 동명사 사이에 또 하나의 and 가 필요하다.\n\n* (C)를 사용하면, 문장의 맨 앞에 있는 주어 American Farm Bureau Federation 에 주동사를 두 번 쓴 것이 되는데 ( works 와 sponsors), 역시 (A)를 사용하는 경우처럼, 동명사 두 개 supporting educational programs 과 promoting favorable legislation의 연결법이 잘못되었다.\n* (D)를 사용해도 같은 방식으로 두 개의 동명사의 연결이 문법적 오류가 된다.","lesson":3},{"n":71,"type":"blank","stem":"Scientists in Germany have announced that they developed a combination of medications to -----------------.","choices":["cure AIDS patients in the dreadful, fatal disease","cure AIDS patients with the dreadful, fatal disease","cure AIDS patients of the dreadful, fatal disease","cure AIDS patients during the dreadful, fatal disease"],"note":true,"a":2,"fix":"","exp":"해석: 독일의 과학자들은 에이즈 환자들로부터 그 끔찍하고 치명적인 병을 치료할, 한 조합체의 의약품을 개발했다고 발표했다.\n해설:\n* \u003c cure A (환자) of B (병) > 의 모양이 옳다.\n* (B)는 \u003c 그 끔찍하고 치명적인 병을 가진 에이즈 환자 > 와 같이 해석되어 이상함. \u003c 그 끔찍하고 치명적인 병을 가지지 않은 에이즈 환자도 있다. > 는 것처럼 들린다. 환자의 앞에 AIDS 가 없거나, 뒤에 with the dreadful, fatal disease 이 없으면 가능하다.\n참고:\n\"제거\" 의 OF  :  deprive A of B  --------- A 에게서 B를 빼앗다.\n(예문1). A serious traffic accident deprived him of his eyesight. (그에게서 시력을 빼앗다.)\n(예문2). Two juvenile gangsters robbed the lady of some cash. (강도, 강탈하다)\n(예문3). Modern technology relieve us of many chores. (현대 과학기술이 우리에게서 많은 잡일들을 덜어준다.)","lesson":3},{"n":72,"type":"blank","stem":"Jerome Kern's most famous work is Showboat, -----------------, most enduring musical comedies.","choices":["one of the best","one of the best and","it is one of the best","the best one"],"note":false,"a":0,"fix":"","exp":"해석: \"제롬 컨\"의 가장 유명한 작품은 Showboat 인데, 그것은 가장 최고이며 가장 지속적인 뮤지컬 코미디 중의 하나이다.\n해설:\n* 첫째 컴마의 앞에는 이미 문장의 형태가 구성되어 있고, 그 나머지는 Showboat 와 동격의 말이다.\n* 첫째 컴마의 바로 뒤에 which is 를 넣어도 문장은 성립한다.\n* 가장 주의할 것은 (A) 를 넣었을 경우에 the best 와 most enduring 사이의 컴마는 두개의 형용사를 연결하는 컴마로서 그 컴마의 자리는 의미상 분리되는 부분이 아니다.\n* 형용사와 형용사를 연속 연결할 때 컴마를 사용하는 것은 현대 영어에서 가장 흔한 방식이다.\n* (B) 와 같이 and 로써 연결하려면 두 개의 형용사 the best 와 most enduring 사이의 컴마가 없어야된다.  \u003c형용사의 연결법>\n* (C) 를 사용하면, 첫째 컴마의 앞과 뒤에 각각 문장의 모양 (즉, 두개의 절이 있는데) \u003c두개의 절을 컴마로 연결하면 안된다.> 는 규칙에 위배.","lesson":3},{"n":73,"type":"error","note":false,"a":2,"fix":"to reach 또는 reach","exp":"해석: \"협동'이란 어떤 일을 수행하기 위해서 또는 공통으로 중요시되는 목적에 도달하기 위해서,\n둘 또는 그 이상의 사람들의 공동 노력이다.\n해설:\n(C)의 앞에 있는 or (등위접속사)를 중심으로 양쪽에 대응되는 요소(모양)이 필요하다.\n다음 두 가지중의 하나로 보면 이해하기 쉽다.\n* Cooperation is the mutual endeavor of two or more persons / to perform a task or to reach a jointly cherished goal.\n* Cooperation is the mutual endeavor of two or more persons to / perform a task or reach a jointly cherished goal.\n* a jointly cherished goal = 공통으로 중요시되는 목적.\n \u003c a + 부사 + 형용사 + 명사 >로써 매우 정상적인 어순이다.\n (예) a very tall man = \u003c a + 부사 + 형용사 + 명사 >","lesson":3,"parts":[["Cooperation is the mutual endeavor of two ",null],["or","A"],[" more ",null],["persons","B"],[" to perform a task or ",null],["reaching","C"],[" a ",null],["jointly","D"],[" cherished goal.",null]]},{"n":74,"type":"error","note":false,"a":0,"fix":"it 를 없앤다.","exp":"해석: 두 개의 렌즈의 조합이 하나의 렌즈로 성취될 수 있는 것보다 더 훌륭한 확대효과를 가능하게 한다.\n해설:\n원래 문장은,\nThe combination of two lenses (주어)/ makes (동사) / greater magnification than can be achieved with a single lens (목적어) / possible (목적격보어)\n의 구성으로 된 5형식이지만 목적어가 길고 복잡해서 문장의 뒤로 옮겼는데 \u003c5형식의 목적어가 명사이면 문장의 뒷부분으로 옮기더라도 가목적어(it) 를 사용하지 않는다.> 는 규칙.\n\n참고 :\n* 5형식의 목적어가 부정사(to V) 또는 명사절일 경우에는 문장의 뒷부분으로 옮기고 원래 목적어가 있던 자리에 가목적어(it) 를 사용해야 한다.\n(예문 1) Computers have made the analysis of data easier. (O)   (5형식의 목적어가 명사임)\n(예문 2) Computers have made easier the analysis of data. (O)   (5형식의 목적어가 명사인데 뒤로 옮겼음)\n(예문 3) Computers have made it easier the analysis of data. (X)  (5형식의 목적어가 명사인데 뒤로 옮겼는데, 가목적어를 사용해서 틀렸음)\n(예문 4) Computers have made to analyze data easier. (X)   (5형식의 목적어가 부정사임 - 틀린 문장)\n(예문 5) Computers have made it easier to analyze data. (O)  (5형식의 목적어가 부정사인데 목적어를 뒤로 옮기고 가목적어를 사용했음)","lesson":3,"parts":[["The combination of two lenses makes ",null],["it","A"],[" possible greater ",null],["magnification","B"],[" ",null],["than","C"],[" can be achieved with ",null],["a single","D"],[" lens.",null]]},{"n":75,"type":"error","note":false,"a":1,"fix":"was known 또는 had been known","exp":"해석: 조명의 근원으로서 전기의 잠재능력은 전기가 (실제로) 사용되기 오래 전에 알려졌다.\n해설:\n* long before 뒤에 절 ( S+V --) 이 있으므로 이때 long before 는 접속사이고 그 뒤는 부사절이다.\n따라서 앞부분에 주절이 있어야 하는데 Electricity's potential as a source of illumination 가 주어이고 그 뒤에 동사의 모양이 제대로 되어 있지 않다.\n* known 은 과거분사이므로 혼자서는 동사가 될 수 없다. 여기서는 수동의 의미이므로 앞에 동사와 함께 써야한다.\n* came into use = 사용하게 되다.\n참고 :\n* 분사(현재분사와 과거분사)는 단독으로 사용되면 형용사의 역할을 하고, 그 앞에 be 동사나 have 가 있어야 합쳐서 동사가 될 수 있다.","lesson":3,"parts":[["Electricity's ",null],["potential","A"],[" as a source of illumination ",null],["known","B"],[" ",null],["long","C"],[" before electricity came into ",null],["use","D"],[".",null]]},{"n":76,"type":"error","note":true,"a":0,"fix":"don't lie","exp":"해석: 낭상엽식물의 잎들은 평평하게 놓이지 않는다. 그들은 튜브모양으로 말려서 결코 펴지지 않는다.\n해설:\n* 주어가 복수이므로 동사는 don't lie.\n참고:\n* 세미콜론(;)은 절과 절을 연결하는 접속사 대신 사용할 수 있다.","lesson":3,"parts":[["The leaves of the pitcher plant ",null],["doesn't lie","A"],[" flat ; they ",null],["curl up","B"],[" into tubes and ",null],["never","C"],[" ",null],["uncurl","D"],[".",null]]},{"n":77,"type":"error","note":false,"a":2,"fix":"depth","exp":"해석: 다리를 건설하기 전에 디자이너들은 장애물의 깊이와 폭을 고려해야만 한다.\n해설: 깊이 =(명사) depth\n참고 :\n* 일반적으로 복수형 명사 앞에는 the를 붙이지 않는 것이 대부분이지만 특정 그룹 내의 모든 사람을 지칭할 때는 the + 복수형을 쓴다.\n* 이 문장에서는 어떤 다리를 건설할 때 \"그 일에 관여하는 \u003c디자이너 모두>가 장애물을 고려해야 한다.\"는 의미를 주기 위해 글쓴이가 designers 앞에 the를 사용했음.","lesson":3,"parts":[["Before ",null],["constructing","A"],[" a bridge, the ",null],["designers","B"],[" must consider the ",null],["deep","C"],[" and width of the ",null],["barrier","D"],[".",null]]},{"n":78,"type":"blank","stem":"Immigration as well as natural growth caused the US population ------------- during the period between 1870 and 1916, rising from about 40 million to about 100 million.","choices":["more than doubled","more double than","to double more than","to more than double"],"note":false,"a":3,"fix":"","exp":"해석: 자연증가는 물론이고 그에 덧붙여서 이민이, 미국인구를 1870년과 1910년 사이의 기간 동안에 두 배 이상으로 증가하는 원인이 되었다. 그래서 4천만에서 1억으로 상승했다.\n해설:\n* double 이 동사로서 \u003c 두 배가 되다> 이고, 그 앞에는 흔히 more than 을 부사로 사용해서\n\u003c두 배 이상으로 증가하다> 의 뜻이 된다.\n* 앞에 동사 cause 가 있으므로 5형식의 기본형인 \u003c S + cause + O + to V --> 의 모양을 선택해야 된다.\n* rising 이하는 \u003c분사구>로서 그 앞 부분을 (두 배 이상이 된 것) 먼저 해석하고 나서, \u003c그래서 --했다.> 와 같이 해석하면 된다.\n참고 :\n문장의 뒤에 있는 분사구는 대개 두 가지방법으로 해석하는데,\n첫째는 \u003c --하면서, --한 채로 >,\n둘째는 \u003c 그리고(그래서) --했다, 그리고(그래서) --한다.> 등이다.\n(예1) Peter had a long sleep, snoring loudly.  (큰 소리로 코를 골면서)\n(예2) Many automobile companies install an ABS in their cars, making the cars safer.  (그래서 그 차들을 더 안전하게 만든다.)","lesson":3},{"n":79,"type":"blank","stem":"On September 1, 1973, a small submersible, the Pisces III, was rescued from 1,580 feet below sea level. Two men ------------- inside for 3 days, after losing control of the craft and losing radio contact with their surface ship.","choices":["had been trapped","have been trapped","were trapped","were being trapped"],"note":false,"a":0,"fix":"","exp":"해석: 1973년 9월 1일 \"파이시스 3호\"라고 불리는 작은 잠수정이 수심 1580 피트에서 구조되었는데, 두 남자가, 그 배를 통제하지 못하고 모선으로부터 연락이 끊긴 후 3일 동안 거기에 갇혀있었다.\n해설:\n* submersible = 잠수정.\n* below sea level = 수심(바다 표면으로부터의 깊이)\n* be trapped = ～에 갇히다, 묶이다.\n* lose control of ～ = ～를 통제(조종)하지 못하게되다.\n* the craft = 여기서는 그 잠수정을 의미함.\n* losing radio contact with  = ～로부터 (통신) 연락이 끊기다.\n* surface ship = 물위에 떠 있는 모선\n* 첫 문장에 \"구조되었다\"가 과거이므로, 둘째 문장에서 3일 동안 갇혀있던 것은 과거완료이다.","lesson":3},{"n":80,"type":"blank","stem":"The barber of Seville, a comic opera with music by the Italian composer Gioacchino Rossini, ------------------- in Rome in 1816.","choices":["was first sung","first sang","was song first","first was sing"],"note":false,"a":0,"fix":"","exp":"해석: 이태리의 작곡가 지아치노 롯시니의 음악이 곁들인 코믹 오페라, 세빌리아의 이발사는\n1816년 로마에서 처음 불려졌다.\n해설:\n* The barber of Seville = 세빌리아의 이발사.\n* a comic opera with music = 음악이 가미된 희가극.\n* by the Italian composer Gioacchino Rossini = 이태리의 작곡가 지아치노 롯시니에 의해 만들어진.\n* was first sung in Rome in 1816 = 1816 년 로마에서 처음 공연되었다.\n참고 : 영문법에서 영화, 희곡, 시, 소설, 미술, 음악 등등 \u003c작품 제목>은 문장 속에서 이탤릭체로 쓴다.","lesson":3},{"n":81,"type":"error","note":true,"a":0,"fix":"what","exp":"해석: 한때 사람들이 사치품이라고 간주하는 것이 흔히 (나중에) 필수품이 된다 ; 많은 가정들이 자동차 두 대 가지는 것이 필수적이라는 것을 알게 된다.\n해설:\n* The thing ( that people consider a luxury ) = 사람들이 사치품이라고 간주하는 것.\n(괄호 안에서는 5형식으로 people = 주어/ consider = 동사 / that = 목적어 / a luxury = 목적격보어).\n* 맨 앞 부분의 the thing that = what 으로 바꿀 수 있다.\n참고:\n* 문장 맨 앞에 that 이 오면 그 that 은 관계대명사로서 사용될 수가 없다. (명사절 접속사로서는 가능하다.)\n\n(예문1)  That he won the race surprised his friends. = \u003c 그가 경주에 이긴 것>\n= 어떤 사실 -- that 은 명사절 접속사\n(예문2) What he won was a gold medal. = \u003c 그가 얻은 것 >\n= 어떤 사물 --  what 은 관계대명사.\n(예문3) That he won was a gold medal. (X) → 문장이 성립되지 않음.","lesson":3,"parts":[["",null],["That","A"],[" people consider ",null],["a luxury","B"],[" at one time ",null],["frequently","C"],[" becomes a necessity ; many families find ",null],["that ownership","D"],[" of two cars is indispensible.",null]]},{"n":82,"type":"error","note":false,"a":0,"fix":"Although (또는 Even though) (Although 또는 Even though 뒤에 she was 는 생략 가능)","exp":"해석: 비록 그녀의 산문체 작품들 때문에 가장 유명하지만, Maya Angelou 는 역시 여러 개의 시 모음집도 출판했다.\n해설:\n* Even 은 부사이므로 절과 절을 연결하는데 사용할 수 없다. 접속사 Although 가 필요하다.\n* collections of poetry = collections of poems = 시 모음집들.\n참고 :\n* 시간, 양보, 조건 등을 나타내는 부사절 접속사 뒤에 \u003cS+be동사> 생략 가능.","lesson":3,"parts":[["",null],["Even","A"],[" best known for her prose ",null],["works","B"],[", Maya Angelou also ",null],["published","C"],[" several collections of ",null],["poetry","D"],[".",null]]},{"n":83,"type":"blank","stem":"Founded by the Spanish as Yerba Buena in 1835, ----------------- was taken over by the United States in 1846 and later renamed.","choices":["San Francisco is now what","what San Francisco is now","what is now San Francisco","while it is now San Francisco"],"note":false,"a":2,"fix":"","exp":"해석: 1835년에 스페인 사람들에 의해서 Yerba Buena 라는 이름으로 설립된 샌프란시스코는 1846년에 미국이 점령해서 이름이 다시 붙여졌다.\n해설:\n* 지명 앞에 What is now 를 사용하는 것은 영어에서 대단히 자주 쓰는 표현으로서, 그 지명이 그 당시에는 그 이름이 아니었고, 그 이후에 그 이름이 된 경우, 즉 San Francisco 는 그 당시에는\nSan Francisco 라는 이름이 아니었으므로 \u003c 지금으로 따지면 San Francisco 인 곳 > 이란 의미로서\nwhat is now 를 붙인다.\n* 분석하면 the place which is now San Francisco = \u003c 지금으로 따지면 San Francisco 인 그 장소 >\n → the place which 를 한 단어로 바꾸면 what 이 된다.\n* 문장 끝의 renamed 는 앞에 be 동사 was histicated ",null],["guided","D"],[" missiles and bombs.",null]]},{"n":99,"type":"blank","stem":"As telescopes become more powerful -------------------- , they can pick up the faint light and other waves from more distant stars and galaxies.","choices":["orbit in space on satellites","and orbit in space on satellites","and orbiting in space on satellites","orbital space on satellites"],"note":false,"a":1,"fix":"","exp":"해석: 망원경들이 더욱 강력해지고 인공위성에 실려서 궤도를 운행함에 따라, 그들은 멀리있는 별들과 은하계들로부터 약한 빛의 파와 다른 파들을 수신할 수 있게 된다.\n해설:\n* As 가 이끄는 부사절에서 주어는 telescopes 이고, 동사는 become 과 orbit 의 두 개다.\n* 하나의 주어에 동사를 두 번 쓰기 때문에 두 번 째 동사 앞에 and를 사용했음.\n* orbit = (동사) 궤도를 운행하다.\n* in space = 우주에서.\n* on satellites = 인공위성에 실려서.\n* (A)를 사용하면 \u003c망원경이 강력한 궤도가 되다>로 해석되어 말이 안된다.","lesson":4},{"n":100,"type":"blank","stem":"------------------- allow it to reach the highest branches, it lets the animal see over long distances.","choices":["Not only the giraffe's tall neck","The giraffe's tall neck not only","Not only does the giraffe's tall neck","Only the giraffe's tall neck does not"],"note":false,"a":2,"fix":"","exp":"해석: 기린의 긴 목은, 기린을 가장 높은 나뭇가지에 다다를 수 있게 해 줄 뿐만 아니라, 그것(긴 목)은 또한, 그 동물(기린)으로 하여금 멀리까지 볼 수 있게 해준다.\n해설:\n* 부정의 부사의 도치법.\nNot only + 조동사(be동사) + S + V(동사원형) --  +  but also S + V ----.\n부정의 부사 도치법을 사용한 제 1 주절           /    제 2 주절\n\n* Not only -- but also --의 모양이 도치법에 사용될 때는, but also 대신 컴마(,)를 사용할 수 있다.\n* (A) allow + O + to V -- = 5형식의 기본형 (비사역동사의 5형식). → O에게 V할 수 있도록 해주다, (V할 수 있게 허락하다.)\n* (B) let + O + V원형 -- = 사역동사의 5형식.→ O에게 V할 수 있도록 해주다, (할 수 있게 허락하다.)\n* (A)와 (B)는 같은 의미로 흔히 사용된다.\n참고 :\n* 첫번 째 절의 it 는 \u003c기린>이고, 두 번 째 절의 it 는 \u003c기린의 긴 목>을 의미한다.\n* 답의 보기에서 (B)를 사용할 경우는 다음과 같이 써야한다.\nThe giraffe's tall neck not only allows it to reach the highest branches but also lets the animal see over long distances.  또는 The giraffe's tall neck allows it not only to reach the highest branches but also to see over long distances.","lesson":4},{"n":101,"type":"error","note":true,"a":0," ay still have) = 주어\n* is usually divided among the various people = 주로 여러 사람들 사이에서 분배된다.\n* to whom money is owed = 관계대명사절로서 앞의 명사 the various people 을 수식함.\n참고 :\n* The person owes money to them = (그 사람이 돈을 그들에게 빚지고 있다.) 를 수동태로 고쳐 쓰면 money is owed to them 의 모양이 되고 이 경우 them 을 관계대명사로 만들어 형용사절의 앞에 위치하면  to whom money is owed 가 된다.","lesson":5},{"n":138,"type":"blank","stem":"----------------------------- when they lie on opposition sides of a line tangent to both of them.","choices":["Two circles that are externally tangent","Externally tangent two circles","There are two circles externally tangent","Two circles are externally tangent"],"note":false,"a":3,"fix":"","exp":"해석 : 두 개의 원은, 그들 둘 다에 접하는 한 직선의 각각 반대편에 접하면서 놓여있을 때, 외접한다. (직선이 가운데 있고 그 양쪽으로 두 개의 원이 접해있는 경우)\n해설 :\n* Two circles are externally tangent = (주절) 두 개의 원은 외접한다.\n* tangent = (형용사) 접하는, 붙어있는 / tangent to ～= ～에 접하는\n* when they lie on opposition sides of a line tangent to both of them. = (부사절)\n* they = 두 개의 원 / on opposition sides of a line = 한 선의 (각각) 반대편에 / tangent to both of them 앞에 which is 를 넣어도 됨. 그 둘 다에 접하는 (앞에 있는 a line 을 수식함)","lesson":5},{"n":139,"type":"error","note":false,"a":0,"fix":"occur","exp":"해석 : 바다 달팽이는, 남극에서 북극에 이르기까지 모든 바다에서 나타난다, 비록, 그들은 열대 바다에서 그들의 최고의 성장에 도달하지만.\n해설 :\n* Marine snails = 바다 달팽이   occur = 자동사(수동태로 쓰지 않음)\n* in all seas from the Arctic to the Antarctic = (부사구) 남극에서 북극에 이르기까지 모든 바다에서.\n* though they reach their greatest development in tropical waters = (부사절) 비록 그들은 열대 바다에서 그들의 최고의 성장에 도달하지만.\n참고 :\n* waters 를 복수형으로 쓰는 이유는 \u003c 냇물, 강, 호수,  바다> 등을 의미할 경우 water 는 셀 수 있는 명사로 취급하기 때문.","lesson":5,"parts":[["Marine snails ",null],["are occurred","A"],[" in ",null],["all seas","B"],[" from the Arctic to the Antarctic, ",null],["though","C"],[" they reach their ",null],["greatest","D"],[" development in tropical waters.",null]]},{"n":140,"type":"error","note":false,"a":2,"fix":"goal","exp":"해석 : 고대부터 현대까지에 걸쳐서, 풍자가들은 하나의 공통 목표를 공유해왔다. 그것은 즉, 모든 그 위장에 가려져 있는 인간의 어리석음을 드러내는 것이다.\n해설 :\n* From antiquity through the present = 고대부터 현대까지에 걸쳐서\n* satirists = 풍자가들\n* have shared a common goals = (현재완료) 하나의 공통 목표를 공유해왔다\n* : = a common goal (공통 목표)란 것은 즉,\n* to expose human folly in all its guises = (부정사의 명사적 용법) 그 위장에 가려져 있는 인간의 어리석음을 드러내는 것\n참고 :\n* 콜론(:) 은 앞부분의 말을 구체적으로 설명할 때 사용하며, 콜론의 뒷 부분에서는 문장이 성립하지 않아도 된다.","lesson":5,"parts":[["From antiquity ",null],["through","A"],[" the present, satirists ",null],["have shared","B"],[" a common ",null],["goals","C"],[" : ",null],["to expose","D"],[" human folly in all its guises.",null]]},{"n":141,"type":"blank","stem":"Eleanor Roosevelt set the standard against which the wives of all United States Presidents -----------------------.","choices":["since have evaluated","since have been evaluated","since they have been evaluated","have evaluated since"],"note":true,"a":1,"fix":"","exp":"해석 : Eleanor Roosevelt 는, (자기자신) 이후의 모든 미국 대통령 부인들이 (그 기준을 표본으로해서) 평가되어 왔던, 그런 기준을 세웠다.\n* 의역 =  Eleanor Roosevelt 는 기준을 세웠는데, (자기자신) 이후의 모든 미국 대통령 부인들이 (그 기준을 표본으로해서) 평가되어 왔다.\n해설 :\n* Eleanor Roosevelt set the standard ( against which the wives of all United States Presidents since have been evaluated ).\n* since는 부사로서 \u003c그 이후 여태까지 = 즉, 그 사람( Eleanor Roosevelt) 이후 여태까지>\n* against which = \u003c그 기준에 대해서>, 즉 \u003c그 기준을 표본으로 해서 >\n* the wives of all United States Presidents have been evaluated = 모든 미국대통령의 부인들이 평가되어 왔다.\n참고 :\n* since 가 단독으로 부사로 사용될 때는 \u003c 앞에 언급되었던 그것, 그 사람, 또는 그 때 이후로>라고 해석한다.","lesson":5},{"n":142,"type":"blank","stem":"-------------------- migrating water birds in North America visit the Gulf of Mexico's winter wetlands.","choices":["Four of three every","Three every four","Three of every four","Every four of three"],"note":false,"a":2,"fix":"","exp":"해석 : 북미의 이주하는 물새 4마리중의 3 마리가 멕시코만의 겨울 습지를 방문한다.\n해설 :\n* Three of every four = 비율로 계산할 때 3/4  (매 4개마다 3개의 비율)\n* migrating water birds = 이주하는 물새\n* the Gulf of Mexico = 미국의 남쪽 바다 (멕시코 만)\n* wetland = 습지\n참고 :\n* 4개 중의 3개의 비율 = three of every
