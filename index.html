.\n* the national anthem = 국가().\n* not -- until -- 의 모양은 \u003c하고서야 비로소 --하다>와 같이 긍정으로 해석하는 것이 일반적이다.","lesson":34},{"n":1014,"type":"error","note":false,"a":0,"fix":"does not","exp":"해석 : 액체는 완전히 기화하기 위해서 그것의 비등점에 도달하지 않아도 된다.\n해설 :\n* A liquid = (주어) 액체.\n* does not have to V = (조동사) V하지 않아도 된다.\n* reach its boiling point = (동사+목적어) 그것의 비등점에 도달하다.\n* to evaporate completely = (to부정사의 부사적 용법) 완전히 기화하기 위해서.","lesson":34,"parts":[["A liquid ",null],["do not","A"],[" have ",null],["to reach","B"],[" its boiling point ",null],["to","C"],[" evaporate ",null],["completely","D"],[".",null]]},{"n":1015,"type":"error","note":false,"a":2,"fix":"and","exp":"해석 : 천연 다이아몬드는 무색으로부터 검정색에 이르기까지 다양하다, 그리고 그것들은 불투명하거나 반투명하거나, 투명할 수 있다.\n해설 :\n* Natural diamonds = (주어) 천연의 다이아몬드\n* vary = (제1동사) 다양하다.\n* vary from A to B = A에서 B에 이르기까지 다양하다\n* and = (접속사) Natural diamonds (공통주어)에 두 개의 동사를 연결하기 위한 등위접속사.\n* may be = (제2동사/추측, 가능을 나타냄) ～ 일 수도 있다.\n* opaque, translucent, or transparent = (보어) 불투명하거나, 반투명하거나, 투명한.\n* also 는 접속사가 아니고 부사임.","lesson":34,"parts":[["Natural diamonds ",null],["vary","A"],[" ",null],["from","B"],[" colorless to black, ",null],["also","C"],[" may be ",null],["opaque","D"],[", translucent, or transparent.",null]]},{"n":1016,"type":"blank","stem":"Commercial expansion from city to suburb --------------------------- people in the United States live and work.","choices":["its affection on the way","has affected the way","affected the way has","has the way affected"],"note":true,"a":1,"fix":"","exp":"해석 : 도시로부터 근교로 상업의 확장은, 미국에서 사람들이 살고 일하는 방식에 영향을 끼쳐왔다.\n해설 :\n* commercial expansion from city to suburb = (주어) 도시로부터 근교로 상업의 확장.\n* has affected = (동사/현재완료) 영향을 끼쳐왔다.\n* the way = (목적어) 방식.\n* the way 뒤에는 관계부사 how 가 생략되어있는데 현대영어에서는 how를 쓰지 않는 것이 옳다.\n* people in the United States live and work = (관계부사절에서의 주어와 동사) 미국에서 사람들이 살고 일하다.\n* the way (people in the United States live and work) = (괄호부분이 관계부사절)미국에서 사람들이 살고 일하는 방식.\n참고 :\n* 현대 미국식 영어에서는 \u003cS가 V 하는 방식>은 이 문장과 같이 the way S + V --의 모양이 가장 흔히 쓰인다.","lesson":34},{"n":1017,"type":"error","note":false,"a":0,"fix":"a wide","exp":"해석 : 사회단체들은, (사회적으로) 인정받는 행동양식을 장려하고 탈선을 막기 위해서 광범위한 기법들을 사용한다.\n해설 :\n* Social groups = (주어) 사회단체.\n* use = (동사) 사용한다.\n* a wide range of techniques = (목적어) 광범위한 기법들.\n* to encourage approved behavior patterns and to discourage deviation = (부정사의 부사적용법을 2번 사용했음) 인정받는 행동양식을 장려하고 탈선을 막기 위해서.\n* a wide range of + 명사 = 광범위한 ～.\n* techniques = 기법.\n* approved = (형용사) 인정받는 (입증된, 공인된)\n* behavior patterns = 행동양식\n* discourage = encourage 의 반대말로서 \u003c～하지 못하게 막다>\n* deviation = 탈선, 일탈(행위)","lesson":34,"parts":[["Social groups use ",null],["wide","A"],[" range of techniques to encourage ",null],["approved","B"],[" behavior ",null],["patterns","C"],[" and to ",null],["discourage","D"],[" deviation.",null]]},{"n":1018,"type":"error","note":false,"a":0,"fix":"derives","exp":"해석 : 소극()은, (실제로는) 있을 수 없는 등장인물과 상황들로부터 많은 유머를 얻어내는 하나의 드라마 형태이다.\n해설 :\n* Farce = (주어) 소극(), 익살극.\n* is = (동사)\n* a dramatic form = (보어) 하나의 드라마 형태.\n* that derives much of its humor from improbable characters and situations = (관계대명사절) (실제로는) 있을 수 없는 등장인물과 상황들에서 많은 유머를 얻어내는.\n* that (관계대명사절) 안에서\n* that = 주어 / derives = (동사/능동태) 끌어내다. / much of its humor = (목적어) 그것의 많은 유머.\n* from improbable characters and situations = (부사구) (실제로는) 있을 수 없는 등장인물과 상황들로부터.\n* derive A from B = B로부터 A를 끌어내다, 얻다, 유도하다.\n* improbable = 있음직 하지 않은, 정말 같지 않은, (실제로는) 있을 수 없는","lesson":34,"parts":[["Farce is a dramatic form that ",null],["is derived","A"],[" much of its ",null],["humor","B"],[" from ",null],["improbable","C"],[" characters and ",null],["situations","D"],[".",null]]},{"n":1019,"type":"error","note":false,"a":2,"fix":"information","exp":"해석 : 인류학자 Jane Goodall은, 침팬지에 관한 그녀의 연구를 통해, 영장류의 행동에 관련한 많은 정보를 제공(기여)했다.\n해석 :\n* Anthropologist Jane Goodall = (주어/Anthropologist 와 Jane Goodall 은 동격) 인류학자인 Jane Goodall.\n* has contributed = (동사/현재완료) 제공(기여, 공헌)했다.\n* a wealth of information = (목적어) 많은 정보\n* a wealth of = much\n* concerning ～ = (전치사) ～에 관한.\n* primate behavior = 영장류의 행동.\n* through her studies of chimpanzees = (부사구) 침팬지에 관한 그녀의 연구를 통해.\n참고 :\n* information은 \u003c셀 수 없는 명사>이므로 복수형으로 쓸 수 없다.","lesson":34,"parts":[["Anthropologist Jane Goodall has ",null],["contributed","A"],[" a wealth ",null],["of","B"],[" ",null],["informations","C"],[" ",null],["concerning","D"],[" primate behavior through her studies of chimpanzees.",null]]},{"n":1020,"type":"blank","stem":"A computer is an electronic device designed to process information and ---------------------------------------.","choices":["supplying the user with new data or a new arrangement of previous data","supplied the user with new data or a new arrangement of previous data","new data or a new arrangement of previous data are supplied with the user","supply the user with new data or a new arrangement of previous data"],"note":false,"a":3,"fix":"","exp":"해석: 컴퓨터는, 정보를 처리하기 위해서 그리고 사용자에게 새로운 데이터나 이전 데이터의 새롭게 정리된 것을 제공하기 위해서 고안된 하나의 전기장치이다.\n해설 :\n* A computer = (주어/대표단수)\n* is = (동사)\n* an electronic device = (보어) 하나의 전기장치.\n* (which is) designed to V = (관계대명사절로서 앞의 명사 an electronic device 를 수식함) V하기 위해서 고안된.\n* to process information = (부정사의 부사적 용법/목적) 정보를 처리하기 위해서.\n* (to) supply the user with new data or a new arrangement of previous data = (부정사의 부사적 용법/목적/괄호부분 생략)사용자에게 새로운 데이터나 이전 데이터의 새롭게 정리된 것을 제공하기 위해서.\n* supply A with B = A에게 B를 제공하다.\n* a new arrangement of previous data = 이전 데이터의 새롭게 정리된 것.","lesson":34}]</script>
<script>
const Q = JSON.parse(document.getElementById('data').textContent);
const TOTAL = Q.length, PER = 30;
const $app = document.getElementById('app');
const L4 = ['A','B','C','D'];
const KEY = 'itp2-progress-v1';
let store = {rec:{}, bm:{}, shuffle:false, sec:'blank'};
try { const s = localStorage.getItem(KEY); if (s) store = Object.assign(store, JSON.parse(s)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(4,'0');
const byN = n => Q[n-1];
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function record(n, ok){ const r = store.rec[n] || {t:0,w:0}; r.t++; if(!ok) r.w++; r.c = ok?1:0; store.rec[n]=r; save(); }
function choicesOf(q){ return q.type==='blank' ? q.choices : q.parts.filter(p=>p[1]).map(p=>p[0]); }
const typeName = t => t==='blank' ? 'Structure · 구조 완성' : 'Written Expression · 오류 찾기';
const SEC = {
  blank:{name:'Structure', ko:'구조 완성', desc:'빈칸이 뚫린 불완전한 문장이 나옵니다. 보기 (A)~(D) 중 문법적으로 가장 알맞게 빈칸을 채우는 단어나 어구를 고르세요.'},
  error:{name:'Written Expression', ko:'문법 오류 찾기', desc:'밑줄 친 네 부분 (A)~(D)가 있는 완성된 문장이 나옵니다. 틀린 문법이나 어색한 표현이 쓰인 밑줄 부분을 찾으세요.'}
};
const secCount = t => Q.filter(q=>q.type===t).length;

let view = 'home';       // home | q | summary
let S = null;            // 현재 세션
let timerId = null;
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- 세션 ---------- */
function typeFilter(list){ return list.filter(n=>byN(n).type===store.sec); }
function allNums(){ return Array.from({length:TOTAL},(_,i)=>i+1); }
function startSession(title, queue, opts={}){
  if(!opts.noFilter) queue = typeFilter(queue);
  if(!queue.length){ toast('조건에 맞는 문제가 없습니다.'); return; }
  if(store.shuffle && !opts.exam && !opts.ordered) queue = shuffled(queue);
  S = {title, queue, idx: opts.idx||0, sel:{}, exam:!!opts.exam, finished:false, confirm:false, limit: opts.limit||0, left: opts.limit||0};
  view='q'; clearInterval(timerId);
  if(S.exam){ timerId=setInterval(()=>{ S.left--; const el=document.getElementById('timer'); if(el){ el.textContent=fmtTime(S.left); el.classList.toggle('low',S.left<=300);} if(S.left<=0) finishExam(); },1000); }
  render(); window.scrollTo(0,0);
}
function fmtTime(s){ s=Math.max(0,s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function startLesson(l, idx){
  const nums = typeFilter(Array.from({length:PER},(_,i)=>(l-1)*PER+i+1));
  const filtered = nums;
  let start = 0;
  if(idx!==undefined){ start = Math.max(0, filtered.indexOf(idx)); }
  else { const f = filtered.findIndex(n=>!store.rec[n]); start = f<0?0:f; }
  startSession(`${SEC[store.sec].name} · ${l}과`, nums, {ordered:true, idx:start, noFilter:true});
}
function startExam(){
  const b = shuffled(allNums().filter(n=>byN(n).type==='blank')).slice(0,15);
  const e = shuffled(allNums().filter(n=>byN(n).type==='error')).slice(0,25);
  startSession('모의고사', b.concat(e), {exam:true, limit:25*60, noFilter:true});
}
function finishExam(){
  if(!S||!S.exam||S.finished) return;
  S.finished=true; S.confirm=false; clearInterval(timerId);
  S.queue.forEach(n=>{ if(S.sel[n]!==undefined) record(n, S.sel[n]===byN(n).a); });
  view='summary'; render(); window.scrollTo(0,0);
}
function sessionStats(){
  let right=0, wrong=0, none=0;
  S.queue.forEach(n=>{ const s=S.sel[n]; if(s===undefined) none++; else if(s===byN(n).a) right++; else wrong++; });
  return {right,wrong,none};
}

/* ---------- 렌더 ---------- */
function render(){ $app.innerHTML = view==='home' ? homeHTML() : view==='summary' ? summaryHTML() : questionHTML(); }

function homeStats(){
  let solved=0, correct=0, wrongNow=0, bm=0;
  for(let n=1;n<=TOTAL;n++){ if(byN(n).type!==store.sec) continue; const r=store.rec[n]; if(r){ solved++; if(r.c) correct++; else wrongNow++; } if(store.bm[n]) bm++; }
  return {solved,correct,wrongNow,bm};
}
function homeHTML(){
  const st = homeStats(), sec = SEC[store.sec], secN = secCount(store.sec);
  const acc = st.solved ? Math.round(st.correct/st.solved*100)+'%' : '–';
  const lessons = [];
  for(let l=1;l<=TOTAL/PER;l++){
    const nums = typeFilter(Array.from({length:PER},(_,i)=>(l-1)*PER+i+1)); if(!nums.length) continue;
    let g=0,r=0; nums.forEach(n=>{ const x=store.rec[n]; if(x){ if(x.c) g++; else r++; } });
    const N=nums.length;
    lessons.push(`<button class="lesson" data-act="lesson" data-l="${l}"><b>${l}과</b><small>${N}문항 · ${g+r}개 풀이</small><div class="bar"><i class="g" style="width:${g/N*100}%"></i><i class="r" style="width:${r/N*100}%"></i></div></button>`);
  }
  const tab = (v)=>`<button class="tab" data-act="sec" data-v="${v}" role="tab" aria-selected="${store.sec===v}"><b>${SEC[v].name}</b><span>${SEC[v].ko} · ${secCount(v)}문항</span></button>`;
  return `
  <div class="hero"><div><div class="eyebrow">TOEFL ITP · Section 2 · 1020문항</div><h1>Structure &amp; Written Expression</h1></div>
  <button class="btn sm" data-act="theme" aria-label="화면 모드 바꾸기">화면 모드</button></div>
  <div class="tabs" role="tablist">${tab('blank')}${tab('error')}</div>
  <p class="secdesc">${sec.desc}</p>
  <div class="stats">
    <div class="stat"><div class="v">${st.solved}<span style="font-size:14px;color:var(--muted)"> / ${secN}</span></div><div class="l">푼 문제</div></div>
    <div class="stat"><div class="v">${acc}</div><div class="l">최근 풀이 정답률</div></div>
    <div class="stat ${st.wrongNow?'warn':''}"><div class="v">${st.wrongNow}</div><div class="l">오답 노트</div></div>
    <div class="stat"><div class="v">${st.bm}</div><div class="l">북마크</div></div>
  </div>
  <div class="section-t">${sec.name} 연습</div>
  <div class="modes">
    <button class="mode" data-act="random"><b>랜덤 연습</b><span>${secN}문항에서 무작위로</span></button>
    <button class="mode" data-act="unsolved"><b>안 푼 문제</b><span>${secN-st.solved}문항 남음</span></button>
    <button class="mode" data-act="wrong"><b>오답 노트</b><span>마지막에 틀린 ${st.wrongNow}문항</span></button>
    <button class="mode" data-act="bookmarks"><b>북마크</b><span>별표 표시한 ${st.bm}문항</span></button>
  </div>
  <div class="opts" style="margin-top:12px">
    <button class="chip" data-act="shuffle" aria-pressed="${store.shuffle}">순서 섞기</button>
    <form class="jump" data-form="jump"><input id="jumpn" type="number" min="1" max="${TOTAL}" placeholder="문제 번호" aria-label="문제 번호"><button class="btn sm" type="submit">이동</button></form>
  </div>
  <div class="section-t">과별 연습</div>
  <div class="lessons">${lessons.join('')}</div>
  <div class="section-t">실전 모의고사</div>
  <div class="modes"><button class="mode exam" data-act="exam"><b>모의고사 (Structure 15 + Written Expression 25)</b><span>40문항 · 25분 · 제출 후 채점</span></button></div>
  <div class="foot"><span>풀이 기록은 이 브라우저에 저장됩니다.</span><button class="linkbtn" data-act="reset">기록 초기화</button></div>`;
}

function fmtExp(t){
  return t.split('\n').map(l=>{
    l=l.replace(/\s+$/,''); if(!l.trim()) return '';
    const m=l.match(/^(해석|해설|참고)\s*[:：]\s*(.*)$/);
    if(m) return `<div class="eh"><b>${m[1]}</b>${esc(m[2])}</div>`;
    if(/^\s*\*/.test(l)) return `<div class="eb">${esc(l.replace(/^\s*\*\s*/,''))}</div>`;
    return `<div class="ep">${esc(l.trim())}</div>`;
  }).join('');
}

function questionHTML(){
  const n = S.queue[S.idx], q = byN(n), sel = S.sel[n];
  const answered = sel!==undefined;
  const showFB = answered && (!S.exam || S.finished);
  const locked = !S.exam ? answered : S.finished;
  const ch = choicesOf(q);
  const stateOf = i => {
    if(showFB){ if(i===q.a) return 'ok'; if(i===sel) return 'no'; return ''; }
    return i===sel ? 'sel' : '';
  };
  let body;
  if(q.type==='blank'){
    const filled = showFB ? `<span class="blank filled">${esc(ch[q.a])}</span>` : `<span class="blank">&nbsp;</span>`;
    body = `<p class="q">${esc(q.stem).replace(/-{3,}/g, ()=>filled)}</p>`;
  } else {
    let k=0;
    body = `<p class="q">${q.parts.map(p=>{
      if(!p[1]) return esc(p[0]);
      const i=k++; return `<span class="seg ${stateOf(i)}" role="button" tabindex="0" data-act="pick" data-i="${i}"><span class="u">${esc(p[0])}</span><sup>${p[1]}</sup></span>`;
    }).join('')}</p>`;
  }
  const choicesHTML = ch.map((t,i)=>`<button class="ch ${stateOf(i)}" data-act="pick" data-i="${i}" ${locked?'disabled':''}><span class="k">${L4[i]}</span><span class="t">${esc(t)}</span></button>`).join('');
  let fb='';
  if(showFB){
    const ok = sel===q.a;
    const fixLine = q.type==='error' && q.fix ? `<small>고친 표현: <b>${esc(ch[q.a])}</b> → <b>${esc(q.fix)}</b></small>` : '';
    fb = `<div class="fb ${ok?'ok':'no'}">${ok?'정답입니다':'오답입니다 · 정답은 ('+L4[q.a]+')'}${fixLine}</div>
          <div class="exp">${fmtExp(q.exp)}</div>`;
  }
  const last = S.idx===S.queue.length-1;
  const nextLabel = last ? (S.exam&&!S.finished ? '제출하기' : '결과 보기') : '다음';
  const nav = S.exam ? `<div class="navgrid">${S.queue.map((m,i)=>{
      const s=S.sel[m]; let c = S.finished ? (s===undefined?'':(s===byN(m).a?'good':'bad')) : (s!==undefined?'done':'');
      return `<button class="${c} ${i===S.idx?'cur':''}" data-act="goto" data-i="${i}" aria-label="${i+1}번 문제">${i+1}</button>`;}).join('')}</div>` : '';
  const pct = (S.idx+1)/S.queue.length*100;
  return `
  <div class="topbar">
    <button class="btn sm" data-act="${S.finished?'summary':'home'}">${S.finished?'← 결과':'← 목록'}</button>
    <div class="ttl">${esc(S.title)}</div>
    ${S.exam&&!S.finished?`<div class="timer ${S.left<=300?'low':''}" id="timer">${fmtTime(S.left)}</div>`:''}
  </div>
  <div class="prog"><div style="width:${pct}%"></div></div>
  <article class="card">
    <div class="meta"><span class="qno">${pad(n)}</span><span class="kind">${typeName(q.type)}</span>${q.note?'<span class="note">NOTE</span>':''}
      <button class="star" data-act="bm" aria-pressed="${!!store.bm[n]}" aria-label="북마크">${store.bm[n]?'★':'☆'}</button></div>
    <p class="inst">${q.type==='blank'?'문법적으로 가장 알맞게 빈칸을 채우는 것을 (A)~(D) 중에서 고르세요.':'밑줄 친 (A)~(D) 중 틀린 문법이나 어색한 표현을 찾으세요.'}</p>
    ${body}
    <div class="choices">${choicesHTML}</div>
    ${fb}
  </article>
  <div class="pager">
    <button class="btn" data-act="prev" ${S.idx===0?'disabled':''}>← 이전</button>
    <span class="c">${S.idx+1} / ${S.queue.length}</span>
    <button class="btn primary" data-act="next">${nextLabel} →</button>
  </div>
  ${nav}
  ${S.exam&&!S.finished?`<div class="row"><button class="btn" data-act="submit">제출하기</button></div>`:''}
  ${S.confirm?confirmHTML():''}`;
}
function confirmHTML(){
  const st=sessionStats();
  return `<div class="modal"><div class="box"><h3>시험을 제출할까요?</h3>
    <p style="color:var(--muted)">풀지 않은 문제가 ${st.none}개 있습니다. 제출하면 답을 바꿀 수 없습니다.</p>
    <div class="row"><button class="btn primary" data-act="finish">제출</button><button class="btn" data-act="cancel">계속 풀기</button></div></div></div>`;
}
function summaryHTML(){
  const st=sessionStats(), total=S.queue.length;
  const answeredN = st.right+st.wrong;
  const used = S.exam ? S.limit-S.left : 0;
  const chips = S.queue.map((m,i)=>{ const s=S.sel[m]; const c = s===undefined?'':(s===byN(m).a?'good':'bad');
    return `<button class="${c}" data-act="goto" data-i="${i}" aria-label="${i+1}번 문제">${i+1}</button>`; }).join('');
  const bt = {blank:[0,0], error:[0,0]};
  S.queue.forEach(m=>{ const s=S.sel[m]; if(s===undefined) return; const t=byN(m).type; bt[t][1]++; if(s===byN(m).a) bt[t][0]++; });
  return `
  <div class="topbar"><button class="btn sm" data-act="home">← 목록</button><div class="ttl">${esc(S.title)} 결과</div></div>
  <article class="card">
    <div class="score"><span class="big">${st.right}</span><span class="of">/ ${total}문항 정답</span></div>
    <div class="eyebrow">정답률 ${answeredN?Math.round(st.right/answeredN*100):0}% · 오답 ${st.wrong} · 미풀이 ${st.none}${S.exam?' · 소요 '+fmtTime(used):''}</div>
    <div class="eyebrow" style="margin-top:6px">Structure ${bt.blank[0]}/${bt.blank[1]} · Written Expression ${bt.error[0]}/${bt.error[1]}</div>
    <div class="section-t">문항별 결과 (눌러서 해설 보기)</div>
    <div class="navgrid" style="margin-top:0">${chips}</div>
    <div class="row">
      ${st.wrong?`<button class="btn primary" data-act="retry-wrong">틀린 ${st.wrong}문항 다시 풀기</button>`:''}
      <button class="btn" data-act="home">목록으로</button>
    </div>
  </article>`;
}

/* ---------- 동작 ---------- */
function pick(i){
  const n=S.queue[S.idx], q=byN(n);
  if(S.exam){ if(S.finished) return; S.sel[n]=i; render(); return; }
  if(S.sel[n]!==undefined) return;
  S.sel[n]=i; record(n, i===q.a); render();
}
function next(){
  if(S.idx<S.queue.length-1){ S.idx++; render(); window.scrollTo(0,0); return; }
  if(S.exam&&!S.finished){ S.confirm=true; render(); return; }
  view='summary'; render(); window.scrollTo(0,0);
}
function prev(){ if(S.idx>0){ S.idx--; render(); window.scrollTo(0,0); } }
function goHome(){ clearInterval(timerId); S=null; view='home'; render(); window.scrollTo(0,0); }

$app.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  switch(a){
    case 'home': goHome(); break;
    case 'summary': view='summary'; render(); break;
    case 'exam': startExam(); break;
    case 'random': startSession(SEC[store.sec].name+' 랜덤', shuffled(allNums()), {ordered:true}); break;
    case 'unsolved': startSession(SEC[store.sec].name+' 안 푼 문제', allNums().filter(n=>!store.rec[n])); break;
    case 'wrong': startSession(SEC[store.sec].name+' 오답 노트', allNums().filter(n=>store.rec[n]&&!store.rec[n].c)); break;
    case 'bookmarks': startSession(SEC[store.sec].name+' 북마크', allNums().filter(n=>store.bm[n])); break;
    case 'lesson': startLesson(+t.dataset.l); break;
    case 'sec': store.sec=t.dataset.v; save(); render(); break;
    case 'shuffle': store.shuffle=!store.shuffle; save(); render(); break;
    case 'theme': { const r=document.documentElement; const dark = r.dataset.theme==='dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dark?'light':'dark'; break; }
    case 'reset': if(t.dataset.sure){ store.rec={}; store.bm={}; save(); render(); toast('기록을 초기화했습니다.'); } else { t.dataset.sure=1; t.textContent='한 번 더 누르면 모든 기록이 지워집니다'; } break;
    case 'pick': pick(+t.dataset.i); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'goto': S.idx=+t.dataset.i; view='q'; render(); window.scrollTo(0,0); break;
    case 'bm': { const n=S.queue[S.idx]; if(store.bm[n]) delete store.bm[n]; else store.bm[n]=1; save(); render(); break; }
    case 'submit': S.confirm=true; render(); break;
    case 'cancel': S.confirm=false; render(); break;
    case 'finish': finishExam(); break;
    case 'retry-wrong': { const w=S.queue.filter(n=>S.sel[n]!==undefined&&S.sel[n]!==byN(n).a); startSession('틀린 문제 다시 풀기', w, {ordered:true, noFilter:true}); break; }
  }
});
$app.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('seg')){ e.preventDefault(); pick(+e.target.dataset.i); }
});
$app.addEventListener('submit', e=>{
  const f=e.target.closest('[data-form="jump"]'); if(!f) return; e.preventDefault();
  const n=parseInt(document.getElementById('jumpn').value,10);
  if(!(n>=1&&n<=TOTAL)){ toast('1부터 '+TOTAL+' 사이의 번호를 입력하세요.'); return; }
  store.sec=byN(n).type; save(); startLesson(Math.ceil(n/PER), n);
});
document.addEventListener('keydown', e=>{
  if(view!=='q'||!S||e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||S.confirm) return;
  const k=e.key.toLowerCase(); const q=byN(S.queue[S.idx]);
  const idx = 'abcd'.indexOf(k)>=0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if(idx>=0){ pick(idx); }
  else if(k==='arrowright'||k==='enter'||k==='n'){ if(e.target.tagName==='BUTTON'&&k==='enter') return; e.preventDefault(); next(); }
  else if(k==='arrowleft'||k==='p'){ prev(); }
  else if(k==='b'){ const n=S.queue[S.idx]; if(store.bm[n]) delete store.bm[n]; else store.bm[n]=1; save(); render(); }
});
render();
</script>
</body>
</html>
