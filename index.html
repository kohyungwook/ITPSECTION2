ed ",null],["success","A"],[" and influence ",null],["unparalleled","B"],[" ",null],["among","C"],[" Black American ",null],["writer","D"],[" of his era.",null]]},{"n":561,"type":"blank","stem":"Xanthines -------------------------- the body, and these effects are generally determined by the size and regularity of dosage.","choices":["have effects both good and bad on","have both good and bad effects on","both good and bad affects having on","with both good and bad effects have on"],"note":true,"a":1,"fix":"","exp":"해석 : 크산틴(화학물질의 일종)은 신체에 좋은영향과 나쁜영향 둘 다 끼친다, 그리고 이 효과들은 일반적으로 물질 투여의 크기와 규칙성에 의해서 결정된다.\n해설 :\n* Xanthines = (주어) 크산틴(혈액이나 오줌등에 들어있는 화학물질의 일종)\n* have both good and bad effects on the body = 신체에 좋은영향과 나쁜영향 둘 다 끼친다, 그리고 이 효과들은 일반적으로 물질 투여의 크기와 규칙성에 의해서 결정된다.\n* these effects = (주어) 이 효과들.\n* are generally determined = 일반적으로 결정된다.\n* by the size and regularity of dosage = 물질 투여의 크기와 규칙성에 의해서.\n참고 :\n* have ～ effects on -- = -- 에 ～한 영향을 끼친다.\n* dosage = (약이나 물질의) 투여, 투여량","lesson":19},{"n":562,"type":"error","note":false,"a":2,"fix":"to give","exp":"해석 : 심한 발목부상이 그녀로 하여금 1926년에 신문보도업무를 그만두도록 강요했을 때, Margaret Mitchell은 그녀의 소설 겧 함께 사라지다.궦_ 쓰기 시작했다.\n해설 :\n* When a severe ankle injury forced her to give up reporting in 1926 = (부사절) 심한 발목부상이 그녀로 하여금 1926년에 신문보도업무를 그만두도록 강요했을 때.\n* force O toV = O에게 V하도록 강요하다. O로 하여금 V할 수밖에 없도록 만들다.\n* Margaret Mitchell began writing her novel Gone with the Wind = (주절)","lesson":19,"parts":[["",null],["When","A"],[" a severe ankle ",null],["injury","B"],[" forced her ",null],["gave","C"],[" up reporting in 1926, Margaret Mitchell began writing ",null],["her novel","D"],[" Gone with the Wind.",null]]},{"n":563,"type":"blank","stem":"The Acoma pueblo, ------------------------, is considered the oldest continuously occupied settlement in the United States.","choices":["which were found around 1075","founded around 1075","around 1075 founded which","found that around 1075"],"note":false,"a":1,"fix":"","exp":"해석 : 1075 년경에 설립된 The Acoma pueblo (아코마 주거단지)는 미국에서 가장 오래된 그리고 지속적으로 점유된(사람이 살아온) 정착지로 간주된다.\n해설 :\n* The Acoma pueblo = (주어) 아코마 주거단지\n* ,(which was) founded around 1075, = (주어를 수식하는 관계대명사절/ 관계대명사절 안에서 괄호부분 생략) 1075 년경에 설립된.\n* is considered --- = (동사. 수동태) --라고 간주된다.\n* the oldest continuously occupied settlement in the United States = (보어) 미국에서 가장 오래된 그리고 지속적으로 점유된(사람이 살아온) 정착지.","lesson":19},{"n":564,"type":"blank","stem":"On March 1, 1867, the state of Nebraska was admitted to the Union ---------------------------------.","choices":["when President Andrew Johnson vetoed was overridden","when President Andrew Johnson's veto being overridden","with overridden President Andrew Johnson's veto was","with President Andrew Johnson's veto was overridden"],"note":false,"a":0,"fix":"","exp":"해석 : 1867년 3월 1일에, 네브라스카주는, Andrew Johnson 대통령이 거부권을 행사한 법안이 다시 국회에서 가결되었을 때 연방에 가입되었다.\n해설 :\n* On March 1, 1867 = (부사구)\n* the state of Nebraska = (주어) 네브라스카주\n* was admitted to the Union = 연방에 가입되었다.\n* when President Andrew Johnson긯 veto was overridden = (부사절) Andrew Johnson 대통령이 거부권을 행사한 법안이 다시 국회에서 가결되었을 때.\n* Union = \u003c남북전쟁당시 북부연합> 또는 \u003c미국연방>을 의미함.\n* veto = 거부권\n* overide = 대통령이 거부권을 행사한 법안을 국회에서 다시 가결시키다.\n\n참고 :\n(C)나 (D)처럼 with를 사용하여 분사구문을 만들려면, with President Andrew Johnson's veto (being) overridden 으로 하면 된다. 여기서 being 은 흔히 생략함.","lesson":19},{"n":565,"type":"blank","stem":"One of the most difficult problems in understanding sleep is determining -----------------------------.","choices":["what the functions of sleep are","what are the functions of sleep","what functions sleep","what do the functions of sleep"],"note":false,"a":0,"fix":"","exp":"해석 : 겴?을 이해하는데 있어서 가장 중요한 문제들 중의 하나는 겴 기능이 무엇인가?궦_ 밝혀내는 것이다.\n해설 :\n* One of the most difficult problems in understanding sleep = (주어) 겴?을 이해하는데 있어서 가장 중요한 문제들 중의 하나.\n* is = (동사)\n* determining what the functions of sleep are = (보어) 겴 기능이 무엇인가?궦_ 밝혀내는 것 (여기서 determining은 동명사)","lesson":19},{"n":566,"type":"blank","stem":"---------------------------------------, cotton is an important textile fiber.","choices":["Because its durability and easy dying","Because durable and easy to dye","Because it is durable and easy to dye","Because of its durable and easy to dye"],"note":true,"a":2,"fix":"","exp":"해석 : 그것은 내구성있고 염색하기 쉽기 때문에, 면(목화)은 중요한 직물섬유이다.\n해설 :\n* Because it is durable and easy to dye = (부사절) 그것은 내구성있고 염색하기 쉽기 때문에.\n* cotton is an important textile fiber = (주절) 면(목화)은 중요한 직물섬유이다.","lesson":19},{"n":567,"type":"blank","stem":"At forty-three, Caroline Hazard was elected as the fifth president of Wellesley College, ---------------------- a college education and administrative experience.","choices":["despite of her lack","despite that she lacked of","despite of the fact that her lack of","despite her lack of"],"note":false,"a":3,"fix":"","exp":"해석 : 43세의 나이에 Caroline Hazard 는, 대학교육도 못받았고 행정 경험도 없음에도 불구하고, Wellesley College 의 제 5대 학장으로 선출되었다.\n해설 :\n* At forty-three = (At the age of forty-three) 43세의 나이에\n* Caroline Hazard = (주어)\n* was elected = (동사) 선출되었다.\n* as the fifth president of Wellesley College = Wellesley College 의 제 5대 학장으로.\n* despite her lack of a college education and administrative experience = 대학교육도 못받았고 행정 경험도 없음에도 불구하고.\n참고 : despite 는 뒤에 of를 사용하지 않으며, 전치사이므로 절을 목적어로(despite + S + V --- 의 모양) 취할 수 없다. 그 뒤에 절을 연결하려면 despite the fact that S + V ---- 의 모양을 사용할 수 있다.","lesson":19},{"n":568,"type":"error","note":false,"a":0,"fix":"Since","exp":"해석 : 1950년대 이래로, 포크음악은 많은 대중적인 성악과 기악에 대단한 영향을 끼쳐왔다.\n해설 :\n* Since the 1950's = (부사구) 1950년대 이래로\n* folk music = (주어) 포크음악\n* has had = (동사 / have 의 현재완료형) (영향을) 끼쳐왔다.\n* a significant influence = (목적어) 대단한 영향\n* on much popular vocal and instrumental music = 많은 대중적인 성악과 기악에\n참고 : since를 이용하여 \u003c--한 이래로>를 의미하는 부사절이나 부사구가 올 때 주절의 동사는 현재완료를 사용하는 것이 정석이다.\n* have influence on -- = have effect on -- = --에 영향을 끼치다.","lesson":19,"parts":[["",null],["In","A"],[" the 1950's, folk music has ",null],["had","B"],[" a significant ",null],["influence","C"],[" on ",null],["much","D"],[" popular vocal and instrumental music.",null]]},{"n":569,"type":"error","note":false,"a":0,"fix":"as","exp":"해석 : 7 개의 행성은 그들의 공전운동과 같은방향으로 자전하고, 반면에 금성과 천왕성은 반대방향으로 자전한다.\n해설 :\n* Seven planets = 태양계의 9개 행성 중 7 개.\n* rotate = 자전한다.\n* in the same direction as their orbital motions = 그들의 공전운동과 같은방향으로.\n* \u003c어떤 방향으로>를 표현할 때 전치사 in을 사용하여 in the direction 이라고 한다.(전치사에 유의할것)\n* while Venus and Uranus rotate in the opposite direction = 반면에 금성과 천왕성은 반대방향으로 자전한다.\n참고 : 9개의 행성 -- 태양에서 가까운 순서로 Mercury(수성), Venus (금성), Earth(지구), Mars(화성), Jupiter(목성), Saturn(토성), Uranus(천왕성), Neptune(해왕성), Pluto(명왕성)","lesson":19,"parts":[["Seven planets rotate in the same direction ",null],["with","A"],[" their ",null],["orbital","B"],[" motions, ",null],["while","C"],[" Venus and Uranus rotate ",null],["in","D"],[" the opposite direction.",null]]},{"n":570,"type":"error","note":false,"a":0,"fix":"elect","exp":"해석 : 미국에서 유권자들은 전국입법부 (연방의회)에 대표자(국회의원)을 선출한다, 그런데 그 연방의회는 상원과 하원으로 구성된다.\n해설 :\n* In the United States = (부사구) 미국에서.\n* voters = (주어) 유권자들.\n* elect = (동사) 선출한다.\n* representatives = (목적어) 대표자(국회의원)\n* to the national legislature = 전국입법부 (연방의회)\n* which consists of the House of Representatives and the Senate = (관계대명사절로서 앞의 명사를 구체적으로 설명) 그런데 그 연방의회는 상원과 하원으로 구성된다.","lesson":19,"parts":[["In the United States voters ",null],["are elected","A"],[" ",null],["representatives","B"],[" to the national ",null],["legislature","C"],[", which ",null],["consists","D"],[" of the House of Representatives and the Senate.",null]]},{"n":571,"type":"blank","stem":"An average honeybee colony ------------------ about thirty-thousand bees.","choices":["has","that with","with","does"],"note":true,"a":0,"fix":"","exp":"해석 : 평균적인 꿀벌의 한 집단은 약 3만 마리의 벌을 가진다.\n해설 :\n* An average honeybee colony = (주어) 평균적인 꿀벌의 한 집단.\n* has = (동사)\n* about thirty-thousand bees = (목적어) 약 3만 마리의 벌","lesson":20},{"n":572,"type":"blank","stem":"Widespread participation in politics ------------------- a well-run government.","choices":["does not ensure necessary","does not necessarily ensure","are not necessarily ensure","do not necessary ensure"],"note":false,"a":1,"fix":"","exp":"해석 : 정치에 광범위한 참여가 반드시 잘 운영되는 정부를 보장하는 것은 아니다.\n해설 :\n* Widespread participation in politics = (주어)\n* does not necessarily ensure = 반드시 보장하는 것은 아니다.\n* not necessarily = (부분 부정) 반드시 --인 것은 아니다.\n* a well-run government = (목적어) 잘 운영되는 정부","lesson":20},{"n":573,"type":"blank","stem":"It is the interaction between people, rather than the events that occur in their lives, ------------------------------.","choices":["which main focuses of social psychology","that is the main social psychology focus of","which mainly focusing of social psychology","that is the main focus of social psychology"],"note":false,"a":3,"fix":"","exp":"해석 : 그들의 인생에 서 발생하는 사건들 보다는 오히려, 사람들 사이의 상호교류가 사회심리학의 주된 초점이다.\n해설 :\nIt is the interaction between people, rather than the events that occur in their lives, that is the main focus of social psychology\n* 이 문장은 It is --that -- 의 강조구문으로서 → 밑줄친 It is 와 that 을 생략하면 나머지 부분만으로 문장이 구성된다.\n* It is 와 that 을 생략하고 나머지 부분만의 문장구성을 보면\nThe interaction between people, rather than the events that occur in their lives, is the main focus of social psychology 와 같이 되는데, 여기서 is의 앞부분 전체가 주어이고, is 가 동사, 나머지가 보어이다.\n* The interaction between people, rather than the events that occur in their lives, = (주어) 그들의 인생에 서 발생하는 사건들 보다는 오히려, 사람들 사이의 상호교류\n* is = (동사)\n* the main focus of social psychology = (보어) 사회심리학의 주된 초점.\n\n참고 : It is --- that --- 의 강조구문에서 → It is 와 that 을 생략하면 나머지 부분만으로 문장이 구성된다.","lesson":20},{"n":574,"type":"error","note":false,"a":2,"fix":"almost","exp":"해석 : 미국의 가장 위대한 시인들 중의 하나인 Emily Dickinson 은 자기 시대의 사람들에게는 거의 알려지지 않았다.\n해설 :\n* Emily Dickinson = (주어)\n* one of the greatest poets of the United States = (주어와 동격의 명사)\n* was almost entirely unknown to the people of her own time = (동사+ . . .) 자기 시대의 사람들에게는 거의 알려지지 않았다.\n참고 : entirely(부사)를 수식하려면 almost (거의) 가 필요함.\n만약 most 로 수식하면 \u003c가장 완전히> 와 같이 해석되어 이상한 표현이 된다.","lesson":20,"parts":[["Emily Dickinson, ",null],["one","A"],[" of the greatest ",null],["poets","B"],[" of the United States, was ",null],["most","C"],[" entirely unknown to the people of her ",null],["own time","D"],[".",null]]},{"n":575,"type":"error","note":false,"a":3,"fix":"very well","exp":"해석 : 숯은 기체를 잘 흡수하기 때문에 탈취제로서 널리 사용된다.\n해설 :\n* Charcoal is employed widely as a deodorizer =  숯은 탈취제로서 널리 사용된다.\n* because it absorbs gases very well = (부사절) 그것은 기체를 잘 흡수하기 때문에\n참고 : as well 은 문장 뒤에 올때 \u003c역시>의 뜻으로 사용되므로 여기서는 어울리지 않음.","lesson":20,"parts":[["Charcoal is ",null],["employed","A"],[" widely as ",null],["a","B"],[" deodorizer because it ",null],["absorbs","C"],[" gases ",null],["as well","D"],[".",null]]},{"n":576,"type":"error","note":true,"a":3,"fix":"from","exp":"해석 : 추상표현주의는 1940년대 중반부터 1950년대 중반까지 번성했던 미국 회화에 있어서의 한 운동이었다.\n해설 :\n* Abstract Expressionism = (주어) 추상표현주의.\n* was = (동사)\n* a movement in American painting = (보어) 미국 회화에 있어서의 한 운동.\n* which flourished from the mid-1940's until the mid-1950's = (관계대명사절로서 앞의 명사 a movement 를 수식함)","lesson":20,"parts":[["Abstract Expressionism was a ",null],["movement","A"],[" in American ",null],["painting","B"],[" ",null],["which","C"],[" flourished ",null],["between","D"],[" the mid-1940's until the mid 1950's.",null]]},{"n":577,"type":"blank","stem":"The National Cowboy Hall of Fame in Oklahoma City pays tribute to everyone ----------------------------------.","choices":["associated with what Americans call the \"Old West.\"","and it is associated with what Americans call the \"Old West.\"","who is associated that Americans call the \"Old West.\"","associated with the Americans call the \"Old West.\""],"note":false,"a":0,"fix":"","exp":"해석 : Oklahoma 시에 있는 국립 카우보이 기념관은 미국인들이 소위 \"Old West\" 라고 부르는 것과 관련된 모든 사람들에게 경의를 표한다. (사람들을 기념한다)\n해설 :\n* The National Cowboy Hall of Fame in Oklahoma City = (주어)\n* pays = (동사)\n* tribute = (목적어)\n* pay tribute to -- = (숙어)  -- 에게 경의를표하다. --를 기념하다. --를 칭찬하다.\n* to everyone (who is) associated with what Americans call the \"Old West\" = (부사구/ 괄호부분 생략) 미국인들이 소위 \"Old West\" 라고 부르는 것과 관련된 모든 사람들.\n* what Americans call the \"Old West\" = the things which Americans call the \"Old West\" = 미국인들이 소위 \"Old West\" 라고 부르는 것.","lesson":20},{"n":578,"type":"blank","stem":"Fluorine, a greenish-yellow gas that is slightly heavier than air, is poisonous and corrosive and -----------------------------.","choices":["has a penetrating and disagreeable odor","that has a penetrating and disagreeable odor","has a penetrating odor and disagreeable","having a penetrating and disagreeable odor"],"note":false,"a":0,"fix":"","exp":"해석 : 공기보다 약간 더 무거운 녹황색의 기체인 플루오린(불소기체)은 독성과 부식성이 있으며, 예리하고 불쾌한 냄새를 가진다.\n해설 :\n* Fluorine = (주어) 플루오린(불소기체)\n* a greenish-yellow gas that is slightly heavier than air = (주어와 동격의 명사) 공기보다 약간 더 무거운 녹황색의 기체\n* is = (제 1동사)\n* poisonous and corrosive = (보어) 독성과 부식성이 있는.\n* has = (제 2동사)\n* a penetrating and disagreeable odor = (목적어) 예리하고 불쾌한 냄새\n참고 : (C)를 사용하면, 맨 끝에 있는 and 가 등위접속사인데 그 뒤에 오는 형용사(disagreeable)와 대응되게 연결할 말이 and 의 앞에 없어서 안됨.","lesson":20},{"n":579,"type":"error","note":false,"a":0,"fix":"been","exp":"해석 : The Obie Awards(연극상)은 1956년부터 매년 off-Broadway 연극에서 뛰어난 예술가에게 여태까지 수여되어왔다.\n해설 :\n* The Obie Awards = (주어) 연극상의 일종.\n* have been given = (동사/현재완료수동태) 여태까지 수여되어왔다.\n* annually = (부사) 매년.\n* since 1956 = (부사구) 1956년이래로.\n* to outstanding artists in off-Broadway theater = (부사구) off-Broadway 연극에서 뛰어난 예술가에게.\n참고 : off-Broadway theater = 미국 뉴욕에 있는 연극과 드라마의 중심가인 Broadway 의 연극이 너무 상업적으로 치우치는 것을 반대하여 생겨난 \u003c탈 브로드웨이 연극>을 의미함.","lesson":20,"parts":[["The Obie Awards have ",null],["being","A"],[" given ",null],["annually","B"],[" ",null],["since","C"],[" 1956 to ",null],["outstanding","D"],[" artists in off-Broadway theater.",null]]},{"n":580,"type":"blank","stem":"---------------------------------- many different kinds of raw materials.","choices":["The earliest soaps were made of","The earliest soaps made","The earliest soaps while being made of","Making the earliest soaps of"],"note":false,"a":0,"fix":"","exp":"해석 : 가장 초창기의 비누는 많은 여러 종류의 원료로부터 만들어졌다.\n해설 :\n* The earliest soaps = (주어)\n* were made = (동사/수동태)\n* of many different kinds of raw materials = (부사구) 많은 여러 종류의 원료로부터.\n\n참고 :\n* raw materials = 원료, 원자재 ↔ finished product = 완제품\n* \u003c--로부터 만들어지다>는 \u003cbe made of --> 또는 \u003cbe made from-->의 모양을 흔히 사용하는데, 전자는 보통 물리적변화, 후자는 화학적변화를 의미하는 경우가 흔하지만 반드시 그런 것은 아니고, 그런 구별없이 혼용하기도 한다.","lesson":20},{"n":581,"type":"blank","stem":"A white oak at Rutgers University ----------------------------- the inspiration for Joyce Kilmer's poem \"Trees.\"","choices":["said to have been","is said have been to","is said to have been","is to said that have been"],"note":true,"a":2,"fix":"","exp":"해석 : Rutgers 대학에 있는 흰 오크나무가, Joyce Kilmer 의 시 \"Trees\"를 위한 영감의 근원이었다고 일컬진다.\n해설 :\n* A white oak at Rutgers University = Rutgers 대학에 있는 흰 오크나무.\n* is said to have been ～ = ～ 이었다고 일컬어진다.\n* the inspiration for Joyce Kilmer's poem \"Trees\" = Joyce Kilmer 의 시 \"Trees\"\n* 일반적으로 be said to be ～(걾??라고 일컬어지다) 의 모양을 사용하지만, 여기서는 \u003c영감의 근원이었던 것>이 \u003c일컬어지는 것>보다 먼저의 시제(과거의 시제)이므로 be said to have P.P.～ 의 모양을 사용했음.","lesson":20},{"n":582,"type":"blank","stem":"Not even films or television can boast of reaching a third of humanity, ---------------------------------.","choices":["as can as the comic strip","as the comic strip as can","as can the comic strip","as can the comic strip as"],"note":false,"a":2,"fix":"","exp":"해석 : 영화나 텔레비젼 조차도, 만화가 할 수 있는 것 처럼, 인류의 1/3에 접한다는 것을 자랑할 수는 없다.\n* 의역 : 영화나 텔레비젼이 아무리 많은 인구에게 전달된다 하더라도, 만화만큼 그렇게 많은 인구(인류의 1/3)에 도달하지는 못한다.\n해설 :\n* Not even films or television = (주어) 영화나 텔레비젼조차도 ～하지 못한다.\n* can boast of = (동사) 자랑하다.\n* reaching a third of humanity = (동명사로서 목적어) 인류의 1/3에 접한다는 것\n* as can the comic strip = (부사절) 만화가 할 수 있는 것처럼.","lesson":20},{"n":583,"type":"blank","stem":"Instead of teeth, the blue whale has a row of bony plates in its mouth --- ,"a":2,"fix":"","exp":"해석 : 그들 자신의 음식을 제조하는, 식물과는 달리, 동물은 그들의 음식을 획득하고 삼킴으로써 영양분을 얻는다.\n해설 :\n* Unlike plants = (부사구) 식물과는 달리.\n* which manufacture their own food = (관계대명사절로서 앞의 명사 plants를 수식함) 그들 자신의 음식을 제조하는.\n* animals = (주어)\n* obtain = (동사) 얻는다.\n* nourishment = (목적어) 영양분.\n* by acquiring and ingesting their food = (부사구) 그들의 음식을 획득하고 삼킴으로써.","lesson":23},{"n":688,"type":"error","note":false,"a":1,"fix":"what","exp":"해석 : 위대한 그리고 중요한 극작가로 널리 인정받는 Eugene O'Neill 은, 미국의 무대에, \u003c아마도 미국의 첫 번째 진정한 본격적 드라마였던 것> 을 가져왔다.\n해설 :\n* Widely acknowledged as a great and important playwright = (분사구의 형용사적 용법) 위대한 그리고 중요한 극작가로 널리 인정받는.\nEugene O'Neill, (who is) widely acknowledged as a great and important playwright, brought ----------. 이와같은 문장에서 who is를 생략하고 줄친부분을 문두로 옮기면 문제와 같은 분사구가 된다.\n* Eugene O'Neill = (주어) 유진오닐. 미국의 유명한 극작가, 노벨문학상 수상자.\n* brought = (동사) 가져왔다.\n* to the United States stage = (부사구) 미국의 무대에.\n* what was probably its first really serious drama = (명사절로서 목적어) 아마도 미국의 첫 번째 진정한 본격적 드라마였던 것.","lesson":23,"parts":[["",null],["Widely","A"],[" acknowledged as a great and important playwright, Eugene O'Neill brought to the United States stage ",null],["that","B"],[" was probably ",null],["its","C"],[" first ",null],["really serious","D"],[" drama.",null]]},{"n":689,"type":"error","note":false,"a":3,"fix":"in","exp":"해석 : 항공의 위대한 개척자인 Amelia Earhart 는, 그녀가 1937년 세계일주를 하려는 불운한 그녀의 시도를 착수했을 때 이미 유명했었다.\n해설 :\n* A great aviation pioneer, Amelia Earhart = (동격의 명사 + 주어) 항공의 위대한 개척자인 Amelia Earhart\n* was already famous = (동사+보어) 이미 유명했었다.\n* when 이하는 부사절로서 (--가 --했을 때)로 해석.\n* she = (주어)\n* set out on ～ = (동사) ～를 착수하다.\n* her ill-fated attempt to circle the globe = (목적어) 세계일주를 하려는 불운한 그녀의 시도.\n* attempt to V = V 하려는 시도.\n* circle the globe = 세계를 일주하다. (여기서 circle 은 동사)","lesson":23,"parts":[["A great ",null],["aviation","A"],[" pioneer, Amelia Earhart ",null],["was","B"],[" already famous when she set ",null],["out on","C"],[" her ill-fated attempt to circle the globe ",null],["of","D"],[" 1937.",null]]},{"n":690,"type":"error","note":false,"a":2,"fix":"뺀다.","exp":"해석 : 사과는 추운 계절 동안에는 자라지 않지만, 사과나무들은 번성하기 위해서 그러한 계절이 있어야만 한다.\n해설 :\n* Although apples do not grow during the cold season = (부사절) 사과는 추운 계절 동안에는 자라지 않지만.\n* apple trees must have such a season in order to flourish = (주절) 사과나무들은 번성하기 위해서 그러한 계절이 있어야만 한다.\n* such a season = 그러한 계절(추운계절).\n* in order to flourish = (부정사의 부사적용법) 번성하기 위해서.","lesson":23,"parts":[["Although apples ",null],["do not","A"],[" grow during the cold season, apple trees must have ",null],["such a","B"],[" season ",null],["as","C"],[" in order ",null],["to flourish","D"],[".",null]]},{"n":691,"type":"blank","stem":"The Hawaiian alphabet, ----------------------------------, consists of five vowels and only seven consonants.","choices":["was introduced by missionaries in the 1820's and","if introduced by missionaries in the 1820's","introduced by missionaries in the 1820's","introduced missionaries in the 1820's"],"note":true,"a":2,"fix":"","exp":"해석 : 1820년대 선교사들에 의해서 소개되었던 하와이의 알파벳은 5 개의 모음과 단지 7개의 자음으로 구성된다.\n해설 :\n* The Hawaiian alphabet, (which was) introduced by missionaries in the 1820's, = (주어+ 관계대명사절) 1820년대 선교사들에 의해서 소개되었던 하와이의 알파벳.\n* consists of ～ = (동사) ～로 구성된다.\n* five vowels and only seven consonants = (목적어) 5 개의 모음과 단지 7개의 자음.","lesson":24},{"n":692,"type":"blank","stem":"---------------------------- inanimate objects, such as machines, is a form of animism.","choices":["Attributing emotion to","When attributing emotion to","Emotion attributed to","If emotion is attributed to"],"note":false,"a":0,"fix":"","exp":"해석 : 예를 들면 기계와 같은, 무생물에 감정이 있다고 생각하는 것은 한 형태의 (일종의) 물활론이다.\n해설 :\n* Attributing emotion to inanimate objects, such as machines, = (주어) 예를 들면 기계와 같은, 무생물에 감정이 있다고 생각하는 것.\n* attribute A to B = A 가 B에 속하는 것으로 생각하다, B가 A를 가지고 있다고 생각하다.\n* is = (동사)\n* a form of animism = (보어) 한 형태의 (일종의) 물활론.\n* animism = 물활론/ 무생물에도 정신이나 영혼 등이 있다고 믿는 것.","lesson":24},{"n":693,"type":"error","note":false,"a":3,"fix":"permanently","exp":"* 해석 : 북극지방의 두 가지 독특한 특징은 강수량의 부족과 영구히 얼어붙은 땅이다.\n* 해설 :\n* Two unique features of the Arctic = (주어) 북극지방의 두 가지 독특한 특징.\n* are =\n* lack of precipitation and permanently frozen ground = (보어) 강수량의 부족과 영구히 얼어붙은 땅.","lesson":24,"parts":[["",null],["Two","A"],[" unique features of ",null],["the","B"],[" Arctic are ",null],["lack of","C"],[" precipitation and ",null],["permanent","D"],[" frozen ground.",null]]},{"n":694,"type":"error","note":false,"a":1,"fix":"stepped up","exp":"해석 : 1970년대 석유부족에 직면해서 미국의 과학자와 기술자들은 더욱 효율적인 난방장치와 더 나은 단열장치를 개발하려는 그들의 노력을 가속시켰다.\n해설 :\n* Faced with petroleum shortages in the 1970's = (분사구) 다음과 같은 부사절에서 괄호 부분을 생략한 것.  (When they were) faced with petroleum shortages in the 1970's\n* scientists and engineers in the United States = (주어) 미국의 과학자와 기술자들.\n* stepped up = (동사) 가속시켰다.\n* their efforts to V = V하려는 그들의 노력.\n* to develop more efficient heating systems and better insulation = (부정사의 형용사적용법/ 앞의 명사 efforts를 수식함) 더욱 효율적인 난방장치와 더 나은 단열장치를 개발하려는.","lesson":24,"parts":[["Faced ",null],["with","A"],[" petroleum shortages in the 1970's, scientists and engineers in the United States ",null],["stepping up","B"],[" their ",null],["efforts","C"],[" to develop more efficient heating systems and ",null],["better","D"],[" insulation.",null]]},{"n":695,"type":"error","note":false,"a":0,"fix":"large","exp":"해석 : 토끼는 큰 앞니, 짧은 꼬리, 그리고 달리기와 높이 뛰기에 적응된 뒷다리와 발을 가지고 있다.\n해설 :\n* Rabbits = (주어)\n* have = (동사)\n* large front teeth = (제 1 목적어) 큰 앞니.\n* short tails = (제 2 목적어) 짧은 꼬리.\n* hind legs and feet adapted for running and jumping = (제 3 목적어) 달리기와 높이 뛰기에 적응된 뒷다리와 발.","lesson":24,"parts":[["Rabbits have ",null],["large and","A"],[" front teeth, short ",null],["tails","B"],[", and hind legs ",null],["and","C"],[" feet ",null],["adapted","D"],[" for running and jumping.",null]]},{"n":696,"type":"error","note":true,"a":1,"fix":"is known","exp":"해석 : 알려진 바에 의하면, 돌고래는 냄새 감각을 가지고 있지 않다.\n해설 :\n* As far as is known = (부사절/ 일종의 숙어 blank","stem":"The early years of the United States government were characterized by ----------------------- the federal government or individual states should have more power.","choices":["concerning a debate whether","whether a debate concerning","a debate whether concerning","a debate concerning whether"],"note":false,"a":3,"fix":"","exp":"해석 : 미국정부의 초창기는, \u003c연방정부가 더 많은 권한을 가질 것인지 아니면 각각의 주정부가 더 많은 권한을 가질 것인지에 관한 논쟁>을 그 하나의 특징으로 가진다.\n해설 :\n* The early years of the United States government = (주어) 미국정부의 초창기.\n* were characterized by = (동사/수동태 + by) ～에 의해 특징지워진다. (의역: ～라는 특징을 가진다. 그것의 특징이 ～이다.)\n* by a debate = (부사구) 논쟁에 의해.\n* concerning ～ = (전치사) ～에 관한.\n* whether the federal government or individual states should have more power = (명사절로서 앞의 전치사 concerning 의 목적어) 연방정부가 더 많은 권한을 가질 것인지 아니면 각각의 주정부가 더 많은 권한을 가질 것인지.","lesson":24},{"n":703,"type":"error","note":false,"a":1,"fix":"single-celled","exp":"해석 : 식물은 크기에 있어서, 육안으로 보이지 않는 작고, 단세포이며, 청록색인 해초로부터, 세상에서 가장 큰 식물인 거대한 세코이아 나무에 이르기까지 다양하다.\n해석 :\n* Plants = (주어) 식물.\n* range = (동사) 다양하다, 범위에 걸친다.\n* range from A to B = (동사) A에서 B에 이르기까지 다양하다, (범위에 걸친다.)\n* in size = (부사구) 크기에 있어서.\n* from tiny, single-celled, blue-green algae, invisible to the naked eye, =  육안으로 보이지 않는 작고, 단세포이며, 청록색인 해초로부터.\n* to giant sequoias, the largest living plants = 세상에서 가장 큰 식물인 거대한 세코이아 나무에 이르기까지.\n* giant sequoias 와 the largest living plants 는 동격의 명사.\n참고 :\n* single-celled 와 같이 \u003c형용사-명사ed> 의 모양은 \u003c어떠한 ～를 가진>을 의미하는 유사분사의 일종.\n(예) 빨간 머리의 소녀 = a red-haired girl / 긴 꼬리를 가진 동물들 = long-tailed animals","lesson":24,"parts":[["Plants range in size ",null],["from","A"],[" tiny, ",null],["single-cell","B"],[", blue-green algae, invisible to the ",null],["naked","C"],[" eye, to giant sequoias, the ",null],["largest","D"],[" living plants.",null]]},{"n":704,"type":"error","note":false,"a":3,"fix":"it was","exp":"해석 : 1940년대에 과학과 공학은, 음악이 관중에게 도달하는 방식에 영향을 끼쳤으며, 그것(음악)이 작곡되는 방법에조차도 영향을 주었다.\n해설 :\n* During the 1940's = (부사구) 1940년대에.\n* s learn 을 원형으로 쓰고, help 를 비사역동사로 사용하면 목적격보어를 to learn 으로 쓴다. 둘 다 가능함.) 학생들이 배우도록 도와주는 것.\n* what they need to know = (learn 의 목적어 역할을 하는 명사절) 그들이 알 필요가 있는 것.\n* to live a well-adjusted and successful life = (부정사의 부사적 용법으로 --하기 위해서) 그들(학생들)이 잘 적응되고 성공적인 인생을 살기 위해서.","lesson":25,"parts":[["According to some educators, the goal of ",null],["teaching","A"],[" is ",null],["to help","B"],[" students ",null],["learning","C"],[" what they need to know ",null],["to live","D"],[" a well-adjusted and successful life.",null]]},{"n":750,"type":"error","note":false,"a":2,"fix":"contains","exp":"해석 : 민들레는, 희고 우유 같은 즙을 포함하는, 곧고, 매끈하고, 속이 빈 줄기를 가진다.\n해설 :\n* The dandelion plant = (주어) 민들레. (대표단수로서 앞에 the 를 썼음)\n* has = (동사) 가진다.\n* a straight, smooth, and hollow stem = 곧고, 매끈하고, 속이 빈 줄기.\n* that contains a white, milky juice = (앞의 명사 stem 을 수식하는 관계대명사절) 희고 우유 같은 즙을 포함하는.","lesson":25,"parts":[["",null],["The","A"],[" dandelion plant has a ",null],["straight","B"],[", smooth, and hollow stem that ",null],["containing","C"],[" a white, ",null],["milky","D"],[" juice.",null]]},{"n":751,"type":"error","note":true,"a":1,"fix":"makes","exp":"해석 : 자외선과 적외선 복사에 대한 사파이어의 투과성(투명성)이 그것(사파이어)을 광학 도구에 있어서 유용한 것으로 만들어준다.\n해설 :\n* The sapphire's transparency to ultraviolet and infrared radiation = (주어) 자외선과 적외선 복사에 대한 사파이어의 투과성(투명성).\n* makes = (동사) 만들어준다.\n* it = (목적어) 그것(사파이어)을.\n* useful = (목적격보어) 유용한.\n* in optical instruments = (부사구) 광학 도구에 있어서.","lesson":26,"parts":[["The sapphire's transparency ",null],["to ultraviolet","A"],[" and infrared radiation ",null],["make","B"],[" it ",null],["useful","C"],[" ",null],["in optical","D"],[" instruments.",null]]},{"n":752,"type":"blank","stem":"Most famous scientists achieved initial recognition while ------------------------.","choices":["it is still quite young","still it is quite young","quite still young","still quite young"],"note":false,"a":3,"fix":"","exp":"해석 : 대부분의 과학자들은 그들의 아직도 꽤 어릴 때 처음 명성을 얻었다.\n해설 :\n* Most famous scientists = (주어) 대부분의 과학자들.\n* achieved = (동사) 얻었다.\n* initial recognition = (목적어) 처음 명성.\n* while (they were) still quite young = (부사절/ 괄호부분 생략) 그들의 아직도 꽤 어릴 때.","lesson":26},{"n":753,"type":"error","note":false,"a":2,"fix":"theoretical","exp":"해석 : 17세기에 발전된 운동법칙이, 공기 역학과 모든 다른 종류의 이론적인 역학의 밑에 근거를 이루고 있다.\n해설 :\n* 도치법 제 4번 (자동사의 도치법이 응용된 모양)\n원래의 모양은 다음과 같은데,\nThe laws of motion which were developed in the seventeenth century = (주어) 17세기에 발전된 운동법칙.\nare underlying = (동사) ～의 밑에 근거를 이루고 있다.\naerodynamics and all other branches of theoretical mechanics = (목적어) 공기 역학과 모든 다른 종류의 이론적인 역학.\n위의 동사(be + V-ing)에서 V-ing를 문장의 맨 앞으로 옮기고 그 다음에 \u003c목적어 + be동사 + 주어> 의 순서로 나열하여 다음과 같이 된다. \u003cV-ing + 목적어 + be동사 + 주어>\nUnderlying aerodynamics and all other branches of theoretical mechanics are the laws of motion\nwhich were developed in the seventeenth century.\n\n* 도치법 제 4번 : \u003c주어 + 자동사 + 보어(또는 부사)> 와 같은 모양에서 \u003c보어(또는 부사) + 자동사 + 주어> 의 어순으로 바꾼 것.\n* 도치법 제 4번의 응용 : \u003c주어 + 동사(be+V-ing 또는 be+P.P.) + 목적어 > 의 모양에서,\n(V-ing+목적어) 또는 (P.P.+목적어)를 마치 도치법 제 4번에서의 \u003c보어>나 \u003c부사>인 것처럼 취급하여 함께 묶어서 문장의 앞으로 옮겨, \u003c (V-ing+목적어) 또는 (P.P.+목적어) + be 동사 + 주어 > 의 모양으로 만든 것.","lesson":26,"parts":[["",null],["Underlying","A"],[" aerodynamics and ",null],["all other","B"],[" branches of ",null],["theoretically","C"],[" mechanics are the laws of motion which ",null],["were developed","D"],[" in the seventeenth century.",null]]},{"n":754,"type":"error","note":false,"a":1,"fix":"devoted","exp":"해석 : 1918년에 개장한 워싱턴 D.C. 의 The Phillips Collection 은 현대 미술을 위해 전용으로 사용된 미국에서의 첫 번째 박물관이었다.\n해설 :\n* The Phillips Collection in Washington, D.C., which opened in 1918, = (주어+ 관계대명사절) 1918년에 개장한 워싱턴 D.C. 의 The Phillips Collection.\n* was = (동사)\n* the first museum in the United States (which was) devoted to modern art = (보어/괄호부분 생략) 현대 미술을 위해 전용으로 사용된 미국에서의 첫 번째 박물관.\n* be devoted to ～ = ～에 헌신하다, ～에 바치다, ～를 위해서 전용으로 사용되다.","lesson":26,"parts":[["The Phillips Collection in Washington, D.C., which ",null],["opened","A"],[" in 1918, was the first museum in the United States ",null],["devotion","B"],[" ",null],["to","C"],[" modern ",null],["art","D"],[".",null]]},{"n":755,"type":"error","note":false,"a":3,"fix":"owning","exp":"해석 : 부동산 담보대출은 사람으로 하여금 한번에 그것(부동산)에 대해서 돈을 지불하지 않고서도 부동산을 구입할 수 있게 해준다; 그래서 더 많은 사람들이 집을 소유하는 것을 즐길 수 있다.\n해설 :\n* 세미콜론(;)을 중심으로 앞에도 절이 있고 뒤에도 절이 있다.\n* 첫 번째 절은 5형식으로서,\n* A mortgage = (주어) 부동산 담보대출.\n* enables = (동사) ～에게 ～할 수 있게 해준다.\n* a person = (목적어)\n* to buy property without paying for it outright = (목적격보어) 그것(부동산)에 대해서 돈을 지불하지 않고서도 부동산을 구입할 수 있게.\n* without + V-ing = V하지 않고서.\n* 두번째 절에서,\n* thus = (부사) 그래서.\n* more people = (주어) 더 많은 사람들\n* are able to enjoy = (동사) 즐길 수 있다.\n* enjoy는 그 뒤의 목적어로서 부정사를 사용하지 않고 동명사를 사용함.\n* owning a house = (동명사로서 목적어) 집을 소유하는 것.\n참고:\n* 세미콜론(;)은 절과 절 사이를 연결하는 접속사 대신 사용할 수 있다.","lesson":26,"parts":[["A mortgage enables a person ",null],["to buy","A"],[" property ",null],["without","B"],[" paying for it outright; ",null],["thus","C"],[" more people are able to enjoy ",null],["owned","D"],[" a house.",null]]},{"n":756,"type":"blank","stem":"The oriental fruit fly causes extensive damage to grapefruit, lemons and oranges but ------------------------------------","choices":["not harm to the trees on which the fruit grows.","does not to harm the trees on which the fruit grows.","does not harm to the trees on which the fruit grows.","does not give harm to the trees on which the fruit grows."],"note":true,"a":3,"fix":"","exp":"해석 : 동양산 과일나무 파리는 자몽과 레몬과 오렌지에 광범위한 피해를 가한다, 그러나 그 과일이 자라는 나무에게는 해를 주지 않는다.\n해설 :\n* The oriental fruit fly = (주어) 동양산 과일나무 파리(해충의 일종)\n* causes = (동사) 발생시킨다, (피해를) 가한다.\n* extensive damage = (목적어) 광범위한 피해.\n* to grapefruit, lemons and oranges = (부사구) 자몽과 레몬과 오렌지에.\n* but 이후에는 두 번째 동사가 있음.\n* does not give = (동사) 주지 않는다.\n* harm = (목적어) 해.\n* to the trees = (부사구) 그 나무에게.\n* on which the fruit grows = (the trees를 수식하는 관계 대명사절) (그 위에서) 그 과일이 자라는.\n참고 :\n* does not harm 을 사용한다면 이때 harm 이 동사가 되므로, 그 뒤에 does not harm the trees 와 같이  전치사 없이 목적어를 써야한다.","lesson":26},{"n":757,"type":"error","note":false,"a":2,"fix":"occurred","exp":"해석 : 텍사스 주의 Big Bend 국립공원에 있는 Chisos 산맥은 공룡이 그 지역을 돌아다녔던 때에 발생한 화산분출에 의해서 만들어졌다.\n해설 :\n* The Chisos Mountains in Big Bend National Park in Texas = (주어) 텍사스 주의 Big Bend 국립공원에 있는 Chisos 산맥.\n* were created = (동사/수동태) 만들어졌다.\n* by volcanic eruptions = (부사구) 화산분출에 의해서.\n* that occurred when dinosaurs roamed the area = (관계 대명사절/ 그 안에 when 이 이끄는 부사절이 있음) 공룡이 그 지역을 돌아다녔던 때에 발생한.\n* occur 는 자동사이므로 수동태로 쓰지 않는다.","lesson":26,"parts":[["The Chisos Mountains in Big Bend National Park in Texas were ",null],["created","A"],[" by ",null],["volcanic","B"],[" eruptions that ",null],["were occurred","C"],[" when dinosaurs roamed ",null],["the area","D"],[".",null]]},{"n":758,"type":"blank","stem":"Like ethnographers, ethnohistorians make systematic observations, ----------------------------------------.","choices":["but they also gather data from documentary and oral sources","and also gathering data from documentary and oral sources","but documentary and oral sources they also gather data","and they also gather documentary and oral sources data"],"note":false,"a":0,"fix":"","exp":"해석 : 인류통계학자들과 마찬가지로 인류역사학자들도 체계적인 관찰을 한다, 그러나 그들(인류역사학자들)은 문서기록이나 구전의 근원으로부터도 역시 데이터를 수집한다.\n해설 :\n* Like ethnographers = (부사구) 인류통계학자들과 마찬가지로.\n* ethnohistorians = (주어) 인류역사학자들.\n* make systematic observations = (동사+ 목적어) 체계적인 관찰을 한다.\n* but they also gather data = 그러나 그들(인류역사학자들)은 역시 데이터를 수집한다.\n* from documentary and oral sources = 문서기록이나 구전의 근원으로부터.","lesson":26},{"n":759,"type":"error","note":false,"a":2,"fix":"healthy","exp":"해석 : 기초체온은 깨어있는 시간동안 한 건강한 사람의 가장 낮은 온도를 일컫는다.\n해설 :\n* Basal body temperature = (주어) 기초체온.\n* refers to = (동사) 일컫는다, 의미한다, 지칭한다.\n* the lowest temperature of a healthful individual = (목적어) 한 건강한 사람의 가장 낮은 온도.\n* during waking hours = (부사구) 깨어있는 시간동안.\n참고 :\n* healthful = 건강에 좋은 (음식)\n* healthy = 건강한 (사람)","lesson":26,"parts":[["Basal body temperature refers ", em more fragile.",null]]},{"n":763,"type":"blank","stem":"The Moon's gravitational field cannot keep -------------------------.","choices":["atmospheric gases escaping into space","from escaping atmospheric gases into space","atmospheric gases from escaping into space","escaping atmospheric gases from space"],"note":false,"a":2,"fix":"","exp":"해석 : 달의 중력장은 (약하기 때문에) 대기가스를 우주공간으로 달아나지 못하도록 막을 수가 없다.\n해설 :\n* The Moon's gravitational field = (주어) 달의 중력장.\n* cannot keep = (동사) 막을 수가 없다.\n* atmospheric gases = (목적어) 대기가스.\n* from escaping into space = (부사구) 우주공간으로 달아나지 못하도록.\n* keep + O + from + V-ing = O를 V하지 못하게 막다.","lesson":26},{"n":764,"type":"blank","stem":"------------------------------------------, its wood is used extensively for flooring, furniture, boxes, and crates.","choices":["Although chiefly valued the pecan tree for its fruit","Although the pecan tree is chiefly valued for its fruit","Although the pecan tree chiefly value for its fruit","Although the pecan tree's chief value for its fruit"],"note":false,"a":1,"fix":"","exp":"해석 : pecan 나무는 주로 그것의 과일 때문에 가치를 인정받지만, 그것의 목재는 바닥재, 가구, 상자, 나무상자 등을 만드는데 광범위하게 사용된다.\n해설 :\n* Although the pecan tree is chiefly valued for its fruit = (부사절)\n* the pecan tree = (주어) pecan 나무\n* be valued for ～= (동사/수동태+전치사) ～때문에 가치를 인정받다.\n* chiefly = (부사) 주로.\n* its wood is used extensively for flooring, furniture, boxes, and crates = (주절)\n* its wood = (주어) 그것의 목재\n* is used = (동사) 사용된다.\n* extensively = (부사) 광범위하게\n* for flooring, furniture, boxes, and crates = 바닥재, 가구, 상자, 나무상자 등을 만드는데.","lesson":26},{"n":765,"type":"error","note":false,"a":3,"fix":"publishing","exp":"해석 : 1890년에 텍사스에서 태어난 Katherine Anne Porter 는 그녀의 유명한 소설 Ship of Fools 를 1962년에 출판하기 전에, 3개의 단편소설 모음집을 제작했다.\n해설 :\n* Born in Texas in 1890 = (분사구) → 주어(Katherine Anne Porter)의 뒤에 있던 관계대명사절 ,who was born in Texas in 1890, 에서 who was 를 생략하고 나머지 부분을 문장의 앞으로 옮긴 것. 1890년에 텍사스에서 태어난.\n* Katherine Anne Porter = (주어)\n* produced = (동사) 제작했다.\n* three collections of shor "n":771,"type":"blank","stem":"A number of the American Indian languages spoken at the time of the European arrival in the New World in the late fifteenth century -------------------------.","choices":["they have become extinct","and have become extinct","which have become extinct","have become extinct"],"note":true,"a":3,"fix":"","exp":"해석 : 15세기 후반에 미국에 유럽인들이 도착했을 당시 행해졌던 미국인디안 언어들 중에서 많은 부분이 멸종되었다. (사라졌다)\n해설 :\n* A number of the American Indian languages = (주어) 미국인디안 언어들 중에서 많은 부분.\n* (which were) spoken at the time of the European arrival in the New World in the late fifteenth century = (주어를 수식하는 관계대명사절/ 괄호부분을 생략한 것으로 볼 수 있음) 미국에 유럽인들이 도착했을 당시 행해졌던.\n* have become extinct = (동사/현재완료 + 보어) 멸종되었다. 사라졌다.\n참고 :\nA number of + 복수명사 = many + 복수명사 = 많은 ～.\nA number of the + 복수명사 = many of the 복수명사 = ～중에서 많은 숫자(많은 부분).","lesson":26},{"n":772,"type":"blank","stem":"There are about 350 species of sharks, ----------------------------, only a few species will attack people.","choices":["although they are all carnivorous","and although they are all carnivorous","and they are all carnivorous","although and they are all carnivorous"],"note":false,"a":1,"fix":"","exp":"해석 : 상어의 종류는 약 300종이 있다, 그리고 그들이 모두 육식성이지만, 단지 몇 종류만이 인간을 공격한다.\n해설 :\n* 이 문장은 접속사 2개 (등위접속사 and 와 부사절 접속사 although)로 3 개의 절이 연결되어있음.\n* There are about 350 species of sharks = (제 1 주절) 상어의 종류는 약 300종이 있다.\n* and 의 뒤에는 부사절과 제 2 주절이 있음.\n* although they are all carnivorous = (부사절) 그들이 모두 육식성이지만.\n* carnivorous = (형) 육식성인.\n* only a few species will attack people = (제 2 주절) 단지 몇 종류만이 인간을 공격한다.","lesson":26},{"n":773,"type":"error","note":false,"a":3,"fix":"lag","exp":"해석 : 1920년대부터 현재까지 지속되어온 미국농업의 문제점들 중의 하나는, 농장의 수입이 상품생산비보다 뒤떨어지는 경향(추세)이다.\n* One of the problems of United States agriculture\n* that has persisted from the 1920's until the present day = (주어 one 을 수식하는 관계 대명사절) 1920년대부터 현재까지 지속되어온.\n* is = (동사)\n* the tendency of farm income to be lag behind the costs of production = (보어) 농장의 수입이 상품생산비보다 뒤떨어지는 경향(추세).","lesson":26,"parts":[["One of the problems of United States agriculture that ",null],["has","A"],[" persisted from the 1920's until ",null],["the present day","B"],[" is the tendency ",null],["of farm","C"],[" income to ",null],["be lag","D"],[" behind the costs of production.",null]]},{"n":774,"type":"error","note":false,"a":1,"fix":"most","exp":"해석 : 화산은 지구상에서 여러 지질학적인 환경에서 발생하는데, 그 중의 대부분은 암석권을 구성하고있는 거대하고 단단한 지판들의 경계선과 관련이 있다.\n해설 :\n* Volcanism occurs on Earth in several geological settings = (주절) 화산은 여러 지질학적인 환경에서 발생한다.\n* Volcanism = (주어) 화산(집합적 개념으로 단수 취급함)\n* occurs = (동사) 발생한다.\n* on Earth = (부사구) 지구상에서.\n* in several geological settings = (부사구) 여러 지질학적인 환경에서.\n* most of which are associated with the boundaries of the enormous, rigid plates = (게속적용법의 관계 대명사절) 그 중의 대부분은 거대하고 단단한 지판들의 경계선과 관련이 있다.\n* that make up the lithosphere = (앞의 명사 plates 를 수식하는 관계 대명사절) 암석권을 구성하고있는.\n* make up = 구성하다.\n* lithosphere = 암석권. (지구상에서 돌과 흙이 차지하고 있는 부분 전체를 말함)","lesson":26,"parts":[["Volcanism occurs ",null],["on Earth","A"],[" in several geological settings, ",null],["the most","B"],[" ",null],["of which","C"],[" are associated with the boundaries of the ",null],["enormous, rigid","D"],[" plates that make up the lithosphere.",null]]},{"n":775,"type":"error","note":false,"a":1,"fix":"from(또는 of)","exp":"해석 : 북미에서 초창기 유럽의 정착자들은, 감기, 폐염, 그리고 말라리아와 비슷한 병인 학질을 치료하기 위해서 토종 식물로부터 그들이 만든 약들을 사용했다.\n해설 :\n* Early European settlers in North America = (주어) 북미에서 초창기 유럽의 정착자들.\n* used = (동사) 사용했다.\n* medicines = (목적어) 약들.\n* (which) they made from native plants = (앞의 명사 medicines 를 수식하는 관계 대명사절/ which를 생략했음.) 토종 식물로부터 그들이 만든.\n* native plants 는 약을 만든 \u003c도구>가 아니고 \u003c재료>이므로 with 가 아니고 from 이나 of 을 써야한다.\n* to treat colds, pneumonia, and ague, an illness similar to malaria = (부정사의 부사적 용법) 감기, 폐염, 그리고 말라리아와 비슷한 병인 학질을 치료하기 위해서.","lesson":26,"parts":[["Early European settlers in North America ",null],["used","A"],[" medicines they ",null],["made with","B"],[" native plants to tr Emily Dickinson 은, 한정된 발행 부수의 출판물에 등장했던 7 개를 제외하고는, 그녀의 모든 시가 출판되지 않은 채로 세상을 떠났다.\n* Emily Dickinson, (who was) among the greatest women poets in the English language, =\n* died\n* with all of her poems unpublished = (분사구) 그녀의 모든 시가 출판되지 않은 채로.\n* All of her poems were unpublished 라는 문장을 분사구로 고치면 \u003c주어>는 앞에 있는 주절의 주어와 다르므로 그대로 쓰고, \u003c동사>는 being unpublished 가 되는데, \u003c주어가 다를 경우 분사구 앞에 with를 사용할 수 있다>는 규칙에 의하여 with 를 붙이고 \u003cwith를 사용하는 경우는 대개 being을 생략한다>는 규칙에 의하여 being을 없애버리면 문제에 있는 모양의 분사구가 된다.\n* except for seven (that appeared in publications of limited circulation) = (부사구/ 괄호부분은 seven을 수식하는 관계 대명사절) 한정된 발행 부수의 출판물에 등장했던 7 개를 제외하고는.\n* appeared = 나타났다, 등장했다.\n* publications = 출판물.\n* limited circulation = 한정된 발행 부수.","lesson":27},{"n":792,"type":"error","note":false,"a":3,"fix":"took place","exp":"해석 : 마틴 루터 킹 2세는 1963 년 Washington에서 발생했던 그 대규모의 인권행진을 조직한 것으로 유명하다.\n해설 :\n* Martin Luther King, Jr. = (주어) 마틴 루터 킹 2세\n* is = (동사)\n* well-known = (보어) 유명한.\n* for organizing the huge human rights march = 그 대규모의 인권행진을 조직한 것으로(조직한 것 때문에).\n* human rights march = 인권행진.\n* that took a place in Washington in 1963 = (앞의 명사 the huge human rights march 를 수식하는 관계대명사절) 1963 년 Washington에서 발생했던.","lesson":27,"parts":[["Martin Luther King, Jr. is well-known ",null],["for","A"],[" organizing ",null],["the huge","B"],[" human ",null],["rights","C"],[" march that ",null],["took a place","D"],[" in Washington in 1963.",null]]},{"n":793,"type":"error","note":false,"a":2,"fix":"along","exp":"해석 : 번개의 섬광은, 지구의 자장을 따라서 장거리를 여행할 수 있는 전자기파를 발생시킨다.\n해설 :\n* A lightning flash = (주어) 번개의 섬광.\n* produces = (동사) 발생시킨다.\n* electromagnetic waves = (목적어) 전자기파.\n* that may travel along the Earth's magnetic field for long distances = (앞의 명사 electromagnetic waves 를 수식하는 관계대명사절) 지구의 자장을 따라서 장거리를 여행할 수 있는.","lesson":27,"parts":[["A lightning ",null],["flash","A"],[" produces electromagnetic waves ",null],["that","B"],[" may travel ",null],["alone","C"],[" the Earth's magnetic field ",null],["for long","D"],[" distances.",null]]},{"n":794,"type":"error","note":false,"a":0,"fix":"was destroyed","exp":"해석 : Arthur Miller 의 연극 \u003c어느 세일즈맨의 죽음>은 자기 자신의 공허한 가치관과 그가 살고있는 사회의 가치관에 의해서 파괴되는 어느 남자의 비극적인 이야기이다.\n해설 :\n* Arthur Miller's play Death of A Salesman = (주어) Arthur Miller 의 연극 \u003c어느 세일즈맨의 죽음>.\n* is = (동사)\n* the tragic story of a man = (보어) 어느 남자의 비극적인 이야기.\n* who was destroyed by his own hollow values and those of the society (he lives in) = (앞의 명사 a man 을 수식하는 관계대명사절/ 맨 뒤의 괄호부분은 the society 를 수식하는 관계대명사절)\n* hollow values = 공허한 가치관.\n* those = the values (가치관)","lesson":27,"parts":[["Arthur Miller's play Death of A Salesman is the tragic story of a man ",null],["who destroyed","A"],[" by his own hollow ",null],["values","B"],[" and ",null],["those","C"],[" of the society he lives ",null],["in","D"],[".",null]]},{"n":795,"type":"blank","stem":"Because it was so closely related to communication, drawing was probably ----------------------.","choices":["the earliest art form that develop","the earliest form to develop art","the earliest art form to develop","the earliest to develop art form"],"note":false,"a":2,"fix":"","exp":"해석 : 그것은 의사소통과 아주 가깝게 관련이 있기 때문에, 그림은 아마도 (세상에서) 생겨난 가장 최초의 미술형태이었을 것이다.\n해설 :\n* Because it was so closely related to communication = (부사절) 그것은 의사소통과 아주 가깝게 관련이 있기 때문에.\n* drawing was probably the earliest art form to develop = (주절) 그림은 아마도 (세상에서) 생겨난 가장 최초의 미술형태이었을 것이다.\n* 현대 미국식 영어에서 the earliest 나 the first 등은 뒤에서 toV(부정사)로 수식한다.\n* 여기서 develop 는 자동사로서 \u003c생겨나다> 로 해석함.","lesson":27},{"n":796,"type":"error","note":true,"a":3,"fix":"their","exp":"해석 : 인류학 연구의 전문화된 특질은, 그들(사이)의 유사점과 차이점을 밝히기 위해서, 여러 종류의 그룹의 사람들이 연구되는 것을 불가피하게 만든다.\n(의역) 인류학 연구의 특징은 전문화라고 할 수 있는데, 그러한 전문화 때문에 여러 종류의 사람들의 그룹을 연구해야만 그 사람들 사이의 유사점과 차이점을 밝힐 수 있다.\n* The specialized nature of anthropological research = (주어) 인류학 연구의 전문화된 특질.\n* makes = (제 1동사)\n* it = (가목적어) that 의 이하의 명사절을 받음.\n* imperative = (형용사) 피할 수 없는, 긴급한, 필수적인, 불가피한.\n* that = (명사절접속사) 그 이하에서 동사를 원형(be studied)으로 쓰는 이유는 앞의 형용사(imperative)가 \u003c주장, 명령, 요구, 제안, 필요, 조건 등을 나타내므로.\n* various groups of people = (주어) 여러 종류 그룹의 사람들\n* be studied = (제 2동사/수동태) 연구되다.\n* to determine their similarities and differences = (부정사의 부사적용법) 그들(사이)의 유사점과 차이점을 밝히기 위해서.\n참고 :\n* 여기서 their는 various groups of people를 대신하는 대명사의 소유격으로 쓰임.","lesson":27,"parts":[["The specialized nature of anthropological research makes ",null],["it","A"],[" ",null],["imperative","B"],[" that various groups of people ",null],["be","C"],[" studied to determine ",null],["its","D"],[" similarities and differences.",null]]},{"n":797,"type":"error","note":false,"a":2,"fix":"뺀다","exp":"해석 : 지구가, 혜성의 분해에 의해서 발생된 한 군집의 입자들을 통과해서 지나갈 때 지구 대기에서의 유성의 빈도는 증가한다. (when 이하의 부사절부터 해석했음)\n해설 :\n* The frequency of meteors in the Earth's atmosphere = (주어) 지구 대기에서의 유성의 빈도.\n* meteor = 유성\n* increases = (동사/자동사) 증가한다.\n* when 이하는 부사절\n* the Earth = (주어) 지구.\n* passes = (동사) 지나가다.\n* through a swarm of particles = (부사구) 한 군집의 입자들을 통과해서.\n* (which is) generated by the breakup of a comet = (앞의 명사 a swarm of particles 를 수식하는 관계대명사절) 혜성의 분해에 의해서 발생된.\n* comet = 혜성.\n* (C) 의 or(등위접속사)를 사용하면 그 뒤에 있는 과거분사(generated)와 대응되는 말이 or 의 앞에 없어서 안됨.","lesson":27,"parts":[["The frequency of meteors in the Earth's ",null],["atmosphere","A"],[" increases ",null],["when","B"],[" the Earth passes through a swarm of particles ",null],["or","C"],[" generated by the ",null],["breakup of","D"],[" a comet",null]]},{"n":798,"type":"error","note":false,"a":1,"fix":"approximate","exp":"해석 : 이론이 진실에 얼마나 가깝게 접근하는가를 밝히는 것이 과학이 하는 일상적인 일이다.\n해설 :\n* Determining how closely theories approximate the truth = (주어/ 동명사 + how 의 명사절)\n* how closely theories approximate the truth = 명사절로서 동명사 determining 의 목적어.\n* how 의 명사절 안에서 →\n* how closely = (부사) 얼마나 가깝게.\n* theories = (주어) 이론.\n* approximate = (동사) 접근하다.\n* the truth = (목적어) 진실.\n* is = (문장의 주동사)\n* the day-to-day business of science = (보어) 과학이 하는 일상적인 일.","lesson":27,"parts":[["",null],["Determining","A"],[" how closely theories ",null],["approximately","B"],[" the truth is the ",null],["day-to-day","C"],[" business of ",null],["science","D"],[".",null]]},{"n":799,"type":"blank","stem":"-------------------------, a musician must thoroughly understand the conventions of a given musical style.","choices":["To improvise effectively","Improvised effectively","Improvising effectively","When improvising effectively"],"note":false,"a":0,"fix":"","exp":"해석 : 효과적으로 즉흥연주를 하기 위해서, 음악가는 어떤 특정한 음악스타일의 종래의 관습들을 철저하게 이해해야만 한다.\n해설 :\n* To improvise effectively = (부정사의 부사적 용법) 효과적으로 즉흥연주를 하기 위해서.\n* improvise = (동) 즉흥 연주를 하다.\n* effectively = (부사) 효과적으로.\n* a musician = (주어) 음악가.\n* must understand = (동사) 이해해야만 한다.\n* thoroughly = (부사) 철저하게.\n* the conventions of a given musical style = (목적어) 어떤 특정한 음악스타일의 종래의 관습들. (어떤 특정한 음악스타일이 그 동안 어떤 식으로 연주되어왔는가를 파악해야한다.","lesson":27},{"n":800,"type":"error","note":false,"a":3,"fix":"with","exp":"해석 : 주라기 동안에 식물이 풍부했고, 그래서 특히 초식동물들에게 충분한 음식을 공급했다.\n해설 :\n* During the Jurassic period = (부사구) 주라기 동안에.\n* plant life was abundant = = (주절) 식물이 풍부했다.\n* abundant = (형) 풍부한.\n* providing herbivores (in particular) with a plentiful supply of food = (분사구) 그래서 특히 초식동물들에게 충분한 음식을 공급했다.\n* 여기서 providing 이하는 which provided ------ (관계 대명사절)의 변형으로 볼 수도 있다.\n* provide A with B = A에게 B를 제공하다.\n* herbivores = 초식동물.\n* in particular = (부사구) 특히.","lesson":27,"parts":[["During the Jurassic period ",null],["plant life","A"],[" was abundant, ",null],["providing","B"],[" herbivores ",null],["in","C"],[" particular ",null],["of","D"],[" a plentiful supply of food.",null]]},{"n":801,"type":"error","note":true,"a":0,"fix":"raised","exp":"해석 : 어떤 단풍나무들은 그들의 즙 때문에 재배되는데, 그 즙은 높은 당의 함량을 가지며 당과 시럽을 생산한다.\n해설 :\n* Some maple trees = (주어) 어떤 단풍나무들\n* are raised = (동사/수동태) 재배된다.\n* for their sap = (부사구) 그들의 즙 때문에, 즙을 얻기 위해서.\n* which has a high sugar content and yields sugar and syrup = (앞의 명사 their sap을 수식하는 관계대명사절) 그 즙은 높은 당의 함량을 가지며 당과 시럽을 생산한다.\n* yield = 동사로서 사용될 때 \u003c산출하다, 생산하다> 의 의미를 가질 수 있음.\n참고 :\n* sugar = 일상 영어에서는 모든 종류의 당분을 총칭하는 말로서도 사용된다.","lesson":27,"parts":[["Some maple trees are ",null],["rised","A"],[" ",null],["for","B"],[" their sap, which has a high sugar ",null],["content","C"],[" and ",null],["yields","D"],[" sugar and syrup.",null]]},{"n":802,"type":"blank","stem":"-------------------------------------, they were valuable to people for many essential tasks, including transportation and fishing.","choices":["Long before became important boats in recreation","Before long boats became important in recreation","Long before boats became important in recreation","Before long boats in recreation became important"],"note":false,"a":2,"fix":"","exp":"해석 : 배가 레크레이션에 있어서 중요하게 되기 훨씬 전에, 그들(배들)은 운송이나 낚시를 포함해서 많은 필수적인 일을 위해서 사람들에게 귀중한 것이었다.\n해설 :\n* Long before boats became important in recreation = (부사절) 배가 레크레이션에 있어서 중요하게 되기 훨씬 전에.\n* 컴마 이하는 주절.\n* they were valuable to people = 그들(배들)은 사람들에게 귀중한 것이었다.\n* for many essential tasks, including transportation and fishing = (부사구) 운송이나 낚시를 포함해서 많은 필수적인 일을 위해서.\n참고 : long before 는 접속사또는 전치사로서 부사절이나 부사구를 이끈다.","lesson":27},{"n":803,"type":"error","note":false,"a":2,"fix":"or","exp":"해석 : 늪지는, 그 안에서 물 표면이 땅의 표면의 높이에 있거나 땅의 표면보다 높은, 한 형태의 습지이다.\n해설 :\n* Swamps = (주어) 늪지.\n* are = (동사)\n* a type of wetland = (보어) 한 형태의 습지.\n* in which the water table is at or above the surface of the land = (관계대명사절로서 앞의 명사 a type of wetland를 수식함) 그 안에서 물 표면이 땅의 표면의 높이에 있거나 땅의 표면보다 높은.\n* water table = 물의 한 덩어리(호수나 습지 등)에서 잔잔한 물의 표면을 의미함.\n* at or above = 그 높이이거나 그 높이보다 위에 있음을 의미함.","lesson":27,"parts":[["Portland, Maine, is ",null],["where","A"],[" the ",null],["poet","B"],[" Henry Wadsworth Longfellow ",null],["spent","C"],[" ",null],["the","D"],[" early years.",null]]},{"n":804,"type":"blank","stem":"The major error ---------------------- is jumping to a conclusion about the cause of a given problem.","choices":["what managers commit in solving problem","that managers commit in problem solving","managers commit in solving problem","that commit managers in problem solving"],"note":false,"a":1,"fix":"","exp":"해석 : 문제해결에 있어서 매니저들이 범하는 중요한 잘못은, 어떤 주어진(특정한) 문제의 원인에 관한 결론에 성급하게 뛰어드는 것이다.\n해설 :\n* The major error (that managers commit in problem solving) = (주어) 문제해결에 있어서 매니저들이 범하는 중요한 잘못. (괄호부분은 앞의 명사를 수식하는 관계대명사절)\n* commit = (동사) 범하다, 행하다.\n* 여기서 problem solving 은 동명사나 현재분사가 아니고 명사(문제해결)로 보는 것이 타당하다.\n* is = (동사)\n* jumping to a conclusion about the cause of a given problem = (동명사로서 보어) 어떤 주어진(특정한) 문제의 원인에 관한 결론에 성급하게 뛰어드는 것.\n* given = (형용사) 주어진, 특정한.","lesson":27},{"n":805,"type":"error","note":false,"a":1,"fix":"most","exp":"해석 : 귀금속, 보석, 상아가 단추를 만드는데 사용되어왔다, 그러나 대부분의 단추는 나무, 유리, 플라스틱 등과 같은 그런 재료들로 만들어진다.\n해설 :\n* Precious metals, gems, and ivory = (주어) 귀금속, 보석, 상아.\n* have been used = (동사/수동태) 사용되어왔다.\n* to make buttons = (부사구) 단추를 만드는데, 단추를 만들기 위해서.\n* but 이하는 또 하나의 절.\n* 등위접속사(and, or , but 등등)로 연결되는 두 개의 절은 둘 다 주절로 본다. (둘 다 겢?이라고         표현하는 학자도 있음)\n* most buttons = (주어) 대부분의 단추.\n* \u003c대부분의 --> 는 the를 사용하지 않는다.\n* are made = (동사/수동태) 만들어진다.\n* of such materials as wood, glass, or plastic = (부사구) 나무, 유리, 플라스틱 등과 같은 그런               재료들로(부터).","lesson":27,"parts":[["Precious metals, gems, and ivory have ",null],["been used","A"],[" to make buttons, but ",null],["the most","B"],[" buttons are made ",null],["of","C"],[" such materials as wood, glass, or ",null],["plastic","D"],[".",null]]},{"n":806,"type":"error","note":true,"a":3,"fix":"appeared","exp":"해석 : 지금 미국의 남서부인 그 지역을 점령했었던 첫 번째 미국 원주민은 the Big-Game Hunters 라는 부족들이었는데, 그들은 기원전 10,000 년경에 출현했다.\n해설 :\n* The first Native Americans to occupy what is now the southwestern United States = (주어) 지금 미국의 남서부인 그 지역을 점령했었던 첫 번째 미국 원주민.\n* 현대 미국식 영어에서 \u003cV했던 첫 번째 --> 의 표현은 \u003cthe first --- to V> 로 한다.\n* what is now the southwestern United States = the area which is now the southwestern United States에서 선행사(the area) 와 관계대명사(which)를 합쳐서 what 으로 바꾼것\n* were = (동사)\n* the Big-Game Hunters = (보어) 큰 사냥감을 사냥했던 부족들을 의미함.\n* who appeared about 10,000 B.C. = (선행사 the Big-Game Hunters 를 구체적으로 설명하는 관계대명사절) 그들은 기원전 10,000 년경에 출현했다.\n참고 :\n* game = 사냥감(집합명사).","lesson":27,"parts":[["The first Native Americans ",null],["to occupy","A"],[" what is ",null],["now the","B"],[" southwestern United States were ",null],["the","C"],[" Big-Game Hunters, who ",null],["were appeared","D"],[" about 10,000 B.C.",null]]},{"n":807,"type":"error","note":false,"a":1,"fix":"so","exp":"해석 : 큰 비행기들을 수용하는데 사용되는 빌딩인, 어떤 격납고들은 아주 높아서 때때로 그 천장을 따라 형성되는 구름으로부터 비가 내린다.\n해설 :\n* Some hangars, buildings used to hold large aircraft, = (\u003c주어+동격의 명사>가 컴마로 연결되어있음.) 큰 비행기들을 수용하는데 사용되는 빌딩인, 어떤 격납고들.\n* hangar = 격납고\n* aircraft = 항공기(단,복수 동형)\n* are = (동사)\n* so tall = (보어) : so--that-- 의 용법(원인과 결과).\n* that rain occasionally falls from clouds (that form along the ceilings) = (원인과 결과의 부사절) 그래서 때때로 그 천장을 따라 형성되는 구름으로부터 비가 내린다.\n* 밑줄친 부분은 clouds를 수식하는 관계대명사절. (그 천장을 따라 형성되는)","lesson":27,"parts":[["Some hangars, ",null],["buildings","A"],[" used to hold large aircraft, are ",null],["very","B"],[" tall that rain occasionally ",null],["falls","C"],[" from clouds that ",null],["form","D"],[" along the ceilings.",null]]},{"n":808,"type":"blank","stem":"Most sand dunes are always in motion as wind pushes sand up one side of each dune, over the top, ----------------------------.","choices":["and downward to the other side.","and down the other side.","downward the other side.","but down the other side."],"note":false,"a":1,"fix":"","exp":"해석 : (as 이하의 부사절부터 해석했음) 바람이 모래를 각 언덕의 한쪽 면을 따라 위쪽으로, 그리고 꼭대기를 넘어서, 그리고 반대쪽 면을 따라 아래쪽으로 밀어감으로, 대부분의 모래언덕은 항상 움직인다.\n해설 :\n* Most sand dunes are always in motion = (주절) 대부분의 모래언덕은 항상 움직인다.\n* in motion = (형용사구) 움직이는.\n* as 이하는 부사절로서 \u003c--함으로, --함에 따라서> 와 같이 해석함.\n* wind = (주어) 바람.\n* pushes = (동사) 민다.\n* sand = (목적어) 모래.\n* up one side of each dune = (첫번째 부사구) 한쪽 면을 따라 위쪽으로.\n* over the top =  (두번째 부사구) 꼭대기를 넘어서.\n* and down the other side (세번째 부사구) 그리고 반대쪽 면을 따라 아래쪽으로.\n참고 :\n* \u003c --를 따라 위로, 아래로> 등의 표현에서는 \u003cup 이나 down> + 전치사 없이 명사를 사용한다.","lesson":27},{"n":809,"type":"error","note":false,"a":2,"fix":"that","exp":"해석 : 옥수수, 콩, 담배 등을 재배하는 농부들, 즉, 오늘날의 미시간에 거주했던 원주민 부족들인 Wendat 족은, 인구가 밀집한 마을에서 평온한 인생을 살았다.\n해설 : 이 문장은 주어에 명사 3 개를 동격으로 사용한 경우. (이런 경우는 고유명사를 문장의 주어로 간주한다)\n* Farmers of maize, beans, and tobacco = (제 1명사) 옥수수, 콩, 담배 등을 재배하는 농부들.\n* the Wendat,  = (제 2명사) 원주민 부족이름.\n* Native American tribes that inhabited present-day Michigan = (제 3명사) 오늘날의 미시간에 거주했던 원주민 부족들.\n* lived = (동사) 살았다.\n* a sedentary life = (목적어) 평온한 인생.\n* in densely populated villages = (부사구) 인구가 밀집한 마을에서.\n참고 :\n* 선행사가 사람이므로 관계대명사 which 는 사용할 수 없고 that 이나 who를 사용할 수 있다.\n* densely populated villages 와 같이 \u003c부사+형용사(분사)+명사>의 순서로 나열될 때는, 부사와 형용사(분사) 사이에 densely-populated villages 와 같이 하이픈(-)을 사용해도 되고 문제에서와 같이 사용하지 않아도 된다. 그러나, 그러한 순서로 나열되지 않는 명사 앞에 오는 수식어들은 의미상 한 덩어리로 간주되는 말들을 하이픈으로 연결하여야 한다. (예) Carnivores are meat-eating animals. → 여기서 meat=명사 , eating=분사이므로 meat 과 eating 사이를 하이픈(-)으로 연결함.","lesson":27,"parts":[["",null],["Farmers","A"],[" of maize, ",null],["beans","B"],[", and tobacco, the Wendat, Native American tribes ",null],["which","C"],[" inhabited present-day Michigan, lived a sedentary life in ",null],["densely","D"],[" populated villages.",null]]},{"n":810,"type":"blank","stem":"Any critic, teacher, librarian, or poet ---------------------------------- the difficult challenge of persuading skeptical readers that poetry is important today.","choices":["who hopes to broaden poetry's audience faces","who hopes broaden poetry's audience and faces","who hopes broad poetry's audience faces","whose hopes broaden poetry's audience faces"],"note":false,"a":0,"fix":"","exp":"해석 : 시의 독자를 확장하기 희망하는 어떤 비평가나 선생이나 도서관원이나 시인이든지, 회의적인 독자들에게 시는 오늘날 중요하다는 것을 설득시켜야하는 어려운 도전에 직면한다.\n해설 :\n* Any critic, teacher, librarian, or poet (who hopes to broaden poetry's audience) = (주어) 시의 독자를 확장하기 희망하는 어떤 비평가나 선생이나 도서관원이나 시인이든지. (괄호부분은 앞의 사람들을 수식하는 관계대명사절)\n* any 는 긍정문에서 대개 단수명사를 취한다. (어떤 --이든지)\n* faces = (동사) 직면한다.\n* the difficult challenge of V-ing = --해야하는 어려운 도전.\n* persuading skeptical readers that poetry is important today = (4형식으로서 \u003c누구에게 --를 설득하다>와 같이 해석되며, skeptical readers = 간접목적어(--에게) / 밑줄부분은 명사절로서 직접목적어 = 시는 오늘날 중요하다는 것, (그런 사실).\n* persuade + 사람 + that 의 명사절 = \u003c누구에게 --를 설득하다>.\n* skeptical = (형) 회의적인, --에 관해 부정적으로 생각하는.","lesson":27},{"n":811,"type":"error","note":true,"a":2,"fix":"decision-making","exp":"해석 : Robert's Rules of Order 라는 책에 의해서 제시된 연설과 투표를 위한 지침을 따르면서, 큰 의사결정 기관들은 회의동안에 절차상의 혼란을 피한다.\n해설 :\n* Following the guidelines for speaking and voting established by the book Robert's Rules of Order = (분사구/ V-ing 로 시작하는 분사구는 대개 \u003c--하면서>와 같이 해석함.) Robert's Rules of Order 라는 책에 의해서 제시된 연설과 투표를 위한 지침을 따르면서 (established 의 앞에 which are 가 생략된 것으로 볼 수 있다.)\n* the guidelines for speaking and voting = 연설과 투표를 위한 지침.\n* large decision-making organizations = (주어) 큰 의사결정 기관들.\n* avoid = (동사) 피한다.\n* procedural confusion = (목적어) 절차상의 혼란.\n* during meetings = (부사구) 회의동안에.","lesson":28,"parts":[["",null],["Following","A"],[" the guidelines for speaking and voting ",null],["established","B"],[" by the book Robert's Rules of Order, large ",null],["making-decision","C"],[" organizations avoid ",null],["procedural","D"],[" confusion during meetings.",null]]},{"n":812,"type":"error","note":false,"a":3,"fix":"뺀다","exp":"해석 : 소혹성은 오래 전에 부서진 한 행성의 조각들이거나 오래된 혜성의 핵으로부터 나온 물질일수 있다.\n해설 :\n* Asteroids = (주어) 소혹성\n* may be = (동사) --일수 있다.\n* fragments of a planet shattered long ago = (보어) 오래 전에 부서진 한 행성의 조각들.\n* material from the nuclei of an old comets = (보어) 오래된 혜성의 핵으로부터 나온 물질.","lesson":28,"parts":[["Asteroids may be fragments of a planet ",null],["shattered","A"],[" long ",null],["ago","B"],[" or ",null],["material","C"],[" from the nuclei of ",null],["an","D"],[" old comets.",null]]},{"n":813,"type":"error","note":false,"a":1,"fix":"kept (또는 they are kept)","exp":"해석 : 횃대와 바닥에 깨끗한 모래가 있는 새장에서 길러지면, 가정용 카나리아는 포획된 상태에서도 잘 산다.\n해설 :\n* Domestic canaries do well in captivity = (주절) 가정용 카나리아는 포획된 상태에서도 잘 산다.\n* in captivity = (부사구) 포획된 상태에서\n* if (they are) kept in cages with perches and with clean sand on the bottom = (부사절/they are를 생략할 수 있다.) 횃대와 바닥에 깨끗한 모래가 있는 새장에서 길러지면.\n* perches = 횃대.","lesson":28,"parts":[["Domestic canaries ",null],["do well","A"],[" in captivity if ",null],["they keep","B"],[" in cages with perches and with ",null],["clean","C"],[" sand ",null],["on","D"],[" the bottom.",null]]},{"n":814,"type":"blank","stem":"Quasars, -------------------------------, are perhaps the most distant objects known.","choices":["the faint celestial objects resemble stars","faint celestial objects resembling stars","faint celestial objects and resembling stars","the faint celestial resembling stars objects"],"note":false,"a":1,"fix":"","exp":"해석 : 별과 닮은 희미한 천체인 준성은 아마도 알려진(것 중에서) 가장 먼 물체일 것이다.\n해설 :\n* Quasars, faint celestial objects resembling stars, = (주어+동격의 명사) 별과 닮은 희미한 천체인 준성.\n* resembling = (which resemble 의 변화형으로 볼 수 있다.) --와 닮은.\n* are = (동사)\n* perhaps = (부사) 아마도.\n* the most distant objects (which are) known = (보어) 아마도 알려진(것 중에서) 가장 먼 물체.","lesson":28},{"n":815,"type":"blank","stem":"Sleep is controlled by the brain and ------------------------------.","choices":["which associated with characteristic breathing rhythms","associated with characteristic breathing rhythms","while associated with characteristic breathing rhythms","association characteristic breathing rhythms"],"note":false,"a":1,"fix":"","exp":"해석 : 잠은 두뇌에 의해서 통제되며, 특징적인 호흡리듬과 관련이 있다.\n해설 :\n* 이 문장은 다음과 같이 괄호부분을 생략한 것으로 볼 수 있다.\n  Sleep is controlled by the brain and (it is) associated with characteristic breathing rhythms.\n* be controlled by = ～에 의해서 통제된다.\n* be associated with = ～에 관련이 있다.\n* characteristic breathing rhythms = 특징적인 호흡리듬.","lesson":28},{"n":816,"type":"blank","stem":"A musical genius, John Cage is noted for his highly unconventional ideas, and ------------------------------.","choices":["respected for his unusual compositions and performances.","who is respected for his unusual compositions and performances.","respectful for his unusual compositions and performances.","respectfully his unusual compositions and performances."],"note":true,"a":0,"fix":"","exp":"해석 : 음악의 천재인 John Cage는 그의 대단히 새로운 아이디어 때문에(아이디어로 인해서) 주목받으며, 그의 특이한 작곡과 연주 때문에(로 인해서) 존경받는다.\n해설 :\n* A musical genius, John Cage = (동격의 명사+주어) 음악의 천재인 John Cage.\n* be noted for ～ = ～때문에(～로 인해서) 주목받다.\n* his highly unconventional ideas = 그의 대단히 새로운 아이디어.\n* unconventional = 종래의 스타일에서 벗어난, 새로운.\n* respected for his unusual compositions and performances = (앞의 be 동사에 같이 연결해서 또 하나의 수동태) 그의 특이한 작곡과 연주 때문에(로 인해서) 존경받는다.\n* be respected for ～ = ～때문에(～로 인해서) 존경받다.","lesson":28},{"n":817,"type":"error","note":false,"a":2,"fix":"ground","exp":"해석 : 초코렛은 코코아 원두의 청소, 혼합, 그리고 굽기의 복합적인 과정에 의해서 만들어지는데, 그것(코코아 원두)는 갈아지고 설탕과 함께 섞여져야한다.\n해설 :\n* Chocolate is prepared by a complex process of cleaning, blending, and roasting cocoa beans = (주절)\n* which must be ground and mixed with sugar = (앞의 명사 cocoa beans를 구체적으로 보충 설명하는 관계대명사절)\n* Chocolate is prepared = 초코렛은 만들어진다.\n* by a complex process of cleaning, blending, and roasting cocoa beans = 코코아 원두의 청소, 혼합, 그리고 굽기의 복합적인 과정에 의해서. (여기서 cleaning, blending, and roasting 은 cocoa beans를 공통 목적어로 가지는 동명사 3 개)\n* grind (갈다) 의 과거분사는 ground.","lesson":28,"parts":[["Chocolate is prepared ",null],["by","A"],[" a complex process of cleaning, blending, and roasting cocoa beans, ",null],["which","B"],[" must be ",null],["grinded","C"],[" and ",null],["mixed","D"],[" with sugar.",null]]},{"n":818,"type":"error","note":false,"a":3,"fix":"touch","exp":"해석 : 인간 신체에 있는 수백만 개의 점들이 추위, 더위, 고통, 또는 접촉을 감지한다.\n해설 :\n* Several million points on the human body = (주어) 인간 신체에 있는 수백만 개의 점들.\n* register = (동사) 감지한다.\n* either cold, heat, pain, or touch = (목적어/4개의 명사) 추위, 더위, 고통, 또는 접촉.\n참고 :\n* either 는 두 가지의 선택에서만 사용되는 것이 아니고 (either A, B, or C) 와 같이 3 가지 이상 요소 들 중의 선택에서 (A 또는 B 또는 C)의 의미로서 사용할 수 있다.","lesson":28,"parts":[["Several ",null],["million","A"],[" points on ",null],["the","B"],[" human body register ",null],["either","C"],[" cold, heat, pain, or ",null],["touching","D"],[".",null]]},{"n":819,"type":"error","note":false,"a":3,"fix":"took","exp":"해석 : 1800년대에 가게 주인들은 바늘에서 쟁기까지 무엇이든지 팔았고, 모든 사람을 믿었고, 결코 재고조사를 하지 않았다.\n해설 :\n* 이 문장은 주어 하나에 동사를 3 개 사용한 것.\n* In the 1800's = (부사구) 1800년대에.\n* store owners = (주어) 가게 주인들.\n* sold everything from a needle to a plow = (제 1 동사+...) 바늘에서 쟁기까지 무엇이든지 팔았다.\n* trusted everyone = (제 2 동사+...) 모든 사람을 믿었다.\n* never took inventory = (제 3 동사+...) 결코 재고조사를 하지 않았다.\n* take inventory = 재고조사를 하다, 재고 파악을 하다.","lesson":28,"parts":[["In ",null],["the","A"],[" 1800's store owners sold ",null],["everything","B"],[" from a needle to a plow, ",null],["trusted","C"],[" everyone, and never ",null],["taking","D"],[" inventory.",null]]},{"n":820,"type":"error","note":false,"a":2,"fix":"more","exp":"해석 : 그들은 강한 사회적 의식을 반영하지만, Arthur Miller's 무대 작품들은 전형적으로 시스템보다는 사람들에게 더 관련이 있다.\n해설 :\n* Although they reflect a strong social conscience = (부사절) 그들(Arthur Miller's 무대 작품들)은 강한 사회적 의식을 반영하지만.\n* they = (주어) Arthur Miller's 무대 작품들\n* reflect = (동사) 반영하다.\n* a strong social conscience = (목적어) 강한 사회적 의식.\n* Arthur Miller's stage works are typically more concerned with individuals than with systems = (주절) Arthur Miller's 무대 작품들은 전형적으로 시스템보다는 사람들에게 더 관련이 있다.\n* be concerned with ～ = ～에 관련있다, ～에 대해 관심이 있다. ～에 대해 신경쓴다.\n* typically = 전형적으로","lesson":28,"parts":[["Although they reflect ",null],["a strong","A"],[" social conscience, Arthur Miller's stage works are ",null],["typically","B"],[" ",null],["much","C"],[" concerned with individuals than ",null],["with","D"],[" systems.",null]]},{"n":821,"type":"blank","stem":"--------------------------------, the four-leaf clover is rarely found in nature.","choices":["While highly prized for symbolizing good luck","While symbolizing good luck for prized highly","highly prizing for symbolizing good lse,"a":2,"fix":"nonexistent","exp":"해석 : 신기루는 하나의 대기상의 광학적인 착각인데 그 안에서는 관찰자가 하나의 존재하지 않는 물의 덩어리 또는 어떤 물체의 이미지(상)을 본다.\n해설 :\n* A mirage is an atmospheric optical illusion = (주절/ 주어+ 동사+보어)\n* mirage = 신기루.\n* an atmospheric optical illusion = 하나의 대기상의 광학적인 착각.\n* in which an observer sees a nonexistent body of water or an image of some object = (앞의 명사 an atmospheric optical illusion 을 수식하는 관계대명사절)\n* in which = 그 안에서.(신기루 안에서.)\n* an observer = (주어) 관찰자.\n* sees = (동사)\n* a nonexistent body of water or an image of some object = (목적어) 하나의 존재하지 않는 물의 덩어리 또는 어떤 물체의 이미지(상).","lesson":28,"parts":[["A mirage is an atmospheric optical ",null],["illusion","A"],[" in ",null],["which","B"],[" an observer sees a ",null],["nonexistence","C"],[" body of water or an image of some ",null],["object","D"],[".",null]]},{"n":825,"type":"error","note":false,"a":1,"fix":"varying","exp":"해석 : 미세한 결정체에서 발견되는 터코이스는 왁스와 같은 광택을 가지며 불투명하다, 그리고 색에 있어서 녹회색으로부터 하늘색에 이르기까지 다양하다.\n해설 :\n* Turquoise = (주어) 터코이스(미국 원주민들이 흔히 보석으로 사용했던 광물의 일종).\n* , which is found in microscopic crystals, = (앞의 명사 Turquoise 를 수식하는 관계대명사절)  미세한 결정체에서 발견되는.\n* is = (동사)\n* opaque = (보어) 불투명한.\n* with a waxy luster = (부사구) 왁스와 같은 광택을 가지며.\n* varying in color from greenish gray to sky blue = (분사구로서 varying 은 and it varies 의 변형으로 볼 수 있다.)\n참고 :\n* vary from A to B = A에서 B에 이르기까지 다양하다.","lesson":28,"parts":[["Turquoise, found in microscopic crystals, is opaque ",null],["with","A"],[" a waxy luster, ",null],["varies","B"],[" ",null],["in","C"],[" color from ",null],["greenish","D"],[" gray to sky blue.",null]]},{"n":826,"type":"blank","stem":"Homo erectus is the name commonly given to the primate species ---------------------------------------------.","choices":["which humans are believed to have evolved from","from which humans are believed to have been evolved","who humans are believed to have evolved","from them humans are believed to have evolved"],"note":true,"a":0,"fix":"","exp":"해석 : 호모엘렉투스는, 그것으로부터 인간이 진화되었다고 믿어지는 그 rior to all other woods for shipbuilding, teak is also used for furniture, flooring, and general construction. 가 된다.\n* be superior to ～= ～보다 우수하다.\n* flooring = \u003c바닥>이 아니고 \u003c바닥재>를 의미함.","lesson":29,"parts":[["Superior to ",null],["other all","A"],[" woods for ",null],["shipbuilding","B"],[", teak is also used for furniture, ",null],["flooring","C"],[", and ",null],["general","D"],[" construction.",null]]},{"n":849,"type":"blank","stem":"Weather is the transitory expression of climate ----------------------.","choices":["and that can change greatly from day to day or season to season","that can change greatly from day to day or season to season","that can be change greatly from day to day or season to season","and can change great from day to day or season to season"],"note":false,"a":1,"fix":"","exp":"해석 : 날씨(weather)는, 날에 따라서 그리고 계절에 따라서 대단히 변화할 수 있는, climate(기후)의 단기적인 표현이다.\n해설 :\n* Weather is the transitory expression of climate = (주절) 날씨(weather)는 climate(기후)의 단기적인 표현이다.\n* transitory = 단기적인, 일시적인, 헛된.\n* that can change = (관계 대명사+ 동사)\n* greatly = (부사) 대단히.\n* from day to day = (부사구) 날에 따라서, 각 날마다\n* season to season = (부사구) 계절에 따라서, 각 계절마다\n참고 :\n* 날씨가 변화하는 것은 인위적이 행위가 아니고 자연현상이므로 여기서는 change 가 자동사이다.","lesson":29},{"n":850,"type":"error","note":false,"a":1,"fix":"extremely","exp":"해석 : 고고학적인 조사들은, that 이하의 사실을 나타낸다. that 이하는 명사절로서 문장의 목적어이고 그 that 이 이끄는 명사절 안에 다시 주절과 부사절이 있음.\n* that 이하의 사실 = 불의 통제는 극히 오래된 기술적인 성취이다. 비록 그것이 기원한 시간, 장소, 양상(방식) 등은 결코 알 수 없지만.\n* Archaeological investigations indicate = (주절의 주어+ 동사) 고고학적인 조사들은 나타낸다.\n* that 절 안에서\n* control of fire is an extremely old technical attainment = (주절)\n* though the time, place, and mode of its origin may never be learned = (부사절)","lesson":29,"parts":[["Archaeological investigations indicate that ",null],["control of","A"],[" fire is an ",null],["extreme","B"],[" old technical attainment, ",null],["though","C"],[" the time, place, and ",null],["mode of","D"],[" its origin may never be learned. ol = (부사구)","lesson":29},{"n":854,"type":"blank","stem":"In the United States, the federal government is responsible --------------------------------.","choices":["for regulation the working conditions in factories","for regulating the working conditions in factories","to regulating the working conditions in factories","in the regulation the working conditions in factories"],"note":false,"a":1,"fix":"","exp":"해석 : 미국에서 연방정부는 공장에서의 노동조건을 규정하는데 책임이 있다.\n해설 :\n* In the United States = (부사구)\n* the federal government = (주어) 연방정부.\n* is = (동사)\n* responsible = (보어) 책임 있는.\n* for regulating the working conditions in factories = (부사구) 공장에서의 노동조건을 규정하는데.\n* be responsible for ～ = ～에 대해서 책임이 있다.","lesson":29},{"n":855,"type":"error","note":false,"a":0,"fix":"are","exp":"해석 : Hovercraft, 다른 말로 공기 부상 차량은, 그들이 공기의 층을 딛고서 육지나 물위로 여행한다는 점에 있어서, 특이하다.\n해설 :\n* Hovercraft, or air-cushion vehicles, = (주어+ 동격의 명사) Hovercraft(하버크레프트), 즉 다른 말로 공기 부상 차량.\n* are = (동사)\n* unusual = (보어) 특이한.\n* in that = (부사절 접속사) ～라는 점에 있어서.\n* they = (주어) 그들 (Hovercraft 를 의미함)\n* travel = (동사)\n* over land and water = (부사구) 육지나 물위로.\n* on a layer of air = (부사구) 공기의 층을 딛고서.\n참고 :\n* 동격의 or → 어떤 명사를 다른 말로 칭하는 단어가 있을 때 \u003c A, or B, >와 같이 표현할 수 있는데 이때 \u003c A 또는 B > 가 아니고 \u003c A 즉, 다른 말로 B > 라는 의미이다.\n* craft 가 붙는 단어는 단,복수 동형.","lesson":29,"parts":[["Hovercraft, or air-cushion vehicles, ",null],["is","A"],[" ",null],["unusual","B"],[" in ",null],["that","C"],[" they travel ",null],["over","D"],[" land and water on a layer of air.",null]]},{"n":856,"type":"error","note":true,"a":3,"fix":"hearing","exp":"해석 : 올빼미와는 달리 박쥐는 잘 볼 수가 없다, 그러나 그들은 매우 좋은 청각을 가진다.\n해설 :\n* Unlike the owl = (부사구) 올빼미와는 달리.\n* bats cannot see very well = 박쥐는 잘 볼 수가 없다.\n* but they do have very good hearing = 그러나 그들은 매우 좋은 청각을 가진다.\n* 여기서 애 는 강조용법. (동사 have 를 강조함)\n* hearing 이 \u003c청각>의 의미일 때는 셀 수 없는 명사이고, \u003c청문회>의 의미이면 셀 수 있는 명사.","lesson":29,"parts":[["",null],["Unlike","A"],[" the owl, bats cannot see ",null],["very","B"],[" well, but they ",null],["do","C"],[" have very good ",null],["a hearing","D"],[".",null]]},{"n":857,"type":"error","note":false,"a":3,"fix":"by","exp":"해석 : 1846년에 재봉틀이 발명된 직후에, 기계와 수공으로 바느질하는 고도로 숙련된 재봉사들 사이에 경쟁이 있었다.\n해설 :\n* 컴마(,)를 중심으로 그 앞은 부사절이고 그 뒤는 주절.\n* Soon after the sewing machine was invented in 1846 = (부사절)\n* there was competition between A and B = A 와 B 사이에 경쟁이 있었다.\n* 여기서 A = machines 기계  / B = highly skilled dressmakers sewing by hand 수공으로 바느질하는 고도로 숙련된 재봉사들.","lesson":29,"parts":[["",null],["Soon","A"],[" after the sewing machine was invented in 1846, ",null],["there","B"],[" was ",null],["competition","C"],[" between machines and highly skilled dressmakers sewing ",null],["with","D"],[" hand.",null]]},{"n":858,"type":"blank","stem":"Willa Cather considered her novel of life in nineteenth-century Nebraska, My Antonia, ------------------.","choices":["which was her best work","was her best work","to be her best work","being her best work"],"note":false,"a":2,"fix":"","exp":"해석 : Willa Cather 는 19세기 네브라스카에서의 생활에 관한 그녀의 소설 My Antonia 를 자신의 최고 작품이라고 간주했다.\n해설 :\n* Willa Cather = (주어)\n* considered = (동사) 간주했다.\n* her novel of life in nineteenth-century Nebraska, My Antonia, = (목적어) 19세기 네브라스카에서의 생활에 관한 그녀의 소설 My Antonia.\n* to be her best work = (목적격보어) 자신의 최고 작품이라고.\n참고 :\nconsider 는 다음과 같이 3가지 스타일의 5형식을 사용하는데 이중에서 (1)의 스타일이 가장 흔히 사용되며, (3)의 스타일이 가장 적게 사용된다. (각각 밑줄친 부분이 목적격 보어)\n(1) Many people consider Tom Jones an excellent pop singer.\n(2) Many people consider Tom Jones to be an excellent pop singer.\n(3) Many people consider Tom Jones as an excellent pop singer.","lesson":29},{"n":859,"type":"blank","stem":"Until the 1840's, ---------------------- who had ventured to the western Unites States were trappers and a few explorers.","choices":["practical the only pioneers","the practically only pioneers","practically the only pioneers","the only pioneers practically"],"note":false,"a":2,"fix":"","exp":"해석 : 1840년대까지, 미국 서부로 위험을 무릅쓰고 갔던 사실상 유일한 개척자들은 It, was, that 의 세 단어를 모두 빼버려도 다음과 같이 문장이 성립한다.\n* Near the end of prehistoric times the first wheeled vehicles appeared.\n* Near the end of prehistoric times = (부사구) 거의 선사시대 말기\n* the first wheeled vehicles = (주어) 처음 바퀴 달린 차량.\n* appeared = (동사/자동사) 등장했다.\n* near = (목적어를 가질 수 있는 형용사, 또는 전치사로 취급함) ～의 근처, ～에 가까운.\n* prehistoric times = 선사시대.\n참고:\n* time은 \u003c시기, 시대>를 의미할 때는 셀 수 있는 명사이므로 앞에 관사를 사용하거나 복수형으로 쓴다. 이 문장에서는 선사시대를 여러 시기나 여러 장소에서의 복수적인 개념으로 표현했음.","lesson":33},{"n":991,"type":"error","note":true,"a":3,"fix":"prevent","exp":"해석 : Los Angeles를 둘러싸고 있는 그 산들은 Mojave(모하브)사막의 뜨겁고 건조한 바람으로부터 그 도시를 효과적으로 보호한다, 그러나 그들은 공기의 순환도 역시 막는다.\n해석 :\n이 문장은 not only --but also -- 의 모양이 아니고, 등위접속사(but)를 중심으로 두 개의 대등절을 사용했는데 앞부분은 긍정적인 효과이며 뒷부분은 부정정인 효과를 나타내므로 서로 상반되는 개념을 연결하는 but 을 사용했다.\n* 현재의 사실이므로 동사를 현재형으로 써야한다.\n* The mountains surrounding Los Angeles = (주어) Los Angeles를 둘러싼 그 산들.\n* effectively = (부사) 효과적으로.\n* shield the city from the hot, dry winds of the Mojave Desert = (동사+목적어+부사) Mojave 사막의 뜨겁고 건조한 바람으로부터 그 도시를 보호한다.\n* shield = 막다, 보호하다.\n* they also prevent the circulation of air = 그러나 그들은 공기의 순환도 역시 막는다.\n* surrounding = (형) 둘러싸는, 주변의.\n* shield A from B = B로부터 A를 보호하다.\n* they = the mountains surrounding Los Angeles를 받는 대명사.","lesson":34,"parts":[["The mountains ",null],["surrounding","A"],[" Los Angeles effectively shield the city from the ",null],["hot, dry","B"],[" winds of the Mojave Desert, ",null],["but","C"],[" they also ",null],["prevented","D"],[" the circulation of air.",null]]},{"n":992,"type":"blank","stem":"After a heavy rain, a rainbow may spread all the way across the sky, -------------------------.","choices":["its two ends seems to be rest on the Earth","seeming its two ends to rest on the Earth","its two ends seeming to rest on the Earth","its two seemed ends to rest on the Earth"],"note":false,"a":2,"fix":"","exp":"해석 : 심한 비가 온 후에 무지개가 하늘 전체에 걸쳐서 펼쳐질 수 있으며, 그것의 두 끝이 지구에 놓여있는 듯이 보인다.\n해설 :\n* Afterward a heavy rain = (부사구) 심한 비가 온 후에.\n* a rainbow may spread all the way across the sky = (주절) 무지개가 하늘 전체에 걸쳐서 펼쳐질 수 있다.\n* its two ends seeming to rest on the Earth = (분사구) 그것의 두 끝이 지구에 놓여있는 듯이 보인다.\n* while its two ends seem to rest on the Earth = 이 부사절을 분사구로 고치면 접속사(while) 이 빠지고 동사 seem 에 -ing 가 붙어서 문제의 모양이 된다.\n* rest on ～ = ～에 놓여있다.","lesson":34},{"n":993,"type":"blank","stem":"Martin Luther King Jr.'s magnificent speaking ability ------------ ---------------- the demands for social justice for Black Americans.","choices":["of enabling him to express effectively","to enable him to effectively express","enabled him to effectively express","to be enabling his effectively expressing"],"note":false,"a":2,"fix":"","exp":"해석 : Martin Luther King Jr. 의 훌륭한 말솜씨는 그로 하여금 미국흑인들을 위한 사회적 정의에 대한 요구들을 효과적으로 표현할 수 있도록 해주었다.\n해설 :\n* Martin Luther King Jr.'s magnificent speaking ability = (주어) Martin Luther King Jr. 의 훌륭한 말솜씨.\n* enabled = (동사)\n* enable + O + toV = O에게 V할 수 있게 해주다. (O가 V하는 것을 가능하게 하다.)\n* him = (목적어) 그에게, 그로하여금.\n* to effectively express the demands for social justice for Black Americans = (목적격보어) 미국흑인들을 위한 사회적 정의에 대한 요구들을 효과적으로 표현할 수 있도록.\n* magnificent = (형) 훌륭한.\n* effectively = (부사) 효과적으로.","lesson":34},{"n":994,"type":"blank","stem":"Designers of athletic footwear finely tune each category of shoe to its particular activity ----------------------------------.","choices":["human motion and physiology by studying","by studying human motion and physiology","with studying human motion and physiology","to study human motion and physiology"],"note":false,"a":1,"fix":"","exp":"해석 : 운동선수용 신발류를 디자인하는 사람들은 인간의 동작과 생리기능을 연구함으로써 각 종류의 신발을 그것의 특수한 활동에 알맞게 맞춘다.\n해설 :\n* Designers of athletic footwear = (주어) 운동선수용 신발류의 디자이너들.\n* finely = (부사) 알맞게, 좋게.\n* tune = (동사) / tune A to B = A를 B에 맞추다.\n* each category of shoe = (목적어) 각 종류의 신발.\n* to its particular activity = (부사구) 그것의 특수한 활동에.\n* by studying human motion and physiology = (부사구) 인간의 동작과 생리기능을 연구함으로써.","lesson":34},{"n":995,"type":"error","note":false,"a":1,"fi ng ever","and it has been growing ever since"],"note":false,"a":3,"fix":"","exp":"해석 : 산성비대기오염의 문제는 산업혁명과 함께 시작되었다고 일컬어질 수 있으며, 그 이후로 계속해서 증가하고 있다.\n해설 :\n* The problem of acid rain air pollution = (주어) 산성비대기오염의 문제.\n* may be said to have originated = (동사) 시작되었다고 일컬어질 수 있다.\n* be said to V = V한다고 일컬어진다.\n* have originated = 완료형으로 쓴 이유는 \u003c일컬어지는 것>이 현재형인데, \u003c시작한 것>은 그보다 앞선 시제를 나타내야하기 때문에.\n* with the Industrial Revolution = (부사구) 산업혁명과 함께.\n* and it has been growing ever since = (현재완료진행형) 그리고, 그 이후로 계속해서 증가하고 있다.\n* ever since = (부사) 그 이후로 계속해서.","lesson":34},{"n":998,"type":"error","note":false,"a":3,"fix":"absence","exp":"해석 : 네온 조명이 하나의 단점은 파란 광선의 부재로 그 빛이 너무 빨갛다는 것이다.\n해설 :\n* A disadvantage of neon lighting = (주어) 네온조명의 하나의 단점.\n* is = (동사)\n* that = (명사절접속사) 그 이하는 문장의 보어로 사용된 명사절.\n* the light produced is too red = (명사절 안에서 주절) 만들어진 빛이 너무 빨갛다.\n* produced = (과거분사로서 형용사역할) 생산되는, 만들어지는 (the light를 수식)\n* because there is an absence of blue rays = (명사절 안에서 부사절) 파란 광선이 없기 때문에.\n* an absence of ～ = ～의 부재, ～가 없다는 것. .","lesson":34,"parts":[["A disadvantage of neon ",null],["lighting","A"],[" is that the light ",null],["produced","B"],[" ",null],["is","C"],[" too red because there is an ",null],["absent","D"],[" of blue rays.",null]]},{"n":999,"type":"blank","stem":"In its molten state, the metal iron is a random collection of atoms, ---------------------------------------- due to thermal agitation.","choices":["all of which are constantly changing position","of which all are constantly changing position","which are constantly changing position all","constantly changing position all are of which"],"note":false,"a":0,"fix":"","exp":"해석 : 그것의 녹은 상태에서, 금속인 철은 원자들의 무작위적인 집합체이다, 그리고 그것들 모두는 열의 동요 때문에 끊임없이 위치를 바꾼다.\n* In its molten state = (부사구) 그것의 녹은 상태에서.\n* the metal iron = (주어) 금속인 철 (철이라는 금속).\n* is = (동사)\n* a random collection of atoms = (보어) 원자들의 무작위적인 집합체.\n* 컴마이하는 관계대명사절.\n* all of which are constantly changing position = 그것들 모두는 끊임없이 위치를 바꾼다.\n* due to th
