: 허블의 법칙은 \u003c 어떤 두 개의 은하계 사이의 거리가 더 클수록, 그들의 분리상대속도는 더 크다>고 진술하고 있다.\n해설 :\n* states =(동사) 설명하다, 진술하다, 말하다.\n* 이중비교급(Double Comparative)의 모양에 유의할 것.\n   → The 비교급 S+V ～, The 비교급 S+V ～. = ～할 수록, 더욱 ～하다\n* Hubble's law = 허블의 법칙\n* states =(동사) 설명하다, 진술하다, 말하다.\n* that 이하는 명사절로서 states 의 목적어\n* the greater the distance between any two galaxies (is), the greater their relative speed of\n  separation (is).\n→ 이 문장에서 밑줄친 부분은 각각 절의 주어이고, 각각 그 뒤에 동사 is 가 있는데, 첫 번째 절에서는\nis 를 생략하고 두 번째 절에서는 주어와 is 를 바꿔 썼음.\n참고 :\n* Double Comparative(이중 비교급)에서는 be 동사를 생략할 수도 있고 주어와 바꿔 쓸 수도 있다.","lesson":5,"parts":[["Hubble's law ",null],["states","A"],[" that the greater the distance between ",null],["any","B"],[" two galaxies, the greater ",null],["is","C"],[" ",null],["its","D"],[" relative speed of separation.",null]]},{"n":150,"type":"error","note":false,"a":1,"fix":"which","exp":"해석 : 성숙한 과일은 흔히, 그 과일이 너무 빨리 부패하지 않도록 많은 이산화탄소를 포함한 장소에 보관된다.\n해설 :\n* Ripe fruit is often stored in a place which contains much carbon dioxide so that the fruit will not decay too rapidly.\n* 관계대명사절 안에서 which 는 주어의 역할을 해야 하므로 전치사를 쓰지 않는다.\n* so that  이하는 목적을 나타내는 부사절로서 \u003c～하도록 > \u003c～하기 위해서> 등으로 해석한다.\n참고 :\n* 장소, 시간 등을 나타내는 말이 선행사일 경우에도 관계사는 그 뒤의 절에서 무슨 역할을 하는 지에 따라 \u003c관계대명사>가 될 것인지 또는 관계부사 (또는 전치사+관계대명사)가 될 것인지를 결정한다.\n\n* (예 1) The bookstore which I bought last week\n* (예 2) The bookstore where I bought this magazine last week\n* (예 3) The bookstore at which I bought this magazine last week\n\n* (예 1) -- 관계사절 안에서 \u003c내가 그 책방을 샀다> 이므로 which 는 목적어의 역할을 해야 하고, 관계부사 (또는 전치사+관계대명사) 가 될 수 없다.\n\n* (예 2)와 (예 3)은 같은 것임.-- 관계사절 안에서 \u003c 그 책방에서 잡지를 샀으므로>, \u003c그\n책방에서>가 부사의 역할을 해야 하고, 따라서 관계부사 (또는 전치사+관계대명사)를 사용한다.","lesson":5,"parts":[["",null],["Ripe","A"],[" fruit is often stored in a place ",null],["at which","B"],[" contains much carbon dioxide so that the fruit ",null],["will not","C"],[" decay ",null],["too rapidly","D"],[".",null]]},{"n":151,"type":"blank","stem":"Margaret Brent, -------------------, became one of the largest landholders in colonial Maryland.","choices":["because her skill in managing estates","her skill was in managing estates","because of her skill in managing estates","who was her skill in managing estates"],"note":true,"a":2,"fix":"","exp":"해석 : Margaret Brent 는 그녀의 부동산을 관리 운영하는 기술 때문에 식민지 시대의 Maryland 에서 가장 큰 토지소유자 중의 하나가 되었다.\n해설 :\nMargaret Brent, because of her skill in managing estates, became one of the largest landholders in colonial Maryland.\n* 밑줄친 부분은 주어와 동사의 사이에 삽입되어있는 부사구.\n* (A) 에서 because 는 전치사가 아니고 접속사이므로 부사절을 연결해야함. (따라서 답이 안된다)\n참고 :\n* colonial Maryland = 미국의 지명에 colonial 을 붙이는 것은 식민지 시대(1776년 7월 4일 이전)의 지명을 의미함.","lesson":6},{"n":152,"type":"blank","stem":"In 1852 Massachusetts passed a law requiring all children from four to eighteen years of age --------------.","choices":["attending school","attend school","to attend school","who attend school"],"note":false,"a":2,"fix":"","exp":"해석 : 1852년에 Massachusetts 주는 4세-18세의 모든 어린이들에게 학교에 다닐 것을 요구하는 법을 통과시켰다.\n해설 :\n* pass a law = 법을 통과시키다.\n* requiring = which required 의 변형으로 볼 수도 있음.\n* require + O + to V  = O에게 V하도록 요구하다. (이 문장에서는 to V = to attend school)\n* all children (who were) from four to eighteen years of age = 4세-18세의 모든 어린이들\n* of age =old\n* attend school = 학교에 다니다\n참고 :\n* 미국은 의무교육이 13년이다. (유치원kindergarten + 초,중,고)","lesson":6},{"n":153,"type":"error","note":false,"a":2,"fix":"founded","exp":"해석 : 미국시인학교는, 1930 년대에 설립되었는데, 일하는 시인들을 원조하기 위한 금융적인 도움을 제공한다.\n해설 :\n* The American Academy of Poets = 주어\n* , which was founded in the 1930's, = 관계대명사가 이끄는 형용사절 (선행사가 고유명사이면 반드시 양쪽에 컴마(,)를 사용한다.)\n* provides = 동사\n* financial assistance to support working poets = 목적어 (일하는 시인들을 원조하기 위한 금융적인 도움)\n참고 :\n* find (발견하다)의 과거분사는 found 이고 / found (설립하다)의 과거분사는 founded.","lesson":6,"parts":[["The American Academy of Poets, which was ",null],["found","A"],[" in the 1930's, ",null],["provides","B"],[" financial ",null],["assistance","C"],[" to support ",null],["working","D"],[" poets.",null]]},{"n":154,"type":"error","note":false,"a":0,"fix":"the most","exp":"해석 : 미국에서 가장 인상적인 19세기 유럽 그림의 소장품들 중의 하나가 필라델피아 미술관에서\n발견될 수 있다.\n해설 :\n* One of the most impressive collections of nineteenth-century European paintings in the United States = 주어 (미국에서 가장 인상적인 19세기 유럽 그림의 소장품들 중의 하나)\n* can be found = 동사\n* in the Philadelphia Museum of Art = 부사구\n참고 :\n* collection = 한 박물관(미술관)에 소장되어 있는 소장품 전체를 한 덩어리로 묶어서 a collection 이라고 표현함.\n* Most 앞에 the 가 없으면 \u003c 대부분의 --> 가 되므로, one of most -- 는 \u003c대부분의 -- 중에서 하나> 와 같이 해석되는데, 영어에 이런 표현은 없음.","lesson":6,"parts":[["One of ",null],["most","A"],[" impressive collections of ",null],["nineteenth-century","B"],[" European ",null],["paintings","C"],[" in the United States can ",null],["be found","D"],[" in the Philadelphia Museum of Art.",null]]},{"n":155,"type":"error","note":false,"a":3,"fix":"stress(명사)","exp":"해석 : 발라드 (ballad /음악의 한 형태)는 다음과 같은 4가지의 특징을 가진다,  즉, 격식을 차리지\n않은 말씨, 주로 행동과 대화에 의존하는 해설, 주제의 강렬함, 그리고 반복에 대한 강조 등이다.\n해설 :\n* be characterized by～ = ～라는 특징을 가진다.\n* 이 문장에서는 by 에 연결되는 명사가 4번 있음.\n* informal diction = 격식을 차리지 않은 말씨\n* a narrative (which is) largely dependent on action and dialogue =  주로 행동과 대화에 의존하는 해설.  / 여기서는 (which is)를 생략했음.\n* thematic intensity = 주제의 강렬함\n* stress on repetition = 반복에 대한 강조","lesson":6,"parts":[["The ballad ",null],["is characterized","A"],[" by informal diction, by a narrative ",null],["largely","B"],[" dependent ",null],["on","C"],[" action and dialogue, by thematic intensity, and by ",null],["stressful","D"],[" on repetition.",null]]},{"n":156,"type":"blank","stem":"The American colonies -------------- before the Revolutionary War.","choices":["had a sizable merchant fleet","that had a sizable merchant fleet","of a sizable merchant fleet","were merchant fleet of size"],"note":true,"a":0,"fix":"","exp":"해석 : 식민지 시대의 미국은 독립전쟁이전에 큰 규모의 상인 집단을 가졌다.\n해설 :\n* The American colonies = 식민지 시대의 미국 (미국의 식민지를 의미하는 것이 아니고, 미국이 영국의 식민지였던 시대에 미국의 각 지역을 총칭적으로 말함)\n* sizable = 큰 규모의\n* merchant fleet = 상인 집단\n* the Revolutionary War = 독립전쟁 (영국으로부터의 독립을 재취하기 위한 전쟁)","lesson":6},{"n":157,"type":"blank","stem":"-----------------, the value of gold results from the interplay of the forces of supply and demand.","choices":["The same as that of any other commodity","Like that of any other commodity","Likely that of any other commodity","Such as that of any other commodity"],"note":false,"a":1,"fix":"","exp":"해석 : 어떤 다른 상품의 가치와도 마찬가지로, 금의 가치는 공급과 수요의 힘의 상호작용에 기인한다.\n해설 :\n* Like = (전치사)～와 마찬가지로.\n* that = the value를 의미함\n* that of any other commodity = 어떤 상품이든지 그 상품의 가치 (commodity 는 일반적으로 복수형으로 사용하지만 \u003cany other + 단수> 의 모양이 최상급의 의미로 사용되므로, 여기서는 단수를 사용했음.)\n* the value of gold = (주어)\n* results from = ～로부터 기인하다.\n* the interplay of the forces of supply and demand = 공급과 수요의 힘의 상호작용\n참고 :\n* (A) 의 The same as 를 사용하면 \u003c어떤 다른 상품의 가치와도 같은, 금의 가치는 --> 처럼 해석이 되어서, \u003c금의 가치는 모든 다른 상품의 가치와 같다> 가 되어 모순이다.\n* (C) likely 는 형용사로서 \u003c 가능성이 큰 > 의 의미.\n* (D) such as를 사용하면 \u003c 예를 들면 어떤 다른 상품의 가치와도 같은, 금의 가치는 --> 처럼 해석되어 무슨 말인지 알 수 없다.","lesson":6},{"n":158,"type":"error","note":false,"a":2,"fix":"providing","exp":"해석 : 오케스트라의 현악기 섹션은, 여러 가지 다른 음색의 질을 제공함으로써, 멜로디를 향상시킬 수 있다.\n해설 :\n* The woodwind section of an orchestra = (주어) 오케스트라의 현악기 섹션\n* may enrich = (동사) 향상시킬 수 있다\n* the melody = (목적어)\n* by providing different tonal qualities = (부사구) 여러 가지 다른 음색의 질을 제공함으로써.\n* by 는 전치사이므로 그 뒤의 동사는 원형으로 쓰지 않고 동명사로 쓴다.","lesson":6,"parts":[["The woodwind section of ",null],["an","A"],[" orchestra may ",null],["enrich","B"],[" the melody by ",null],["provide","C"],[" different ",null],["tonal","D"],[" qualities.",null]]},{"n":159,"type":"error","note":false,"a":3,"fix":"information","exp":"해석 : 바코드 (bar code)는, 컴퓨터가 (그것을) 정보로 변형시킬 수 있는 한 형태의 줄과 막대기\n모양으로 구성된다.\n해설 :\n* A bar code = (주어)\n* consists of = (동사)\n* a pattern of lines and bars ( that a computer can translate into information ) =\n   컴퓨터가 (그것을) 정보로 변형시킬 수 있는 한 형태의 줄과 막대기 모양\n* 밑줄친 부분은 관계대명사절로서, 그 안에서 관계대명사 that 은 목적어 역할이고\n   a computer = 주어  / can translate = 동사\n참고 :\n* information, furniture, equipment, mail . . . 등의 말들은 언제나 단수형으로 사용한다.","lesson":6,"parts":[["A bar code ",null],["consists","A"],[" of a pattern of lines and bars ",null],["that","B"],[" a computer can ",null],["translate","C"],[" into ",null],["informations","D"],[".",null]]},{"n":160,"type":"error","note":false,"a":0,"fix":"and","exp":"해석 : 인간과 동물은 둘 다 경험에 의해서 배운다. 그리고 배워진 지식은 간단한 행동의 계획과 수행에 영향을 끼친다.\n해설 :\n* Both humans and animals = (주어)\n* learn = 동사\n* by experience = (부사) 경험에 의해서\n* what is learned = (두 번째 절에서 주어) 배워진 것 (즉, 경험에 의해서 배운 지식)\n* influences = (두 번째 절에서 동사)\n* the planning and carrying out of simple actions = (두 번째 절에서 목적어) 간단한 행동의 계획과 수행\n참고 :\n* influence 가 동사일 때는 그 뒤에 전치사 없이 목적어를 바로 쓰고 \u003c～에 영향을 끼치다> 로 해석한다.\n* influence 가 명사일 때는 그 뒤에 전치사 (주로 on,  upon, over 등을) 사용하고 뒤에 목적어를 쓴다. 즉, \u003chave influence on + 명사> 의 모양.","lesson":6,"parts":[["Both humans ",null],["or","A"],[" animals learn by ",null],["experience","B"],[", and ",null],["what","C"],[" is learned influences the planning and carrying ",null],["out of","D"],[" simple actions.",null]]},{"n":161,"type":"blank","stem":"Traditionally, -------------------------- in the United States with political speeches, picnics, and most important of all, a display of fireworks at night.","choices":["the Fourth of July celebrated","the Fourth of July is celebrating","the Fourth of July which is celebrated","the Fourth of July is celebrated"],"note":true,"a":3,"fix":"","exp":"해석 : 전통적으로 7월 4일은 미국에서 다음의 세 가지와 함께 기념된다. 정치적인 연설들, 피크닉, 그리고 가장 중요한 것은 밤에 불꽃놀이 행사이다.\n해설 :\n* Traditionally = (부사) 전통적으로\n* the Fourth of July = 7월 4일 (독립기념일)\n* is celebrated = (동사/수동태) 기념된다.\n* most important of all = (부사구) 가장 중요한 것은\n* a display of fireworks at night = 밤에 불꽃놀이 행사\n참고 :\n* 미국이 독립선언을 한 것은, 영국과의 독립전쟁 (the Revolutionary War)을 치르고 있던 1776년 7월 4일이다.","lesson":6},{"n":162,"type":"blank","stem":"Before starting on a sea voyage, prudent navigators learn the sea charts, study the sailing directions, and memorize lighthouse locations to prepare themselves for any conditions ---------------.","choices":["they might encounter","or they might encounter","when they might encounter","and they might encounter"],"note":false,"a":0,"fix":"","exp":"해석 : 바다항해를 떠나기 전에, 현명한 항해자들은, 그들이 만날 수도 있는 어떤 상황에 대해서든지 준비하기 위해서, 바다 지도(해도)를 공부하고, 항해 방향을 연구하고, 등대의 위치를 기억한다.\n해설 :\n* Before starting on a sea voyage = (부사구) 바다항해를 떠나기 전에\n* prudent navigators = (주어) 현명한 항해자들\n* 동사는 3번 나열되어 있음 ( learn / study / and memorize )\n* learn the sea charts = 바다 지도(해도)를 공부하다.\n* study the sailing directions = 항해 방향을 연구하다.\n* memorize lighthouse locations = 등대의 위치를 기억하다.\n* to prepare 부터 문장 끝까지는 부정사의 부사적 용법 (～하기 위해서)\n* to prepare themselves for any conditions (that) they might encounter = 그들이 만날 수도 있는 어떤 상황에 대해서든지 준비하기 위해서\n* 밑줄 부분은 앞의 명사 any conditions를 수식하는 관계대명사절이며, that (또는 which) 생략되어 있음.\n참고 :\n이 문제는 주어 하나에 동사를 3번 사용한 병렬 연결법.","lesson":6},{"n":163,"type":"error","note":false,"a":3,"fix":"뺀다.","exp":"해석 : 해초들의 광주기반응은 어둠의 지속에 의존하는 것이지, 빛에 의존하는 것은 아니다.\n해설 :\n* The photoperiodic response of algae = (주어) 해초들의 광주기반응\n* actually = (부사) 사실상\n* depends on = (동사) ～에 의존하다.\n* the duration of darkness = 어둠의 지속(기간)\n* but it does not depend on light 을 생략법을 사용하여 줄이면, 밑줄친 부분 (주어와 동사)가 생략되어서 but not on light 가 남는다.\n참고 :\n* 등위 접속사 (and, but, or 등) 를 중심으로 양쪽에 같은 모양이 올 때 생략법을 사용할 수 있는데, 생략을 해서 읽는 사람이 혼동을 가져올 우려가 있는 말 (이 문장에서는 on)은 생략하지 않는다.\n* on 까지도 생략해 버리면, 그 뒤의 light 가 원래 문장에서 주어였었는지, 목적어였었는지 등이 혼동될 수 있다. 또한 전치사에 연결되는 명사가 서로 대조되는 경우에도 전치사를 생략하지 않는 것이 일반적이다.","lesson":6,"parts":[["The photoperiodic ",null],["response","A"],[" of algae actually ",null],["depends","B"],[" on the duration of ",null],["darkness","C"],[", but ",null],["is","D"],[" not on light.",null]]},{"n":164,"type":"error","note":false,"a":2,"fix":"make it","exp":"해석 : 기린의 긴 목과 다리들은 그것(기린)을 다른 모든 동물과 다르게 만들어주는(구별해주는) 가장 뚜렷한 특징들이다.\n해설 :\n* The giraffe's long neck and legs = (주어)\n* are = 동사\n* the most obvious features ( that make it different from all other animals ) = (보어) 그것(기린)을 다른 모든 동물과 다르게 만들어주는(구별해주는) 가장 뚜렷한 특징들\n참고 :\n* make + O + 형용사 의 5형식","lesson":6,"parts":[["The giraffe's long neck and legs ",null],["are","A"],[" the ",null],["most obvious","B"],[" features that ",null],["make","C"],[" different from ",null],["all other","D"],[" animals.",null]]},{"n":165,"type":"error","note":false,"a":0,"fix":"to","exp":"해석 : 미국의 거의 모든 지역이 원산지인 columbine flower 는, 거의 어떤 정원에서든지 씨로부터 재배될 수 있다.\n해설 :\n* The columbine flower = 주어\n* which is native to nearly all of the United States = 주어를 보충 설명하는 관계대명사절 (여기서 which is 를 생략한 것)\n* A(주어) + is native to B = A는 B가 원산지이다.\n* can be raised = (동사 / 수동태) 재배될 수 있다\n* from seed = (부사구) 씨로부터\n* in almost any garden = (부사구) 거의 어떤 정원에서든지\n참고 :\n* seed → 씨 하나 하나의 개체를 의미할 때는 셀 수 있는 명사로 사용하고, 열매, 나무 등에 상대되는 개념이나, 원인, 종자 등의 개념일 때는 셀 수 없는 명사로 취급하여 관사 없이 단수로 쓸 수 있다.","lesson":6,"parts":[["The columbine flower, native ",null],["in","A"],[" nearly ",null],["all of","B"],[" the United States, can ",null],["be raised","C"],[" from ",null],["seed","D"],[" in almost any garden.",null]]},{"n":166,"type":"blank","stem":"Butterfly and moth mouthparts have evolved into a long strawlike tube, or proboscis, --------------------------- liquid nectar from flowers.","choices":["enabled the insect sucking","to enable the insect to suck","enable the insect suck","to enable the insect sucking"],"note":true,"a":1,"fix":"","exp":"해석 : 나비와 나방의 입 부분은 긴 빨대처럼 생긴 튜브- 다른 말로는 proboscis -로 진화해서, 그 곤충으로 하여금 꽃으로부터 액체즙을 빨수 있게 해준다.\n해설 :\n* Butterfly and moth mouthparts =(주어)\n* have evolved = (동사) 진화했다. (진화해왔다)\n* into a long strawlike tube, or proboscis, = 긴 빨대처럼 생긴 튜브 (다른 말로는 proboscis)로\n* evolve into ～= ～로 진화하다. (진화해서 ～가 되다)\n* to enable the insect to suck liquid nectar from flowers = (부정사의 결과적 용법) 그래서 그 곤충으로 하여금 꽃으로부터 액체즙을 빨수 있게 해준다.\n* enable O  to V = 5형식의 기본형 (O에게 V할 수 있게 해주다)  = allow O to V\n참고 :\n* evolve --- to V = 이 경우의 toV(부정사)는 결과적 용법으로 \u003c그래서--한다, 했다> 와 같이 해석한다.\n* 동격의 or → A, or B, 의 모양은 \u003cA, 또는 B, > 가 아니고 \u003cA, 즉 B,>의 뜻으로서 동격이다.","lesson":6},{"n":167,"type":"blank","stem":"The crocuses which bloom as the winter snows recedes ----------------------------- .","choices":["are harbingers of approaching spring","harbinger of approaching spring","and are harbingers of approaching spring","that are harbingers of approaching spring"],"note":false,"a":0,"fix":"","exp":"해석 : 겨울눈이 후퇴할 때(없어질때) 피는 크로커스(꽃의 이름)는 다가오는 봄의 전조이다.\n해설 :\nThe crocuses [which bloom as the winter snows recedes ]are harbingers of approaching spring.\n* 괄호친 부분은 앞의 명사를 수식하는 관계대명사절이고 밑줄친 부분은 그 안에서 부사절이다.\n* bloom = (동사) 꽃이 피다.\n* harbinger = 전조\n* approaching spring = 다가오는 봄. (이 경우는 approaching 은 현재분사)","lesson":6},{"n":168,"type":"error","note":false,"a":3,"fix":"feeding methods","exp":"해석 : 고래는 여러 다른 형태의 턱과 식사 방식에 의해서 크게 두 가지 그룹으로 구분된다.\n해설 :\n* Whales =(주어) 고래\n* are divided = (동사) 구분된다, 나뉘어진다.\n* into two main groups = 두 개의 큰 그룹으로\n* by the different types of jaws and feeding methods = 여러 다른 형태의 턱과 식사 방식에 의해서\n* feeding methods = 식사 방식\n참고 :\n* be divided into A(복수) by B = B에 의해서 A(복수)로 나뉘어진다.","lesson":6,"parts":[["",null],["Whales","A"],[" are divided ",null],["into","B"],[" two main groups by ",null],["the different","C"],[" types of jaws and ",null],["methods feeding","D"],[".",null]]},{"n":169,"type":"error","note":false,"a":3,"fix":"thrift","exp":"해석 : Benjamin Franklin 에 의해 씌어진 일련의 글인 Poor Richard Almanac 은 근면, 검소함, 열심히 일하는 것 등과 같은 그런 가정적인 미덕의 장점들을 설명한다.\n해설 :\n* Poor Richard Almanac 와 a series of writing by Benjamin Franklin 은 동격으로서 주어\n* expounds = (동사) 설명하다, 상술하다.\n* the merits of such homely virtues as diligence, thrift, and hard work = 근면, 검소함, 열심히 일하는 것 등과 같은 그런 가정적인 미덕의 장점들\n* thrifty 는 형용사이고, thrift 는 명사임.\n참고 :\n* 이것은 diligence, thrift, and hard work 의 세 가지 명사의 병렬 연결을 묻는 문제","lesson":6,"parts":[["Poor Richard Almanac, ",null],["a","A"],[" series of writing ",null],["by","B"],[" Benjamin Franklin, expounds the merits of ",null],["such homely","C"],[" virtues as diligence, ",null],["thrifty","D"],[", and hard work.",null]]},{"n":170,"type":"error","note":false,"a":0,"fix":"surprising","exp":"해석 : 거의 즉각적으로 인화를 해내는 폴라로이드 카메라의 놀라운 능력은, 그것(카메라)의 가장\n큰 장점이다.\n해설 :\n* The Polaroid Land Camera's surprisingly ability to produce a print almost instantaneously = (주어)\n* is = (동사)\n* its greatest asset = (보어) 그것의 가장 큰 장점(자산, 자랑거리)\n참고 :\n* able to V = V할 능력이 있는 / ability to V = V할 능력 / inability to V = V하는 것에 대한\n무능력 (하지 못함) 등등의 말들은 toV (부정사)를 사용하는 것에 유의할 것.","lesson":6,"parts":[["The Polaroid Land Camera's ",null],["surprisingly","A"],[" ability ",null],["to produce","B"],[" a print ",null],["almost","C"],[" instantaneously is ",null],["its greatest","D"],[" asset.",null]]},{"n":171,"type":"blank","stem":"Fuel injection engines employ injectors --------------------- to spray fuel into the cylinders.","choices":["instead a carburetor is employed","instead employing a carburetor","instead of a carburetor","instead of employ a carburetor"],"note":true,"a":2,"fix":"","exp":"해석 : Fuel injection 엔진은 연료를 실린더에 분사하기 위해서, 카브레이터 대신에 injectors를 사용한다.\n해설 :\n* Fuel injection engines = (주어)\n* employ =(동사) 사용하다.\n* injectors = (목적어)\n* instead of = (전치사) --대신에\n* to spray fuel into the cylinders = 부정사의 부사적용법 (연료를 실린더에 분사하기 위해서)\n참고 :\n* instead of 는 전치사이므로 그 뒤에 명사나 동명사를 사용함.","lesson":6},{"n":172,"type":"blank","stem":"Identical colors ----------------------- when they are viewed against different backgrounds.","choices":["may appear to be quite different","may appear being quite different","may appear be quite different","may appear quite different to be"],"note":false,"a":0,"fix":"","exp":"해석 : 같은 색깔이, 다른 배경에 대비되어 보일 때는, 꽤 다르게 보일 수도 있다.\n해설 :\n* Identical colors = (주어)\n* may appear to be = (동사)\n* quite different = (보어)\n* when they are viewed against different backgrounds = (부사절)\n참고 :\n* appear to be + 형,명 / appear + 형 = ～인 것으로 보이다. (어떠하게 보이다)","lesson":6},{"n":173,"type":"error","note":false,"a":3,"fix":"to make","exp":"해석 : 캐나다의 국회는 법을 시행하거나 집행할수도 없고 정책을 입안할 수도 없지만, 국회는 법을 만들고 자금의 할당에 관해 투표를 할 권한을 가진다.\n해설 :\n* Although Canada's Parliament can neither administer or enforce laws nor initiate policy = (부사절)\n* neither administer or enforce laws nor initiate policy → 여기서 or 는 neither 와 관련된 것이 아니고 administer 와 enforce를 연결하는 데만 사용된 것.\n* 따라서 administer or enforce laws 는 하나로 묶어서 봐야한다. 이 안에서 administer or enforce 는 동사이고 laws는 목적어\n* nor 의 뒤에서도 initiate 는 동사이고 policy 는 목적어.\n* administer or enforce laws = 법을 시행하거나 집행하다.\n* initiate policy = 정책을 입안하다.\n* it does have the power for making laws and vote on the allocation of funds = 주절.\n* 주절에서 주어는 it 이고 동사는 does have (강조 / 앞의 부사절에서 \u003c--하지 못한다>는 부정의 말이 있었으므로, 이런 경우에는 뒤에 \u003c--할 수 있다>는 긍정의 말이 나올 때 영어에서는 강조하기 위해 do, does, did 등을 흔히 사용한다.)\n* 맨 뒤의 동사(문장의 동사로 사용된 것이 아님) vote 가 원형으로 되어 있으므로 power for making을 power to make 으로 고쳐서, to 에 make 와  vote 두 개를 연결한 것으로 봐야한다. 만약 power for making을 그대로 놔두려면 뒤에 있는 vote를 voting 으로 고쳐야 power for 에 연결할 수 있게 된다.\n참고 :\n* 주절의 주어 it 는 단수이므로 뒤의 동사 vote를 주어 it 에 직접 연결할 수 없다.","lesson":6,"parts":[["Although Canada's Parliament can neither administer ",null],["or","A"],[" enforce laws nor initiate policy, ",null],["it","B"],[" ",null],["does have","C"],[" the power ",null],["for making","D"],[" laws and vote on the allocation of funds.",null]]},{"n":174,"type":"error","note":false,"a":0,"fix":"ninth most","exp":"해석 : 지각에서 9번째로 풍부한 원소인 수소는 냄새 없고, 색이 없고, 맛이 없는 기체이다.\n해설 :\n* Hydrogen = (주어) 수소\n* the ninth most abundant element in the Earth's crust =(주어와 동격의 명사)\n* is = (동사)\n* an odorless, colorless, and tasteless gas = (보어)\n참고 :\n* 영어에서 뒤에 less 또는 -free 가 붙는 말은 형용사이다.\n(예) sugar-free = (형) 설탕이 포함되어있지 않은.\n* \u003c몇 번째로 --한> 을 표현할 때는 최상급 앞에 서수를 사용함.\n(예) the second largest ranch in this area = 이 지역에서 두 번째로 큰 목장","lesson":6,"parts":[["Hydrogen, the ",null],["ninth","A"],[" abundant element ",null],["in","B"],[" the Earth's crust, is ",null],["an","C"],[" odorless, ",null],["colorless","D"],[", and tasteless gas.",null]]},{"n":175,"type":"error","note":false,"a":2,"fix":"tenderness","exp":"해석 : James Baldwin 의 Just Above My Head 라는 작품은 인간의 상호작용에 기여하는 모든\n감정표현, 폭력, 부드러움 등을 묘사하는 하나의 뜻깊은 책이다.\n해설 :\n* James Baldwin's Just Above My Head = (주어)\n* is = (동사)\n* a revealing book portraying all the lyricism, violence, and tenderness (that contribute to human interaction) = (보어) 인간의 상호작용에 기여하는 모든 감상 (정서의 발로), 폭력, 부드러움 등을 묘사하는 하나의 뜻 깊은 책\n* portraying = which reveals 의 변형으로 볼 수도 있다.\n* 밑줄친 부분은 앞의 세가지 명사를 수식하는 관계대명사절.\n* revealing =(형) 뜻깊은\n* lyricism = 감상(정서의 발로)\n* contribute to～ = ～에 기여하다.\n* human interaction = 인간들 사이의 상호작용, 영향.\n참고 :\n* 이 문제는 \u003c 명사, 명사, and 명사 >의 3가지 대등요소 연결법.","lesson":6,"parts":[["James Baldwin's Just Above My Head is a revealing book ",null],["portraying","A"],[" all ",null],["the","B"],[" lyricism, violence, and ",null],["tender","C"],[" that contribute ",null],["to","D"],[" human interaction.",null]]},{"n":176,"type":"blank","stem":"The banana tree, ---------------------- consisting of 93 percent water, is the largest plant on Earth without a woody stem.","choices":["an extremely fragile plant","an extreme fragile plant","is an extremely fragile plant","while an extremely fragile plant"],"note":true,"a":0,"fix":"","exp":"해석 : 93%의 물로 구성되어 있는, 바나나 나무는 지구상에서 목질의 줄기를 가지지 않은 가장 큰 식물이다.\n해설 :\n* The banana tree 와 an extremely fragile plant consisting of 93 percent water 는 동격으로 주어.\n* is = 동사\n* the largest plant on Earth without a woody stem = (보어) 지구상에서 목질의 줄기를 가지지 않은 가장 큰 식물\n* 문장의 내용상 larger(비교급)은 안되고 largest(최상급)이 어울린다.\n참고 :\n* an extremely fragile plant which consists of 93 percent water 에서 which consists 를 consisting 으로 변형시킬 수 있다.","lesson":6},{"n":177,"type":"blank","stem":"Although a biography is primarily intended to recount a person's life, many biographers also examine the social forces ---------------------------- .","choices":["that was helped shape it","that helped shape it","that they helped shape it","that helped shaping it"],"note":false,"a":1,"fix":"","exp":"해석 : 전기는 한 사람의 인생을 다시 설명하기 위해 의도된 것이지만, 많은 전기작가들은 그것을 형성하는데 도움을 주었던 사회적 힘들을 조사한다.\n해설 :\n* Although a biography is primarily intended to recount a person's life = (부사절)\n* be intended to V = V 하기 위해 의도된 것이다.\n* recount = 다시 설명하다.\n* many biographers also examine the social forces [ that helped shape it ] = (주절)\n* many biographers = 주어\n* examine = 동사\n* the social forces = 목적어\n* 밑줄친 부분은 관계대명사 절로서 앞의 명사 the social forces 를 수식함.\n* 관계대명사 절 안에서 that helped shape it → that 주어 / helped = 동사 / shape it = 목적어\n* help 는 특수동사로서 동사의 원형을 목적어로 취할 수 있다.\n참고 :\n* help 는 5형식에서 다음과 같이 사용한다.\n(예 1) The Internet helps students find information. (help가 사역동사임)\n(예 2) The Internet helps students to find information. (help가 비 사역동사임)\n* 위의 문장들에서 목적어를 생략하고 목적격보어만 사용할 때는, 다시 목적격보어를 목적어로 취급하여 3형식이 된다.\n(예 3) The Internet helps find information. -- (예1)에서 students 를 생략한 형태\n         - 이 경우는 help 의 목적어로서 동사의 원형을 사용한 셈이 된다.\n(예 4) The Internet helps to find information. -- (예2)에서 students 를 생략한 형태","lesson":6},{"n":178,"type":"error","note":false,"a":2,"fix":"to communicate","exp":"해석 : the International Code of Signals 라고 알려져 있는, 특별한 한 그룹의 깃발의 사용은 모든 국가 출신의 해군요원들로 하여금 서로 의사소통을 할 수 있게 해주었다.\n해설 :\n* 문장 전체는 5형식. (S+V+O+O.C.)\n* The use of a special group of flags, (which is ) known as the International Code of Signals = 주어\n* has enabled = 동사\n* naval personnel from all nations = 목적어 (모든 국가 출신의 해군요원들)\n* to communicate with each other = 목적격 보어\n참고 :\n* 국적을 나타낼 때 전치사 from 을 사용하는 경우가 흔하다.","lesson":6,"parts":[["The ",null],["use","A"],[" of a special group of flags, known as the International Code of Signals, ",null],["has","B"],[" enabled naval personnel from all nations ",null],["communicate","C"],[" with ",null],["each other","D"],[".",null]]},{"n":179,"type":"error","note":false,"a":3,"fix":"hardness","exp":"해석 : 코발트는  인장강도, 외모, 그리고 경도에 있어서 철이나 니켈과 닮았다.\n해설 :\n* Cobalt = 주어\n* resembles = 동사\n* iron and nickel = 목적어\n* in tensile strength, appearance, and hardness = (부사구) 인장강도, 외모, 그리고 경도에 있어서\n참고 :\n화학 원소의 이름은 대표명사로 사용할 때, a 나 the 등의 관사를 사용하지 않는다.","lesson":6,"parts":[["",null],["Cobalt","A"],[" resembles iron ",null],["and","B"],[" nickel ",null],["in","C"],[" tensile strength, appearance, and ",null],["hard","D"],[".",null]]},{"n":180,"type":"error","note":false,"a":0,"fix":"It","exp":"해석 : 1972년 미국 대통령직에 출마한 최초의 흑인여성은 바로 Shirley S. Chisholm 였다.\n해설 :\n* It was -- that -- 의 강조구문 → that 앞에 사람이 있으면 that 을 who, whom 등으로 바꿀 수 있다. 이 경우에 사용되는 that, who, whom 는 관계대명사가 아님.\n* It was Shirley S. Chisholm who(=that) was the first Black woman to run for the office of President of the United States in 1972.\n* 밑줄친 부분을 생략하고 보면 나머지 부분으로 문장이 성립된다.\n참고 :\n* \u003c관계대명사의 선행사가 고유명사이면 관계대명사절의 양쪽에 반드시 컴마(,)를 사용해야한다.> 는 규칙을 상기해보면 다음과 같은 형태의 문제를 쉽게 해결할 수 있다.\n* ------ Thomas Edison who invented the light bulb. 같은 모양에서 who 의 앞에 컴마가 없으므로 who 는 관계대명사가 아니며, 이 문장은 \u003c강조구문>이다. 그러므로, 문장의 맨앞에는 It is 또는 It was 등이 온다는 것을 알 수 있다.\n\n7과","lesson":6,"parts":[["",null],["That","A"],[" was Shirley S. Chisholm who ",null],["was","B"],[" the first Black woman ",null],["to run","C"],[" for the ",null],["office of","D"],[" President of the United States in 1972.",null]]},{"n":181,"type":"blank","stem":"Children with parents --------- is firm, consistent, and rational are inclined to possess high levels of self-confidence.","choices":["who guidance","whom guidance","whose guidance","their guidance"],"note":true,"a":2,"fix":"","exp":"해석 : 그들의(부모의) 지도가 확고하고, 일관성 있고, 합리적인 그러한 부모를 가진 아이들은 높은 수준의 자신감을 소유하는 경향이 있다.\n해설 :\n* Children with parents (whose guidance is firm, consistent, and rational) → 괄호친 부분은 관계대명사절로서, 그 안에서 whose guidance = 주어 / is = 동사/ firm, consistent, and rational = 보어\n* whose = 소유격 관계대명사 (parents를 의미함) / 뒤의 guidance 와 합쳐서 \u003c부모들의 지도> 로 해석할 수 있다.\n* be inclined to V =  V하는 경향이 있다\n* possess= 소유하다\n* high levels of self-confidence= 높은 수준의 자신감\n참고 :\n관계대명사 whose 는 반드시 그 뒤에 의미상 연결되어 하나의  문장의 성분으로서 역할을 하는 명사가 있어야 한다. (whose guidance ions","representations from relatively realistic","realistic from relative representations","from relatively realistic representations"],"note":true,"a":3,"fix":"","exp":"해석 : 만화영화에서 사용되는 스타일들은, 일상생활의 비교적 사실적인 반영으로부터 가장 로맨틱하며 불가능한 환상에 이르기까지의 범위에 걸친다.\n해설 :\n* The styles used in cartoon animation = (주어) 만화영화에서 사용되는 스타일들\n* range = (동사) / range from A to B = A 에서 B 까지의 범위에 걸친다.\n* from relatively realistic representations of every day life = 일상생활의 비교적 사실적인 반영으로부터.\n* to the most romantic and impossible fantasy = 가장 로맨틱하며 불가능한 환상에 이르기까지.\n참고 :\n* range from A to B 와 비슷한 표현 → vary from A to B (A 에서 B 에 이르기까지 다양하다)","lesson":7},{"n":202,"type":"blank","stem":"According to psychologists, a person's attention is attracted not so much by the intensity of different signals -------------------, significance, and information content.","choices":["by as their context","by their context as","as by their context","as their context by"],"note":false,"a":2,"fix":"","exp":"해석 : 심리학자들에 의하면, 한 사람의 관심은 A 에 의해서라기 보다는 오히려 B 에 의해서 이끌린다.\n* 여기서 A 는 \u003c여러 가지 신호의 강도>이고 B 는 \u003c그들의 문맥, 의미, 정보내용 등>을 의미함.\n해설 :\n* not so much A as B = A 라기보다는 오히려 B 이다.\n* 이 문장에서는 \u003c not so much by A -- as by B -- > 의 모양 = A 에 의해서 라기 보다는\n오히려 B에 의해서.\nA 에 해당하는 것은 = the intensity of different signals \u003c여러 가지 신호의 강도>\nB 에 해당하는 것은 = their context, significance, and information content \u003c그들의 문맥,\n의미, 정보내용 등> 을 의미함.\n* According to psychologists = (부사구) 심리학자등에 의하면.\n* a person's attention = 주어 / is attracted = 동사\n참고 : not so much A as B = not A so much as B","lesson":7},{"n":203,"type":"error","note":false,"a":3,"fix":"to publish","exp":"해석 : 만약에 그 논란이 되는 에세이를 과감히 출판했던 Elizabeth Peabody 가 없었더라면, Thoreau 의 작품 \"On the duty of Civil Disobedience\" 의 영향은 그렇게 대단히 광범위하지 않았을는지도 모른다.\n해설 :\n* The impact of Thoreau's \"On the duty of Civil Disobedience\" = (주어)\n* might not have been = (동사 /가정법 과거완료) 하지 않았을는지도 모른다.\n* so far-reaching = (보어) 대단히 광범위한\n* had it not been for ～ = 가정법과거완료 if it had not been for an the chimpanzee","while not as curious as the chimpanzee","not curious as much as the chimpanzee","being not as curious than the chimpanzee"],"note":true,"a":1,"fix":"","exp":"해석 : 고릴라는, 침팬지만큼 그렇게 호기심이 강하지는 않지만,  문제를 해결하는 데 있어서 더 많은 끈기와 기억보존능력을 나타낸다.\n해설 :\n* The gorilla = (주어)\n* , while (it is) not as curious as the chimpanzee, = (주어와 동사 사이에 삽입된 부사절) → (고릴라는) 침팬지만큼 그렇게 호기심이 강하지는 않지만 / 여기서 밑줄친 부분 생략.\n* shows = (동사) 나타낸다, 보여준다.\n* more persistence and memory retention = (목적어) 더 많은 끈기와 기억보존능력.\n* in solving a problem = (부사구) 문제를 해결하는 데 있어서.\n참고 :\n* 시간, 조건, 양보 등의 부사절 접속사 뒤에는 \u003c주어+be동사>를 생략할 수 있다. (부사절의 주어가 주절의 주어와 같고 시제가 같은 경우)","lesson":7},{"n":207,"type":"blank","stem":"One of the most distinct dialects of North American English, Gullah --------------------- many people in the South Caroline area.","choices":["that is spoken by","is spoken by","spoken by","which has been spoken by"],"note":false,"a":1,"fix":"","exp":"해석 : 북미 영어에서 가장 독특한 방언(사투리)들 중의 하나인 Gullah 는 South Carolina 지역에서 많은 사람들에 의해서 행해진다.\n해설 :\n* One of the most distinct dialects of North American English, Gullah = (주어)\n  One of the most distinct dialects of North American English 와 Gullah 는 동격.\n* is spoken = (동사 /수동태) 말되어진다, 행해진다.\n* by many people = (부사구) 많은 사람들에 의해서\n* in the South Carolina area = (부사구) South Carolina 지역에서","lesson":7},{"n":208,"type":"error","note":false,"a":3,"fix":"chemically","exp":"해석 : 만약 하나의 원자가 그것의 전자들 중의 어느 것이라도 잃어버리면, 그것은 양으로 대전되고 다른 원자들과 화학적으로 결합할 수 있다.\n해설 :\n* \u003c 화학적으로 결합하다> 에서 \u003c 화학적으로 > 는 부사이므로 chemically 가 옳다.\n* If an atom loses any of its electrons = (부사절) 만약 하나의 원자가 그것의 전자들 중의 어느 것이라도 잃어버리면\n* it becomes positively charged and can combine chemically with other atoms = (주절) 그것은 양으로 대전되고 다른 원자들과 화학적으로 결합할 수 있다.\n참고 :  positively = 양으로 / negatively = 음으로","lesson":7,"parts":[["If an atom loses ",null],["any","A"],[" of its electrons, it becomes ",null],["positively","B"],[" charged and can ",null],["combine","C"],[" ",null],["chemical","D"],[" with other atoms.",null]]},{"n":209,"type":"error","note":false,"a":0,"fix":"methods","exp":"해석 : 스펙트럼의 분석방법은 연구되는 파장의 범위에 따라서 다양하다. (변화한다, 다르다)\n해설 :\n* The method of spectrum analysis = 주어\n* vary = (동사)\n* according to the wavelength region (that is) studied. → 연구되는 파장의 범위에 따라서 / 여기서 (that is)는 생략 가능.\n참고 :\n* vary according to～ = ～에 따라서 다양하다, 변화한다, 다르다.","lesson":7,"parts":[["The ",null],["method","A"],[" of spectrum analysis vary ",null],["according to","B"],[" the wavelength ",null],["region","C"],[" that is ",null],["studied","D"],[".",null]]},{"n":210,"type":"error","note":false,"a":2,"fix":"stress","exp":"해석 : 땅 표면이 달리는 사람의 무게에 대해 덜 굴복(양보)할수록 (사람의 무게에 의해서 덜 찌그러질수록), 그 사람의 신체에 가해지는 스트레스는 더 크다.\n해설 :\n* 이중비교급의 용법 → \u003c The 비교급 S + V -- , the 비교급 S + V -- > = --할수록 더욱 --하다.\nThe less  the surface of the ground yields to the weight of the body of a runner,\nthe 비교급 +        S              + V\nthe greater the stress to the body (is).\nthe 비교급 +        S           + V\n* (is) 는 생략되었음. → 이중비교급의 양쪽 절에서 또는 한쪽 절에서 자유롭게 be동사를 생략할 수 있다.\n* yield to ～=～에 지다, 굴복하다, 양보하다. → 이 문장에서는 의역하여 \u003c～에 의해서 찌그러지다>\n참고 :\n* the stress to the body 가 둘째 절에서 주어이므로 stressful(형용사)를 사용하지 않고 명사를 사용해야 한다.","lesson":7,"parts":[["The less ",null],["the surface","A"],[" of the ground yields to the weight of the body of a runner, the ",null],["greater","B"],[" the ",null],["stressful","C"],[" to ",null],["the body","D"],[".",null]]},{"n":211,"type":"blank","stem":"Most household appliances emit electromagnetic fields that are basically equivalent to --------------- high-voltage lines.","choices":["those emitted by","what emit by","they are emitted by","which are emitted by"],"note":true,"a":0,"fix":"","exp":"해석 : 대부분의 가정용 가전제품은, 고전압에 의해서 방출되는 그것(those= 전자기장)과 근본적으로 동일한 전자기장을 방출한다.\n해설 :\n* Most household appliances = (주어) 대부분의 가정용 가전제품.\n* emit = (동사) 방출하다.\n* electromagnetic fields = (목적어) 전자기장.\n* (that are basically equivalent to those emitted by high-voltage lines) = (관계대명사절) 고전압에 의해서 방출되는 그것(those= 전자기장)과 근본적으로 동일한.\n* be equivalent to～ = ～와 동등하다, 동일하다.\n* those = 반복의 대명사 / 여기서는 electromagnetic fields 전자기장을 의미함.\n참고 :\n* 반복의 대명사 those 는 항상 그 바로 뒤에 수식하는 말 (형용사, 분사, 관계사절 등)이 연결되어있다. / 이 문장에서는 분사 emitted (방출되는)가 이에 해당함.","lesson":8},{"n":212,"type":"blank","stem":"The Great Salt Lake is ------------ of a great freshwater lake that extended throughout northwestern Utah centuries ago.","choices":["all that left","that all is left","all that is left","left all that is"],"note":false,"a":2,"fix":"","exp":"해석 : The Great Salt Lake는 수 세기 전에 유타주 북동지역에 걸쳐서 펼쳐있었던 하나의 거대한\n민물 호수로부터 남겨진 모든 것 (다른 부분은 다 없어지고 현재 남아있는 유일한 부분) 이다.\n해설 :\n* The Great Salt Lake = 주어\n* is = 동사\n* all that is left of ～= ～로부터 남겨진 모든 것 (다른 부분은 다 없어지고 현재 남아있는 유일한 부분)\n* all 이 관계대명사의 선행사로 사용될 때는 흔히 \u003c～인 모든 것>, 즉 \u003c～인 유일한 것>과 같이 해석된다.\n* a great freshwater lake (that extended throughout northwestern Utah centuries ago) = 수 세기전에 유타주 북동지역에 걸쳐서 펼쳐있었던 하나의 거대한 민물 호수.\n참고 :\n* The Great Salt Lake = 유타(Utah) 주에 있는 호수의 이름","lesson":8},{"n":213,"type":"error","note":false,"a":0,"fix":"few","exp":"해석 : 오늘날 미국에서는 비교적 적은 숫자의 도시가 서로 경쟁하는 여러 신문들을 가지는데,\n그것은 1900년으로부터의 큰 변화이다, 그런데 그 때(1900년에)는 대부분의 대도시는 둘 이상의 신문을 가지고 있었다.\n해설 :\n* Comparatively few cities in the United States = (주어) 미국에서는 비교적 적은 숫자의 도시가 ～한다. (～인, ～한 도시는 비교적 적다.)\n* 부정적인 의미를 전달하기 위한 것이므로 few 나 little 앞에 관사 a를 사용하지 않는다.\n* have = (동사)\n* competing newspapers = (목적어) 서로 경쟁하는 여러 신문들.\n* (which is) a major change from 1900 = which 는 앞 문장의 사건전체를 의미함. (그런데 그것은 1900년으로부터의 큰 변화였다.) 여기서 which is 생략.\n* when most large cities had more than two newspapers = (관계부사절의 계속적 용법)\n그때 (1900년에) 대부분의 대도시는 둘 이상의 신문을 가지고 있었다.\n참고 :\n* a major change from 1900  → 앞 문장 전체와의 동격으로 볼 수도 있다.","lesson":8,"parts":[["Comparatively ",null],["a few","A"],[" cities in the United States have ",null],["competing","B"],[" newspapers today, ",null],["a major","C"],[" change from 1900, ",null],["when","D"],[" most large cities had more than two newspapers.",null]]},{"n":214,"type":"error","note":false,"a":3,"fix":"injury","exp":"해석 : 무릎은 신체의 어느 다른 부분보다도 더 피해를 입기가 쉽다. 왜냐하면 그것은 뒤틀리면 반드시 부상하기 때문이다.\n해설 :\n* The knee is more likely to be damaged than most other joints in the body = (주절) 무릎은 신체의 어느 다른 부분보다도 더 피해를 입기가 쉽다.\n* be likely to V = V 할 가능성이 많다, V하기가 쉽다.\n* because it cannot twist without injure = (부사절) 왜냐하면 그것은 뒤틀리면 반드시 부상하기 때문이다.\n* cannot --- without ～= \u003c--하면 반드시 ～한다>로 해석하는 경우도 흔하다.\n참고 :\n* without 은 전치사이므로 그 뒤에 명사나 동명사를 사용 / injure 는 동사임.","lesson":8,"parts":[["The knee is more ",null],["likely","A"],[" to be damaged than ",null],["most other","B"],[" joints in the body ",null],["because","C"],[" it cannot twist without ",null],["injure","D"],[".",null]]},{"n":215,"type":"error","note":false,"a":2,"fix":"been seen","exp":"해석 : 헬리 혜성은 240 B.C. 년에 중국에서 처음으로 관찰된 것으로 기록되어 있으며, 그 이후로 여태까지 지구에서 29번 관찰되어왔다.\n해설 :\n* Halley's Comet = (주어) 헬리 혜성\n* had = 동사\n* its first documented sighting = (목적어) 그것의 첫 번째 기록된 관찰.\n* in 240 B.C. in China = (부사구)\n* since then = (부사구) 그 이후로 여태까지\n* it has seen from the Earth 29 times = 지구에서 29번 관찰되어왔다.\n참고 :\n* \u003c혜성이 보여지는 것>은 수동태이므로 have been seen (현재완료수동태)가 필요함.","lesson":8,"parts":[["Halley's Comet had its first ",null],["documented","A"],[" sighting in 240 B.C. in China and ",null],["since then","B"],[" it has ",null],["seen","C"],[" from the Earth 29 ",null],["times","D"],[".",null]]},{"n":216,"type":"blank","stem":"Tecumseh, a strong fighter and gifted orator, --------------------- in his tribe both in times of peace and of war.","choices":["who played an influential role","was played an influential role","by whom an influential role was played","played an influential role"],"note":true,"a":3,"fix":"","exp":"해석 : 강한 전사이며 재능있는 웅변가인 Tecumseh 는 평화시에도 전시에도 그의 부족에서\n영향력있는(중요한) 역할을 했다.\n해설 :\n* Tecumseh, a strong fighter and gifted orator, = (주어) 강한 전사이며 재능있는 웅변가인 Tecumseh\n* played an influential role = 영향력있는(중요한) 역할을 했다.\n* in his tribe = 그의 부족에서\n* both in times of peace and of war = 평화시에도 전시에도 omposed of heavy-textured clay soil = (분사구) 무거운 재질의 점토로 구성되는.\n* adobe = (주어) 어도우비 벽돌.\n* 동사는 has 와 is (dry뒤에 있는) 두 개.\n* adobe has great elasticity when moist, but when dry is able to hold its shape → 밑줄친 부분이 동사임. (두 개)\n* great elasticity = (목적어) 대단한 탄력성.\n* when (it is) moist = 습할 때.\n* but [ when (it is) dry ] is able to hold its shape → 그러나 [ (그것이) 건조할 때는 ] 그것의 모양을 유지할 수 있다.\n참고 :\n* Adobe, which is composed of heavy-textured clay soil, has ----------. 의\n모양에서 밑줄친 부분의 which is 를 생략하고 나머지 밑줄친 부분을 문장의 맨 앞으로\n옮기면 위 문제의 형태가 된다. (분사구 만들기)","lesson":8},{"n":223,"type":"error","note":false,"a":1,"fix":"the size","exp":"해석 : 망원경과 같은 방식으로 작동하는 망원 사진렌즈는 먼 거리에 있는 물체의 사이즈를 확대한다.\n해설 :\n* Working like a telescope = (분사구) 망원경과 같은 방식으로 작동하는.\n* a telephoto lens = (주어) 망원 사진렌즈.\n* magnifies = (동사) 확대한다.\n* the size of objects at great distances = (목적어) 먼 거리에 있는 물체의 사이즈.\n참고 :\n* A telephoto lens, which works like a telescope, magnifies -----------. 의 모양에서\n밑줄친 부분의 which works 를 working 으로 고쳐서, 밑줄친 부분을 문장의 맨 앞으로\n옮기면 위 문제의 형태가 된다. (분사구 만들기)","lesson":8,"parts":[["",null],["Working","A"],[" like a telescope, a telephoto lens magnifies ",null],["their size","B"],[" of objects ",null],["at","C"],[" great ",null],["distances","D"],[".",null]]},{"n":224,"type":"error","note":false,"a":0,"fix":"Because","exp":"해석 : 민속발라드는 보통 사람들의 일상 생활로부터 유래하기 때문에, 가장 인기있는 주제는 사랑,\n질투, 복수, 재난, 그리고 모험등이다.\n해설 :\n* Because folk ballads stem from the everyday life of common people = (부사절)\n* the most popular themes are love, jealousy, revenge, disaster, and adventure = (주절)\n참고 :\n* because of 는 전치사이므로, 두 개의 절을 연결할 때는 접속사로서 because 를 사용한다.","lesson":8,"parts":[["",null],["Because of","A"],[" folk ballads ",null],["stem from","B"],[" the everyday life of ",null],["common","C"],[" people, the most popular themes are love, ",null],["jealousy","D"],[", revenge, disaster, and adventure.",null]]},{"n":225,"type":"error","note":false,"a":3,"fix":"his","exp":"해석 : Robert Frost 는 40대의 나이에 도달할 때까지 시인으로서 잘 알려지지 않았 ern quahog clam shells","Northern quahog clam shells using","Northern quahog clam shells are used","When using northern quahog clam shells"],"note":true,"a":0,"fix":"","exp":"해석 : 북미산 대합조개 껍질을 이용해서, 북미 원주민들은 묶어서 돈으로 사용하는 구슬을 만들었다.\n해설 :\n* Using northern quahog clam shells = (분사구) 북미산 대합조개 껍질을 사용해서.\n* Native Americans made beads (that they strung together and used as money) = (관계대명사 that 은 절 안에서 두 개의 동사 strung together 와 used 의 공통 목적어의 역할). 북미 원주민들은 묶어서 돈으로 사용하는 구슬을 만들었다.\n참고 :\n* using 을 이용한 분사구는 보통, 주절의 앞에(문장 맨 앞에) 써서 \u003c～를 이용해서> 라고 해석한다.","lesson":9},{"n":242,"type":"blank","stem":"Sociology, the study of humans in their collective aspect, ------------------------- : economic, social, political, and religious.","choices":["and examines all group activities","examines all group activities","which examines all group activities","examining all group activities"],"note":false,"a":1,"fix":"","exp":"해석 : 집합적인 각도에서의 인간에 대한 연구인 사회학은, 모든 단체 활동을 연구한다 : 경제적, 사회적, 정치적, 그리고 종교적인 (활동).\n해설 :\n* Sociology, the study of humans in their collective aspect, = (주어)\n* examines = (동사)\n* all group activities = (목적어)\n참고 :\n* 콜론 (:)은 그 앞부분의 어떤 말을 구체적으로 예를 들어 설명하기 위한 것으로서, 콜론의 뒷 부분은 무시해도, 앞 부분만으로 문장이 성립한다.","lesson":9},{"n":243,"type":"error","note":false,"a":2,"fix":"webbed feet","exp":"해석 : 그들은 물갈퀴 달린 발을 가지고 있지 않지만, 쇠물닭은 수영을 매우 잘한다.\n해설 :\n* Even though they do not have webbed feet = (부사절) 그들은 물갈퀴 달린 발을 가지고 있지 않지만.\n* Even though = 부사절 접속사 / they =주어 / do not have = 동사 / webbed feet = 목적어 (물갈퀴 달린 발)\n* gallinules are excellent swimmers = (주절) 쇠물닭은 수영을 매우 잘한다.\n참고 :\n* 유사분사 → 명사+ed = \u003c～가 달린>, \u003c～를 가진> / webbed = 물갈퀴(web)가 달린","lesson":9,"parts":[["",null],["Even","A"],[" though they ",null],["do not","B"],[" have ",null],["webbed foot","C"],[", gallinules are ",null],["excellent","D"],[" swimmers.",null]]},{"n":244,"type":"error","note":false,"a":2,"fix":"temperature","exp":"해석 : 대부분의 포유동물은, 공기 온도가 어떻게 되든지에 상관없이, 비교적 일정한 신체온도를 유지한다.\n해설 :\n* Most mammals = (주어) 대부분의 포유동물. ype":"error","note":false,"a":3,"fix":"originate","exp":"해석 : 허리케인은, 열대지방의 바다물들의 위에서 생겨나는, 그리고 시속 75마일 이상의 바람을 가진, 강한 사이클론이다.\n해설 :\n* Hurricanes are severe cyclones = 허리케인은 강한 사이클론이다.\n* with winds over seventy-five miles an hour = (형용사구) 시속 75마일 이상의 바람을 가진.\n* which originates over tropical ocean waters = (형용사절) 열대지방의 바다물들의 위에서 생겨나는.\n참고 :\n* 관계대명사 which 의 선행사(cyclones) 가 복수이므로 동사에 s 를 붙이지 않는다.\n* 바다, 강, 호수 등을 의미할 때는 water 가 셀 수 있는 명사로서 복수형으로 쓸 수 있다.\n* originate 는 자동사로서 \u003c생겨나다> 의 의미를 가지는 경우가 흔하다.","lesson":9,"parts":[["Hurricanes are ",null],["severe","A"],[" cyclones with winds ",null],["over","B"],[" seventy-five miles ",null],["an","C"],[" hour which ",null],["originates","D"],[" over tropical ocean waters.",null]]},{"n":270,"type":"error","note":false,"a":1,"fix":"necessarily","exp":"해석 : 어떤 하나의 감정이 반드시 외부세계의 어떤 것에 의해서 발생되는 것은 아니다.\n해설 :\n* An emotion = (주어) 어떤 하나의 감정\n* is aroused = (동사 /수동태) 발생되다.\n* not necessarily = (부사) 반드시 ～인 것은 아니다. (not always 와 비슷함).\n* by something in the outside world = (부사구) / 이 경우 outside 는 형용사.\n참고 :\n* emotion (감정)은 일반적으로 셀 수 없는 명사로 취급하지만, 구체적으로 어느 특정한 상황에서 일어나는 구체적인 어떤 감정을 의미할 때는 셀 수 수 있는 명사로서 앞에 an 을 사용한다.\n\n10과","lesson":9,"parts":[["",null],["An","A"],[" emotion is not ",null],["necessary","B"],[" ",null],["aroused","C"],[" by something in the ",null],["outside","D"],[" world.",null]]},{"n":271,"type":"blank","stem":"Sandra Day O'Connor, the first woman member of the United States Supreme Court, -------------------------- interpret the laws rather than attempt to legislate.","choices":["believed the courts that should","believed it that the courts should","believed that the courts should","should believed that the courts"],"note":true,"a":2,"fix":"","exp":"해석 : 미국 대법원의 첫 번째 여자 법관인 Sandra Day O'Connor 는, 사법부는 입법을 하려고 시도하기보다는 오히려 법을 해석해야한다는 것을 믿었다.\n해설 :\n* Sandra Day O'Connor 와 the first woman member of the United States Supreme Court 는 동격으로 문장의 주어.\n* believed = (동사).\n* that the courts should interpret the laws rather than attempt to legislate = (명사절 /목적어) 입법을 하려고 시도하기보다는 오히려 법을 해석해야한다는 것.\n참고 :\n* rather than 의 앞과 뒤에 서로 대응 관계가 되는 말이 와야한다.\n(여기서는 interpret --- 와 attempt --- 가 서로 대응되는 말이다.)","lesson":10},{"n":272,"type":"blank","stem":"It has not been determined how many years sea turtles can live in their natural environment, but they will reach a very old age ---------------------------.","choices":["if they left undisturbed by humans","if undisturbed left by humans","if left them undisturbed by humans","if left undisturbed by humans"],"note":false,"a":3,"fix":"","exp":"해석 : 그들의 자연 환경에서 바다 거북이들이 얼마나 살 수 있는지는 아직 계산 (측정)되지 않았다. 그러나, 그들이 인간에 의해서 방해받지 않고 남겨진다면 그들은 매우 많은 나이까지 도달한다.\n해설 :\n* It = 가주어.\n* has not been determined = (동사) 아직 계산 (측정)되지 않았다.\n* how many years sea turtles can live in their natural environment = (명사절로서 진주어) 그들의 자연 환경에서 바다 거북이들이 얼마나 살 수 있는지.\n* they will reach a very old age = 그들은 매우 많은 나이까지 도달한다. / will 은 미래의 뜻이 아니고 동물의 습성, 경향 등을 표현하는 경우 사용.\n* 능동태에서 If humans leave them undisturbed (5형식)\n                  S     V    O     O.C.\n→ 수동태로 고치면 if (they are) left undisturbed by humans 이 되고, 여기서 괄호친 부분을 생략하면\nif left undisturbed by humans 가 된다.\n참고 :\n* How 로 시작하는 명사절은 다음 2 가지로 구분할 수 있다.\n(1) How S + V ～ →  어떻게 ～하는지.\n(2) How + 형,부 (+명사) + S + V ～ → 얼마나 ～ 하는지.","lesson":10},{"n":273,"type":"error","note":false,"a":2,"fix":"commemorate","exp":"해석 : (동)상, 기념물, 빌딩, 또는 공원은 한 뛰어난 인물을 기념하기 위해서 사용될 수 있다 (헌납될 수 있다).\n해설 :\n* A statue, a monument, a building, or a park = (주어)\n* be dedicated to + \u003c명사 또는 동사 원형> = ～에 헌신하다, ～에게 헌납되다, ～를 위해서 사용되다.\n* to commemorate a distinguished individual = 한 뛰어난 인물을 기념하기 위해서.\n참고 :\n* be dedicated to + \u003c명사>를 사용하는 것도 옳은 모양이지만, 이 문장에서는 commemoration 을 사용하면, 뒤에 있는 명사 a distinguished individual 를 연결할 수가 없다.\n* \u003cto+동사원형>을 사용하면 \u003c부정사>가 되어서 \u003c～하기위해 >, \u003c～하는데> 와 같이 해석되어 문장에 어울린다.","lesson":10,"parts":[["A ",null],["statue","A"],[", a monument, a building, or a park may be ",null],["dedicated","B"],[" to ",null],["commemoration","C"],[" a ",null],["distinguished","D"],[" individual.",null]]},{"n":274,"type":"error","note":false,"a":3,"fix":"thousands","exp":"해석 : 세상의 새들 중에서 수십억이 매년 이주한다, 그리고, 많은 새가 수천 마일의 여행을 간다.\n해설 :\n* Billions of the world's birds = (주어) 세상의 새들 중에서 수십억.\n* migrate = (동사) (새나 동물들이) 이주하다.\n* each year = (부사)\n* 두 번째 절은 and many are on journeys of thousands of miles 의 모양인데, 분사구로 고치면서 \u003c접속사 와 be 동사>가 빠져 버려서 문제와 같은 모양이 된다.\n참고 :\n* 수를 세는 단위 (hundred, thousand, million 등등)은 원래 단수형으로 쓴다.\n  five thousands (X) → five thousand (O)\n* 그러나, 불확실한 숫자를 의미할 때, 즉, \u003c수백, 수천, 수만> 등을 의미할 때는 thousands of birds 와 같이 \u003c단위의 복수형 + of + 복수명사>의 모양을 사용한다.","lesson":10,"parts":[["",null],["Billions of","A"],[" the ",null],["world's","B"],[" birds migrate each year, ",null],["many","C"],[" on journeys of ",null],["thousand","D"],[" of miles.",null]]},{"n":275,"type":"error","note":false,"a":1,"fix":"with","exp":"해석 : 목수는 원래 나무만을 가지고 작업을 했었다. 그러나, 지금은 플라스틱, 유리, 경금속과 같은 그러한 재료들을 사용해야한다.\n해설 :\n* The carpenter 가 주어이며 동사는 두 번 있음. → worked 와 must be able to use\n* originally = (부사) 원래.\n* worked only with wood, but now must be able to use\n* materials such as plastics, glass, and light metals = 플라스틱, 유리, 경금속과 같은 그러한 재료들.\n참고 :\n* 어떤 재료를 \u003c가지고서> 작업할 때, 전치사는 with를 사용함.\n* plastic 은 일반적으로 형용사로 사용하며, 명사일 경우는 주로 s를 붙이고 단수 취급한다.\n* (D)의 glass 를 복수형으로 쓰지 않은 이유는, 물질명사이며 glasses 로 쓰면 유리잔(복수형)이 되기 때문이다.","lesson":10,"parts":[["",null],["The carpenter","A"],[" originally worked only ",null],["by","B"],[" wood, but now must ",null],["be able","C"],[" to use materials such as plastics, ",null],["glass","D"],[", and light metals.",null]]},{"n":276,"type":"blank","stem":"A radome, a giant inflated dome, contains instruments that transmit messages ------------------------.","choices":["by way to orbit satellites","by way of orbiting satellites","by orbiting satellites of way","of orbiting satellites by way"],"note":true,"a":1,"fix":"","exp":"해석 : 공기를 넣어 부풀릴 수 있는 거대한 돔인 레이돔은, 궤도를 도는 위성을 이용해서 메시지를 전달하는 도구를 가지고 있다.\n해설 :\n* A radome 과 a giant inflated dome 은 동격으로 주어.\n* inflated = (형용사) 공기를 넣어 부풀릴 수 있는.\n* contains = (동사) ～를 포함한다. ～를 가지고 있다.\n* instruments = (목적어) 도구, 장비.\n* that transmit messages by way of orbiting satellites = (관계대명사절로서 앞의 명사 instruments를 수식) 궤도를 도는 위성을 이용해서 메시지를 전달하는.\n* 관계대명사절 안에서 주어 = that / 동사 = transmit / 목적어 = messages.\n참고 :\n* by way of ～= ～라는 방법으로, ～를 이용해서.\n* radome = 레이돔. (공기를 넣어 부풀릴 수 있는 항공기의 덮개)","lesson":10},{"n":277,"type":"blank","stem":"The tamarind is an attractive tropical tree -------------------- seventy-five feet.","choices":["and that may grow as tall as","that may grow tall as much as","that may grow as tall as","that may grow as tall as much"],"note":false,"a":2,"fix":"","exp":"해석 : 타마린드는 75 피트의 높이까지 자라는 매력적인 열대나무이다.\n해설 :\n* The tamarind = (주어) 타마린드 (열대성 상록수의 일종)\n* is = (동사)\n* an attractive tropical tree = (보어) 매력적인 열대나무.\n* that may grow as tall as seventy-five feet = (관계대명사절로서 앞의 명사 tree 를 수식) 75피트의 높이까지 자라는.\n참고 :\n* 여기서 as -- as --를 사용하지 않는다면, that may grow seventy-five feet tall 이라고 표현한다.\n* as -- as --를 사용하는 이유는 75피트가 매우 높다는 것을 강조하기 위함.\u003c문법정리 6>참조.","lesson":10},{"n":278,"type":"error","note":false,"a":0,"fix":"a short-handed","exp":"해석 : 검(긴 칼)은 짧은 손잡이를 가지고, 긴 날을 가진 무기인데, 단검과 비슷하지만 더 길다.\n해설 :\n* A sword = (주어) 검(긴 칼, 장검).\n* is = 동사.\n* a short-handed, long-bladed weapon = (보어) → \u003c a + 형, 형 + 명사 >의 모양. 짧은 손잡이를 가지고, 긴 날을 가진 무기 / 여기서 유사분사 두 개 short-handed 와 long-bladed 가 형용사 역할을 함.\n* 컴마 이하의 부분은 (which is) similar to a dagger but larger = 그런데 그것은 단검과 비슷하지만 더 길다. (괄호 부분 생략)\n참고 :\n* 유사분사 \u003c형용사-명사ed> = \u003c어떠한 ～를 가진>→ 하이픈으로 연결하며 형용사로 취급한다.\n(예) short-handed = 짧은 손잡이를 가진 / long-bladed = 긴 날을 가진.\u003c문법정리 8>참조.","lesson":10,"parts":[["A sword is ",null],["short-handed","A"],[", long-bladed weapon, ",null],["similar","B"],[" to a dagger ",null],["but","C"],[" ",null],["larger","D"],[".",null]]},{"n":279,"type":"error","note":false,"a":3,"fix":"bacteria","exp":"해석 : 저온 살균법은 우유에 있는 박테리아를 죽이는 하나의 열처리 과정이다.\n해설 :\n* Pasteurization = (주어) 저온 살균법\n* is = 동사\n* a heating process (that kills bacteria in milk) = (보어) 우유에 있는 박테리아를 죽이는 하나의 열처리 과정\n참고 :\n* bacteria 는 복수형이고 단수형은 bacterium 이다.\n* 비슷한 예 : datum →data  / spectrum→ spectra / millennium→ millennia","lesson":10,"parts":[["",null],["Pasteurization","A"],[" is a ",null],["heating","B"],[" process ",null],["that","C"],[" kills ",null],["bacterias","D"],[" in milk.",null]]},{"n":280,"type":"error","note":false,"a":0,"fix":"whose","exp":"해석 : 그의 노래가 강한 활력과 대단한 품위를 결합한, Mahalia Jackson 은 미국에서 가장 잘 알려진 가스펠 가수들 중의 하나였다.\n해설 :\n* Mahalia Jackson = (주어)\n* whose singing combined powerful vitality with great dignity = (관계대명사절) 그 안에서 주어 = whose singing (그의 노래) / 동사 = combined (결합했다)\n* combine A with B = A와 B를 결합하다.\n* was = (동사)\n* one of the best-known gospel singers in the United States = (보어)\n참고 :\n* 관계사 whose 는 반드시 그 뒤의 명사와 결합하여 하나의 역할을 한다.","lesson":10,"parts":[["Mahalia Jackson, ",null],["who","A"],[" singing ",null],["combined","B"],[" powerful vitality ",null],["with","C"],[" great dignity, was one of the ",null],["best-known","D"],[" gospel singers in the United States.",null]]},{"n":281,"type":"blank","stem":"---------------------------- out of soil, reclamation procedures are needed to restore the land's productivity.","choices":["If salt concentrations are not leached","If salt concentrations not leached","If not leached salt concentrations","If there are salt concentrations and not leached"],"note":true,"a":0,"fix":"","exp":"해석 : 소금기가 농축된 것이 흙으로부터 여과되어지지 않으면, 그 땅의 생산성을 회복하기 위해서 재생과정이 요구된다.\n해설 :\n* If salt concentrations are not leached out of soil = (부사절)\n* salt concentrations = 소금기가 농축된 것.\n* leach = 거르다, 여과해서 빼내다.\n* out of soil = 흙으로부터.\n* reclamation procedures are needed to restore the land's productivity = (주절)\n* reclamation procedures = 재생(재 개간)과정.\n* to restore the land's productivity = (부정사의 부사적 용법) 그 땅의 생산성을 회복하기 위해서.\n참고 :\n* \u003c～로부터> 의 의미로서 사용하는 from 과 out of 의 비교.\n  from = 동작의 출발점. / out of = ～로부터 밖으로.","lesson":10},{"n":282,"type":"blank","stem":"Not only ------------------------ mechanical switches, they also are free of arcing and mechanical wear.","choices":["electronic switches are faster than","are electronic switches faster than","are faster electronic switches than","there are electronic switches faster than"],"note":false,"a":1,"fix":"","exp":"해석 : 전기 스위치는 기계스위치보다 빠를 뿐만 아니라, 그들은 역시, 구부러짐 과 기계적인 마모에서도 벗어난다.\n해설 :\n* 부정의 부사의 도치법 → 주어는 electronic switches 이고, 동사는 are 인데, 도치법에 의해 be동사인 are 를 주어 앞으로 옮겼다.\nNot only are electronic switches faster than mechanical switches = 전기스위치는 기계스위치보다 빠를 뿐만 아니라.\n* they also are free of arcing and mechanical wear = 그들은 역시 구부러짐과 기계적인 마모에서 벗어난다.\n* be free of ～= ～로부터 벗어나다, ～의 영향을 받지 않다, ～를 가지지 않다.\n* arcing = 활 모양처럼 구부러짐, 휘어짐.\n참고 :\n* 부정의 부사의 도치법(도치법 제 1번) = 동사를 수식하는 부정의 부사(구, 절)가 문장의 앞에 오면 조동사나 be동사를 주어의 앞에 옮겨 쓴다.\n* Not only --- but also --- 의 도치법의 경우는 접속사 but 대신에 컴마(,) 나 세미콜론(;)을 사용해도 된다.","lesson":10},{"n":283,"type":"error","note":false,"a":0,"fix":"Although","exp":"해석 : Davy Crockett 은 주목받는 국회의원이었지만, 그는 개척지에서의 그의 영웅적인 위업으로 더 유명했다.\n해설 :\n* Although Davy Crockett was a noted congressman = (부사절)\n* noted = (형) 주목받는, 유명한.\n* he was more famous for his heroic feats on the frontier = (주절)\n* feat = 위업, 공적, 묘기.\n* on the frontier = 개척지에서.\n참고 :\n* However 는 부사(접속부사)이므로 두 개의 절을 연결하는데 사용하지 못한다. 그러므로 접속사인 although 로 바꾼다.\n\n* however 의 용법\n\n(1) 두 문장의 연결(절과 절의 연결)에서\n    -- Terry was a smart student ; however, she couldn't solve the problem.\n    -- Terry was a smart student, however, she couldn't solve the problem. (X)\n* however 는 접속사가 아니므로 절과 절의 연결에 사용할 수 없고, 따라서 절과 절 사이에 접속사의 역할을 하는 세미콜론을 사용한다. however 의 뒤에는 반드시 컴마를 사용함.\n\n(2) 독립된 문장의 맨 앞에  (however 의 뒤에는 반드시 컴마를 사용함)\n    -- Terry was a smart student. However, she couldn't solve the problem.\n\n(3) 독립된 문장에서, 문장 중간에  (반드시 양쪽에 컴마를 사용함)\n    -- Terry was a smart student. She, however, couldn't solve the problem.","lesson":10,"parts":[["",null],["However","A"],[" Davy Crockett was a ",null],["noted","B"],[" congressman, he was ",null],["more","C"],[" famous for his heroic feats on ",null],["the frontier","D"],[".",null]]},{"n":284,"type":"error","note":false,"a":3,"fix":"it","exp":"해석 : 바니쉬(니스칠)은 그것이 마를 때, 단단하고 윤기나는 막을 남긴다.\n해설 :\n* A varnish = (주어)\n* leaves = (동사)\n* a hard, glossy film = (목적어)\n* when it dries = (부사절) 그것이 마를 때.\n참고 :\n* 형용사 두 개를 병렬 연결하여 명사를 수식할 때는 and 없이 컴마로만 연결하는 경우가 가장 흔하다. (형용사의 연결법)\n* 즉, \u003c a hard and glossy film >보다는 오히려 \u003c a hard, glossy film > 의 표현이 더 흔하다.","lesson":10,"parts":[["A varnish ",null],["leaves","A"],[" a ",null],["hard","B"],[", ",null],["glossy","C"],[" film when ",null],["they","D"],[" dries.",null]]},{"n":285,"type":"error","note":false,"a":0,"fix":"for","exp":"해석 : 수년동안 Lois Weber 는 미국의 영화 감독분야에서 지속적으로 성공적이었던 유일한 여자였다.\n해설 :\n* Lois Weber was (for many years) the only woman --- = Lois Weber 는 수년동안 ---했던 유일한 여자였다.\n* 그 뒤에는 (who was) consistently successful in the field of motion picture direction in the United States 에서 밑줄친 부분을 생략한 것으로 볼 수 있다.\n→ 미국의 영화 감독분야에서 지속적으로 성공적이었던. \u003c문법정리 1>참조.\n참고 : * during + 특정 기간 / for + 시간의 크기","lesson":10,"parts":[["Lois Weber was ",null],["during","A"],[" many years ",null],["the","B"],[" only woman consistently ",null],["successful","C"],[" in the field of motion picture ",null],["direction","D"],[" in the United States.",null]]},{"n":286,"type":"blank","stem":"The purpose of inductive logic is -------------------- from particular occurrences.","choices":["general laws to infer","to general laws infer","to infer general laws","to inferring general laws"],"note":true,"a":2,"fix":"","exp":"해석 : 귀납적 논리의 목적은 특정한 사건으로부터 일반적인 규칙을 추리하는 것이다.\n해설 :\n* The purpose of inductive logic = (주어) 귀납적 논리의 목적.\n* is = 동사.\n* to infer general laws from particular occurrences = (보어 / 부정사의 명사적 용법) 특정한 사건으로부터 일반적인 규칙을 추리하는 것.\n참고 :\n* (D)에서 to 를 빼고, 동명사(inferring)를 사용해도 문법적으로는 맞지만, 현대영어에서 목적, 기능 등을 표현할 때는 동명사보다는 부정사를 사용하는 경우가 더 흔하다.","lesson":10},{"n":287,"type":"blank","stem":"The brown thrasher is not a particularly large or strong bird, --------------------- fighting.","choices":["nor is it equipped for","neither is it equipped for","nor it is equipped for","but also it is equipped for"],"note":false,"a":0,"fix":"","exp":"해석 : 북미산 명금은 특히 크거나 힘센 새가 아니며, 그것은 전투를 위해 (신체조건이) 갖추어져 있지도 않다.\n해설 :\n* nor 는 등위접속사로서 양쪽에 절(주절)을 가질 수 있다. 또한 nor는 부정의 부사이므로 그 뒤에 오는 절은 도치법을 사용한다. \u003c nor = and + not >\n* The brown thrasher is not a particularly large or strong bird = 북미산 명금은 특히 크거나 힘센 새가 아니다.\n* nor is it equipped for fighting = (도치법 사용) 그리고 그것(새)은 전투를 위해 (신체조건이) 갖추어져 있지도 않다.\n* be equipped for ～= ～를 하기위해 (시설, 신체조건 등이) 갖추어져 있다.\n참고 :\n* neither -- nor -- 의 모양으로 부분적인 요소를 연결할 때는 nor 뒷 부분에 절이 오지 않아도 되지만, 절과 절을 연결할 때는 nor 의 앞과 뒤에 절이 오며 뒷부분은 반드시 도치법을 사용한다.","lesson":10},{"n":288,"type":"error","note":false,"a":1,"fix":"been deterred","exp":"해석 : Charles Lindbergh 는 기자들에게, 다른 사람들은 실패했지만 자신은 대서양을 혼자 건너가려는 시도로부터 방해받은 적이 없었다고 말했다.\n해설 :\n* Charles Lindbergh told reporters 는 기자들에게 말했다.\n* that 이하의 명사절은 문장 전체의 목적어.\n* he had never been deterred = 그는 방해받은 적이 없었다.\n* from attempting to cross the Atlantic alone = 대서양을 혼자 건너가려는 시도로부터.\n* even though others had failed =(부사절) 다른 사람들은 실패했지만.\n참고 :\n* deter는 타동사이므로 수동태로 써야지 \u003c방해받다>의 의미가 되고, 따라서 be 동사가 필요함.","lesson":10,"parts":[["Charles Lindbergh told ",null],["reporters","A"],[" that he had never ",null],["deterred","B"],[" from attempting ",null],["to cross","C"],[" the Atlantic alone even though others had ",null],["failed","D"],[".",null]]},{"n":289,"type":"error","note":false,"a":0,"fix":"What","exp":"해석 : P. Henry 의 이야기에서 가장 감동적인 것은, 그것(그 용기)를 가지고서 보통사람들이 그들의 품위를 지키려고 노력하는 바로 그 용기이다.\n해설 :\n* What is most touching in P. Henry's stories = (명사절로서 주어)\n* touching = (형용사) 감동적인.\n* is = 동사\n* the gallantry (with which ordinary people struggle to maintain their dignity) = (보어 / 괄호친 부분은 관계대명사절로서 앞의 명사를 수식함) 그것(그 용기)를 가지고서 보통사람들이 그들의 품위를 지키려고 노력하는 바로 그 용기.\n* 관계대명사절 안에서 독립적으로 해석하면 →그것(용기)를 가지고서 보통사람들이 그들의 품위를 지키려고 노력한다.\n참고 :\n* 관계대명사 what 은 명사절을 이끌며 이 명사절은 문장 전체에서 주어, 목적어, 보어 등의 역할을 한다.","lesson":10,"parts":[["",null],["That","A"],[" is most ",null],["touching","B"],[" in P. Henry's stories is the gallantry ",null],["with","C"],[" which ordinary people ",null],["struggle","D"],[" to maintain their dignity.",null]]},{"n":290,"type":"error","note":false,"a":0,"fix":"A grass-eating","exp":"해석 : 초식성이고 강에 거주하는 하나의 포유동물인 하마는 돼지와 친척이다.\n해설 :\n* A grass-eating, river-dwelling mammal 와 the hippopotamus 는 동격으로 주어.\n* grass-eating = 초식성 / river-dwelling = 강에 거주하는 / mammal = 포유동물.\n* is related to = 와 혈연 관계가 있다, 와 친척이다.\n* the hippopotamus 나 the pig 처럼 \u003cthe + 동물의 단수>는 대표단수(대표 명사)로 흔히 사용됨.\n참고 :\n* grass-eating, river-dwelling 같은 표현은 하이픈을 이용한 형용사 (유사분사의 일종)","lesson":10,"parts":[["",null],["Grass-eating","A"],[", river-dwelling mammal, ",null],["the","B"],[" hippopotamus is ",null],["related","C"],[" to ",null],["the pig.","D"],["",null]]},{"n":291,"type":"blank","stem":"------------------------- is faceted that its brilliance and beauty are revealed to the eye.","choices":["Only when a rough diamond","It is when only a rough diamond","Only it is when a rough diamond","It is only when a rough diamond"],"note":true,"a":3,"fix":"","exp":"해석 : 가공되지 않은 다이아몬드가 면이 깎여졌을 때만이, 그것의 화려함과 아름다움이 (사람의) 눈에 드러난다.\n해설 :\n* It is --- that --- 의 강조구문 → It is 와 that 을 생략하면 나머지 부분만으로 문장이 구성된다.\n* It is 와 that 을 생략하고 나머지 부분만의 문장구성을 보면\n→ only when a rough diamond is faceted = (부사절)  /  its brilliance and beauty are revealed to\nthe eye = (주절)\n*  only when S + V -- = ～했을 때만이, ～하고서야 비로소.\n* a rough diamond = 가공되지 않은 다이아몬드.\n* is faceted = 면이 깎여지다.\n* its brilliance and beauty = 그것의 화려함과 아름다움.\n* are revealed to the eye = (사람의) 눈에 드러난다 (보여진다).\n참고 :\n강조구문에서 It is 와 that 의 사이에 오는 말은 주로 \u003c고유명사>, \u003c대명사>, \u003c부사(구,절)> 등이며, 만약 형용사나 분사가 오면 그 문장은 강조구문이 아니고 가주어 용법이다.","lesson":10},{"n":292,"type":"blank","stem":"Fairs that were held to improve farming methods have been -------------------------------- the United States.","choices":["very important agricultural historical of","very important in the agricultural history of","very importantly in the history of agricultural in","very importance in historical agriculture in"],"note":false,"a":1,"fix":"","exp":"해석 : 농사 방식을 개선시키기 위해서 개최된 장터들은 미국의 농업 역사에 있어서 매우 중요했다.\n해설 :\n* Fairs (that were held to improve farming methods) = (주어) 농사 방식을 개선시키기 위해서 개최된 장터들.\n* fair = 장터, 박람회.\n* have been = (동사)\n* very important = (보어)\n* in the agricultural history of the United States = (부사구) 미국의 농업 역사에 있어서\n참고 :\n* hold 는 \u003c(식이나 행사 등을) 개최하다>의 의미로 사용될 때 타동사이고, \u003c개최되다>는 수동태\n(be held)로 쓴다.","lesson":10},{"n":293,"type":"error","note":false,"a":3,"fix":"dates from","exp":"해석 : 샌들은 가장 초창기 형태의 신발에 속하며, 그 기원이 선사시대까지 거슬러 올라간다.\n해설 :\n* The sandal = (주어) 샌들(슬리퍼 신발) 대표단수.\n* be among ～ = ～에 속하다.\n* the earliest forms of footwear = 가장 초창기 형태의 신발.\n* 컴마 이하 and dates from prehistoric times 에서 주어는 문장 맨앞의 the sandal 이 공통주어이다.\n* 만약 분사구로 고치려면 우선 and 를 빼야하고, 동사를 현재분사로 고쳐서 컴마 이하는 dating from --- 의 형태가 된다. 즉, 문제에서 and 가 없다면 옳은 문장이 된다.\n* date from ～ =  그 기원이 ～시대(때)까지 거슬러 올라간다.","lesson":10,"parts":[["",null],["The","A"],[" sandal is ",null],["among","B"],[" the earliest ",null],["forms","C"],[" of footwear, and ",null],["dating from","D"],[" prehistoric times.",null]]},{"n":294,"type":"error","note":false,"a":2,"fix":"of","exp":"해석 : 나자식물들은 번식적인 목적을 위해서 물에서 벗어난 첫 번째 식물이었다.\n해설 :\n* The gymnosperms = (주어) 나자식물.\n* were = 동사.\n* the first plants to be independent of water = 물에서 벗어난 첫 번째 식물.\n* be independent of ～= ～로부터 벗어나다, ～로부터 독립하다.\n* for reproductive purposes = 번식적 목적을 위해서.\n참고 :\n* ～했던 첫 번 째 (사람, 사물)은 \u003c the first (명) + to V -- > 로 표현한다.","lesson":10,"parts":[["The gymnosperms were the first ",null],["plants","A"],[" to ",null],["be","B"],[" independent ",null],["from","C"],[" water for reproductive ",null],["purposes","D"],[".",null]]},{"n":295,"type":"error","note":false,"a":0,"fix":"cast","exp":"해석 : 표류화물은, 곤란 "type":"error","note":false,"a":1,"fix":"found","exp":"해석 : 지렁이는 많은 지리학적인 지역의 습하고, 더운 흙에서 발견되는 하나의 벌레이다.\n해설 :\n* The earthworm is a worm [ (which is) found in moist, warm soil in many geographical areas ].\n* 대괄호[  ]부분이 관계대명사절이고 그 안에서 소괄호( ) 부분이 생략된 것으로 볼 수 있음.\n* earthworm = 지렁이.\n* worm = 벌레.\n* in moist, warm soil = 습하고, 더운 흙에서. 형용사의 연결법 두 개의 형용사가 뒤에 있는 명사를 수식할 때는 두 형용사 사이에 컴마로 연결하는 것이 현대 영어에서 가장 흔한 방식이다.\n* many geographical areas = 많은 지리학적인 지역.\n참고 :\n* geographical areas (지리학적인 지역)으로 표현하는 이유는, 지역을 분류할 때 여러 가지 방식 (지리적 분류, 인종적 분류, 종교적 분류 . . .) 이 있는데 그 중에서 지리적인 분류를 하였을 경우를 의미하기 위함.","lesson":10,"parts":[["",null],["The","A"],[" earthworm is a worm ",null],["that found","B"],[" in ",null],["moist, warm","C"],[" soil in many ",null],["geographical","D"],[" areas.",null]]},{"n":299,"type":"error","note":false,"a":2,"fix":"distant","exp":"해석 : 한 쌍의 쌍안경의 초점이 맞춰졌을 때, 멀리 있는 물체가 시야에 들어올 수 있다.\n해설 :\n* When the focus of a pair of binoculars is adjusted = (부사절)\n* binoculars = 쌍안경.\n* the focus is adjusted = 초점이 맞춰지다.\n* distant objects can be brought into view = (주절) 멀리 있는 물체가 시야에 들어올 수 있다.\n* be brought into view = 시야에 들어오다.\n→ 능동태의 모양은 S + brings + O + into view. = S가 O를 시야에 들어오게 만들다.\n참고 :\n* 안경, 쌍안경, 바지, 가위 등등의 말은 수를 표현할 때 \u003ca pair of + 복수형>을 사용함.\n* a pair of glasses = 단수취급. / two pairs of glasses = 복수취급.","lesson":10,"parts":[["When the focus of ",null],["a pair","A"],[" of binoculars ",null],["is","B"],[" adjusted, ",null],["distance","C"],[" objects can be brought ",null],["into view","D"],[".",null]]},{"n":300,"type":"error","note":false,"a":3,"fix":"established","exp":"해석 : 미국 대법원의 세 번째 대법원장인 Oliver Ellsworth 는 연방 사법제도를 설립한 그 법안을 만든 사람이었다.\n해설 :\n* Oliver Ellsworth 와 the third chief justice of the United States Supreme Court 는 동격으로 주어.\n* chief justice of the United States Supreme Court = 미국 대법원의 대법원장.\n* was = 동사\n* the author of the bill (that established the federal court system) = (보어) 연방 사법제도를 설립한 그 법안을 만든 사람.\n* the author of the bill = 그 법안을 처음 만든 사 t 의 뒤에 오는 말이 모양이 대응되지 못한다.","lesson":13,"parts":[["Matthew C. Perry, ",null],["a","A"],[" United States ",null],["naval","B"],[" commander, gained ",null],["fame","C"],[" ",null],["in not","D"],[" war but through diplomacy.",null]]},{"n":364,"type":"error","note":false,"a":2,"fix":"affect","exp":"해석 : 대부분의 심리학적인 연구에 따르면, 바디 랭귀지는 말하는 이의 감정과 태도를 표현한다, 그리고 그것은 듣는 이의 감정과 태도에 영향을 주는 경향이 있다.\n해설 :\n* According to most psychological studies = (부사구) 대부분의 심리학적인 연구에 따르면.\n* body language expresses a speaker's emotions and attitudes = 바디 랭귀지는 말하는 이의 감정과 태도를 표현한다.\n* and it also tends to affect the emotions and attitudes of the listener = 그리고 그것은 듣는 이의 감정과 태도에 영향을 주는 경향이 있다.\n참고 :\n* affect = (동사) 영향을 주다. / effect 가 동사이면 \u003c ～를 발생시키다>,이고\n명사이면 \u003c영향, 효과>.","lesson":13,"parts":[["According to most psychological studies, body language expresses a speaker's ",null],["emotions","A"],[" and attitudes, and ",null],["it","B"],[" also tends to ",null],["effect","C"],[" the emotions and attitudes of ",null],["the listener","D"],[".",null]]},{"n":365,"type":"error","note":false,"a":3,"fix":"until","exp":"해석 : 건조된 잎들이, 새 잎들이 나타날 때까지, 어떤 활엽수의 가지에 계속 매달려있다.\n해설 :\n* Dried leaves = (주어)\n* continue to hang on the branches of some deciduous trees =\n* until the new leaves appear = (부사절)\n참고 :\n* by the time  S + V ～ = ～할 때까지 어떤 일이 완료되는 경우.\n* until S + V ～ =  ～할 때까지 어떤 일이 계속되는 경우.\n* by the time 과 until 둘 다 부사절 접속사.","lesson":13,"parts":[["",null],["Dried","A"],[" leaves continue ",null],["to hang","B"],[" on the branches of ",null],["some","C"],[" deciduous trees ",null],["by the time","D"],[" the new leaves appear.",null]]},{"n":366,"type":"blank","stem":"-------------------, a frog undergoes a true metamorphosis beginning with a fishlike larval stage.","choices":["While the course is growing","While the course of its growth","During the course is growing","During the course of its growth"],"note":true,"a":3,"fix":"","exp":"해석 : 그것의 성장의 과정에서, 개구리는 물고기 같은 유충단계로 시작하는 진정한 변태(완전변태)를 겪는다.\  and jump far = (목적격보어)","lesson":13},{"n":378,"type":"error","note":false,"a":2,"fix":"be spun","exp":"해석 : 털과 양모의 섬유질들은 연속적이 아니므로, 그들이 직물로 짜여지려면, 일반적으로 꼬여져서 실이 되어야한다.\n해설 :\n* Fibers of hair and wool = (주어)\n* are = (첫째동사)\n* not continuous = 연속적이 아니다.\n* must be spun = (둘째 동사 /수동태) 꼬여져야 한다. / spun = spin 의 과거분사.\n* normally = (부사) 일반적으로.\n* must be spun into thread = 꼬여져서 실이 되어야한다.\n* into 는 변화의 전치사. (앞의 것이 변해서 뒤의 것으로 될 때 사용)\n* if they are to be woven into textile fabrics = 그들이 직물로 짜여지려면.\n참고\n* if 절안에서 be to V 의 모양은 대개, \u003c～하려면>으로 해석한다.","lesson":13,"parts":[["Fibers of hair and wool ",null],["are","A"],[" not ",null],["continuous","B"],[" and must normally ",null],["spun","C"],[" into thread if they ",null],["are to be","D"],[" woven into textile fabrics.",null]]},{"n":379,"type":"error","note":false,"a":2,"fix":"built","exp":"해석 : 바위가 많은 New England 의 해안을 따라서 모래와 자갈로된 해안지역들이 있다, 그런데 그 중에서 일부는 빙하의 잔재물로부터 만들어졌고 또 다른 것들은 바다 폭풍의 활동에 의해서 만들어졌다.\n해설 :\n* 도치법 제 4번 - \u003c부사+ 자동사+ 주어> 의 어순.\n* Along the rocky New England coast = (부사구) 바위가 많은 New England 의 해안을 따라서.\n* are = (동사 / 자동사) ～가 있다.\n* small areas of sand and gravel beach = (주어) 모래와 자갈로된 해안지역들.\n\n* 첫 번째 컴마 뒤의 부분을 독립된 문장으로 만들어보면 다음과 같이 되는데,\nSome (were) created from glacial debris, (and) others (were) built up by the action of ocean storms.\n이 문장을 분사구로 만들어서 앞의 문장에 연결하면 be 동사인 were 가 둘 다 빠지고 and 도 없어져서 문제의 문장과 같이 된다.\n* glacial debris = 빙하의 잔재물.\n* action of ocean storms = 바다 폭풍의 활동.\n참고 :\n* 두 개의 문장을 접속사를 사용하지 않고 연결할 때, 한쪽의 동사를 분사로 고쳐서 나머지 한쪽에 연결하는 방법을 분사구라고 한다.","lesson":13,"parts":[["Along the rocky New England ",null],["coast","A"],[" are small areas of sand and gravel beach, some ",null],["created","B"],[" from glacial debris, others ",null],["build","C"],[" up ",null],["by","D"],[" the action of ocean storms.",null]]},{"n":380,"type":"error","note":false,"a":2,"fix":"cultivate","exp":"해석 : 문명은, \u003c불을 다루고, 농작물을 경작하고, 동물을 훈련시키고, 영구적인 집을 짓는 인간의 능력>으로부터 생겨났다.\n해설 :\n* Civilization = (주어)\n* resulted f 해서 화를 내고 자신들을 남들로부터 고립시키려고 노력한다.\n해설 :\n* Many people = (주어) 이 문장은 주어 하나에 동사가 두 번 있음. (feel -- / try --)\n* at times = (부사) 때때로.\n* feel exasperated = (첫째 동사) 화를 내다.\n* at incessant social demands on their personal lives = 그들의 개인적인 생활에 대한 끊임없는 사회적 요구에 대해서.\n* try to isolate themselves from others = 자신들을 남들로부터 고립시키려고 노력한다.\n참고 :\n* \u003c～에 대해서 화를내다.>는 전치사 at 을 흔히 사용함.","lesson":14},{"n":407,"type":"blank","stem":"There are many copper mines in the state of Arizona, ----------------- to the state's economy.","choices":["a fact which contributes significantly","which is a fact contributes significantly","while a fact contributes significantly","there is a fact contributing significantly"],"note":false,"a":0,"fix":"","exp":"해석 : 아리조나주에는 많은 구리 광산이 있는데, 이것은 그 주의 경제에 대단히 기여하는 하나의 사실이다.\n해설 :\n* There are many copper mines in the state of Arizona = (주절) 아리조나주에는 많은 구리 광산이 있다.\n* a fact = (앞의 문장 전체와의 동격) 하나의 사실.\n* which contributes significantly to the state's economy = (a fact 를 수식하는 관계대명사절) 그 주의 경제에 대단히 기여하는.\n* contributes to～ = ～에 기여하다, 공헌하다.\n* significantly = (부사) 대단히, 의미심장하게, 중요하게.\n참고 :\n* \u003c동사+ 전치사>로 사용되는 말들은 흔히 그 전치사 앞에 부사를 넣어 수식한다. 이 문장에서 contributes significantly to 의 모양.","lesson":14},{"n":408,"type":"error","note":false,"a":3,"fix":"regions","exp":"해석 : 쇠고기용 소(식용 소)는 어떤 지리학적인 지역에서는 경제 성장을 위해 모든 가축 중에서 가장 중요한 가축이다.\n해설 :\n* Beef cattle = (주어) 쇠고기를 얻기 위해 기르는 소.\n* cattle 은 people 과 같은 집합명사로서 자체가 복수이다.\n* are = (동사)\n* the most important of all livestock = (보어) 모든 가축 중에서 가장 중요한 가축.\n* for economic growth = (부사구) 경제 성장을 위해.\n* in certain geographic regions = (부사구) 어떤 지리학적인 지역에서는.\n* region 은 셀 수 있는 명사이므로 앞에 관사나 소유격 등의 한정사가 없을 때는 복수형으로 쓴다.\n참고 :\n* 서수와 최상급 뒤의 명사를 생략할 수 있다. → (최상급 + of + all + 명사) 의 모양에서 최상급 뒤에도 원래 같은 명사가 있었는데, 현대 영어에서는 이 때 그 명사를 생략하는 것이 정석이다.\n* of all 뒤에 livestock 이 있으므로 important 뒤에는 livestock 이 생략된다.","lesson":14,"parts":[["Beef cattle ",null],["are","A"],[" the most ",null],["important","B"],[" of all ",null],["livestock","C"],[" for economic growth in certain geographic ",null],["region","D"],[".",null]]},{"n":409,"type":"error","note":false,"a":3,"fix":"were built","exp":"해석 : 캘리포니아로 가는 Donner Pass 길에 있는 강의 여울에 정착되었던, 리노라는 도시는, 철도와 교량이 건설됨에 따라서, 성장했다.\n해설 :\n* Having been settled at a river ford on the Donner Pass route to California = (분사구) = 캘리포니아로 가는 Donner Pass 길에 있는 강의 여울에 정착되었던.\n* the city of Reno, which people had settled at -------, grew ------. 와 같은 원래의 문장에서 (which 는 목적어) 밑줄부분을 수동태로 고치면 →\n* the city of Reno, which had been settled at -------, grew ------. 가 되고, 이것을 분사구로 고칠 때 which 는 없어지고, 동사가 주절의 동사 grew 보다 앞선 시제이므로 having been settled 로 바뀐다. →\n* 따라서 the city of Reno, having been settled at -------, grew ------. 와 같이 되는데, 다시 밑줄 부분을 문두로 옮기면 원래 문제의 모양이 된다.\n* the city of Reno grew = (주절) 리노라는 도시는 성장했다.\n* as bridges and railroads were built = (부사절) 철도와 교량이 건설됨에 따라서.\n참고 :\n* 분사구 만들기에서 분사구로 만들려는 동사가 주절보다 앞선 시제이면 having P.P.\n(수동태에서는 having been P.P. )로 고친다.","lesson":14,"parts":[["",null],["Having been","A"],[" settled at a river ford ",null],["on the","B"],[" Donner Pass route to California, the city ",null],["of","C"],[" Reno grew as bridges and railroads ",null],["are built","D"],[".",null]]},{"n":410,"type":"error","note":false,"a":1,"fix":"been 을 뺀다.","exp":"해석 : dawn redwood 라는 나무는 전세계의 북부 숲에서 약 1억년전에 번창했던 것처럼 보인다.\n해설 :\n* The dawn redwood = (주어)\n* appears to V = (동사) ～인 것처럼 보이다.\n* to have P.P. 를 사용한 이유는 \u003cappear 보이다>라는 동작보다 번창했던 동작이 먼저 일어난 일이므로.\n* appears to have flourished = 번창했던 것처럼 보인다.\n* flourish 는 여기서 자동사이므로 수동태로 쓸 이유가 없다.\n* some 100 million years ago = (부사구) 약 1억년전에.\n* in northern forests around the world = (부사구) 전세계의 북부 숲에서.\n참고 :\n* to have P.P. 는 주동사 보다 먼저 일어난 일을 표현하는 방법.","lesson":14,"parts":[["The dawn redwood ",null],["appears","A"],[" to have ",null],["been","B"],[" flourished ",null],["some","C"],[" 100 million years ",null],["ago","D"],[" in northern forests around the world.",null]]},{"n":411,"type":"blank","stem":"Over the ages, the human diet has been influenced ------------- but by technological advances as well.","choices":["not by demographic factors only","by not only demographic factors","not only by demographic factors","demographic factors not only by"],"note":true,"a":2,"fix":"","exp":"해석 : 오랜 세월에 걸쳐서, 인간의 식사는 인국통계학적인 요소에 의해서 뿐만 아니라 기술적인 발전에 의해서도 역시. 영향을 받아왔다.\n해설\n* Over the ages + (부사구) 오랜 세월에 걸쳐서.\n* the human diet has been influenced = (주어+ 동사/수동태) 인간의 식사는 영향을 받아왔다.\n* not only by demographic factors = 인국통계학적인 요소에 의해서 뿐만 아니라.\n* but by technological advances as well = 기술적인 발전에 의해서도 역시.\n참고\n* not only --but also-- 의 모양에서는 also를 생략해도 되고, also 대신 문장 뒤에\nas well 을 사용하기도 한다.","lesson":14},{"n":412,"type":"blank","stem":"Coral reefs owe their brilliant colors ----------------- in symbiosis with coral polyps.","choices":["to algae that live","algae to live","that live to algae","to algae live"],"note":false,"a":0,"fix":"","exp":"해석 : 산호초들은, 그들의 찬란한 색깔들이 산호초군과 공생으로 살고 있는 해초들의 덕분이다. (해초들 덕분에 산호초의 색깔이 찬란하다)\n해설 :\n* Coral reefs = (주어) 산호초.\n* S owe A to B = S의 A는 B 의 덕분이다.\n* owe their brilliant colors to algae = (산호초는) 그들의 찬란한 색깔들이 해초들의 덕분이다.\n* (that live in symbiosis with coral polyps) = (관계 대명사절) 산호초군과 공생으로 살고 있는.\n* in symbiosis with～ = ～와 공생으로.\n* coral polyps = 산호초군.","lesson":14},{"n":413,"type":"error","note":false,"a":1,"fix":"most birds","exp":"해석 : 생존하기 위해서 대부분의 새들은 매일 최소한 그들의 몸무게의 반 정도의 무게의 음식을 먹어야한다.\n해설 :\n* To survive = (부사구) 생존하기 위해서.\n* most birds = (주어) 대부분의 새들.\n* must eat = (동사)\n* at least half their own weight in food = (목적어) 그들의 몸무게의 반 정도의 무게의 음식.\n* half their own weight = 그들의 몸무게의 반.\n* every day = (부사)\n참고 :\n* most of 는 그 뒤에 특정 그룹의  명사를 사용하는 경우 → most of the birds = 이미 언급한 그 특정 그룹의 새들 중에서 대부분.","lesson":14,"parts":[["",null],["To","A"],[" survive, ",null],["most of","B"],[" birds must eat ",null],["at least","C"],[" half ",null],["their own","D"],[" weight in food every day.",null]]},{"n":414,"type":"error","note":false,"a":2,"fix":"rising temperatures","exp":"해석 : 극지방으로부터 먼 지역에서, 상승하는 al effects = (목적어) 해로운 영향.\n* on the nervous system = (부사구) 신경계에.","lesson":16,"parts":[["",null],["Even at","A"],[" low levels, lead produces ",null],["detriment","B"],[" effects ",null],["on","C"],[" the ",null],["nervous","D"],[" system.",null]]},{"n":466,"type":"blank","stem":"--------------------------, solar cells work well and operate for a very long time.","choices":["By protecting from damage","Because protected from damage","If protected from damage","When protection from damage"],"note":true,"a":2,"fix":"","exp":"해석 : 만약 피해로부터 잘 보호된다면, 태양전지는 제대로 일하며 오랜 시간동안 작동한다.\n해설 :\n* If (it is) protected from damage = (부사절) 만약 피해로부터 잘 보호된다면.\n* solar cells = (주어) 태양전지.\n* work well and operate = (동사) 제대로 일하며 작동한다.\n* for a very long time = (부사구) 오랜 시간동안.","lesson":16},{"n":467,"type":"blank","stem":"--------------------------, many people can install ceramic tile floors themselves without professional assistance.","choices":["Because of quick-set adhesives and special trim pieces","Because they are quick-set adhesives and special trim pieces","They are because of quick-set adhesives and special trim pieces","While quick-set adhesives and special trim pieces"],"note":false,"a":0,"fix":"","exp":"해석 : 빨리 마르는 접착제와 특별한 마무리된 조각들 때문에, 많은 사람들이 세라믹 타일 바닥을 전문가의 도움 없이도 스스로 설치할 수 있다.\n해설 :\n* Because of quick-set adhesives and special trim pieces = (부사구) 빨리 마르는 접착제와 특별한 마무리된 조각들 때문에.\n* many people = (주어)\n* can install = (동사) 설치할 수 있다.\n* ceramic tile floors = (목적어) 세라믹 타일 바닥.\n* themselves = (부사) 스스로.\n* without professional assistance = (부사구) 전문가의 도움 없이도.","lesson":16},{"n":468,"type":"blank","stem":"Composed of inlaid colored glass, marble, tile, or gemstone, mosaics are an art form ------------------------------.","choices":["are used in many cultures for decoration","used in many cultures for decoration","for decoration in many cultures used","in decoration many cultures used for"],"note":false,"a":1,"fix":"","exp":"해석 : 내부에 새겨진 색칠된 유리, 대리석, 타일, 또는 보석 등으로 구성되는, 모자이크는 여러 문화  :\n* The art works of Madlyn-Ann Woolwich = (주어) Madlyn-Ann Woolwich 의 미술 작품들.\n* are characterized by ～ = ～라는 특징을 가진다.\n* 이 경우 전치사 be 의 목적어는 두 가지로서 (1) strong, dark colors = 강하고 어두운 색깔,\n(2) fine attention to patterns of light (that attract the viewer's eye) = 관객의 눈길을 끄는 빛의 양상에 관한 훌륭한 촛점.\n참고 :\n* 능동태인 경우는 B characterizes A 와 같이 되어 \u003cB는 A를 특징 지운다.>라고 해석되는데,  이 구문은 A is characterized by B 와 같이 흔히 수동태의 모양으로 사용하여 직역하면, \u003cA는 B에 의해 특징 지워진다.>로 해석할 수도 있지만, 그 보다는 \u003cA는 B라는 특징을 가진다.>로 해석하는 것이 자연스럽다.","lesson":17},{"n":504,"type":"error","note":false,"a":1,"fix":"for","exp":"해석 : 사람들은 주로 두 가지의 기본적인 목적(즉 따뜻함과 장식)을 위해서 옷을 입는다,\n해설 :\n* People usually wear clothing = 사람들은 주로 옷을 입는다.\n* for two basic purposes ― warmth and decoration = 두 가지의 기본적인 목적(즉, 따뜻함과 장식)을 위해서.\n* ― (dash) 는 앞에 나온 말을 구체적으로 설명하거나 구체적인 예를 들어 보여줄 때 흔히 사용된다.","lesson":17,"parts":[["People usually wear ",null],["clothing","A"],[" ",null],["because of","B"],[" two ",null],["basic","C"],[" purposes ― ",null],["warmth","D"],[" and decoration.",null]]},{"n":505,"type":"blank","stem":"Many English settlers -------------------- moved to Canada, where they were known as United Empire Loyalists.","choices":["who were opposed to the American Revolution of 1776","were opposed to the American Revolution of 1776 while","whose opposition to the American Revolution of 1776","that opposed to the American Revolution of 1776 and"],"note":false,"a":0,"fix":"","exp":"해석 : 1776년 미국의 독립전쟁에 반대했던 많은 영국의 정착자들은 캐나다로 이주했다, 그리고 거기서 그들은 \u003c대영제국의 충성주의자들>이라고 알려졌다.\n해설 :\n* Many English settlers (who were opposed to the American Revolution of 1776) = (주어) 1776년 미국의 독립전쟁에 반대했던 많은 영국의 정착자들.\n괄호부분은 관계대명사절로서 앞의 명사를 수식함.\n* be opposed to ～ = ～에 반대하다.\n* moved = 이사갔다. 이주했다.\n* to Canada = (부사) 캐나다로.\n* where they were known as United Empire Loyalists = (관계 부사절) 거기서 그들은 \u003c대영제국의 충성주의자들>이라고 알려졌다.","lesson":17},{"n":506,"type":"error","note":true,"a":1,"fix":"뺀다","exp":"해석 : 열대 삼림은 적도에 가까이 위치한다, 거기서는 높은 온도와 풍부한 강수가 일년 내내 발생한다.\n해설 :\
